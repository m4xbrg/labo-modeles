<!doctype html>
<html lang="fr">
<head>
<!--
  Note de design.
  1. Quatre laboratoires sur la même paillasse, du plus abstrait au plus concret : un nombre par point, une flèche par point, ce qui traverse une surface, puis un vrai fluide dans un tube. La même rampe de pression relie A et D, les mêmes éléments de champ relient B et C.
  2. Le code de la série sert au signe (orange sortant, source, antihoraire ; bleu entrant, puits, horaire). Le rose craie de l'accent est l'outil : gradient, sonde, normale. Le jaune n'apparaît que sur le nombre qui compte.
  3. Rien ne bouge pour décorer : les traceurs suivent le champ calculé, le moulinet tourne au rythme réel du rotationnel, les colonnes des piézomètres montent à p/ρg.
-->
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondations — Flux, gradients, champs et fluides</title>
<meta name="description" content="Quatre laboratoires pour le langage spatial : champs scalaires et gradient, champs vectoriels (divergence, rotationnel), flux, pression et débit dans un conduit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --fond:#0a0d12; --fond-2:#11161e; --trait:#1f2833;
  --texte:#e8e4dc; --texte-2:#8a93a0;
  --accent:#f2b8d8; --acc-a:#c38bff;
  --positif:#ff8a5b; --negatif:#5bb8ff; --energie:#ffd166;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;height:100vh;height:100dvh;min-height:600px}
.scene{grid-column:1;grid-row:1;position:relative;min-height:0;overflow:hidden;background:var(--fond)}
#stage{position:absolute;inset:0}
#stage canvas{display:block}

.head{position:absolute;left:26px;top:20px;pointer-events:none;max-width:70%;z-index:2;isolation:isolate;text-shadow:0 0 14px var(--fond),0 0 6px var(--fond),0 0 2px var(--fond)}
.head::before{content:"";position:absolute;inset:-36px -110px -36px -60px;pointer-events:none;z-index:-1;opacity:.75;background:radial-gradient(ellipse farthest-side at 28% 48%,rgba(10,13,18,.96) 0%,rgba(10,13,18,.88) 52%,rgba(10,13,18,0) 100%)}
.serie{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2);margin:0 0 8px}
h1{font:400 clamp(30px,4.2vw,48px)/1 var(--serif);margin:0;letter-spacing:-.005em}
h1 em{color:var(--accent);font-style:italic}
.back{pointer-events:auto;display:inline-block;margin-top:10px;font:400 12px var(--mono);color:var(--texte-2);text-decoration:none;letter-spacing:.02em;transition:color .3s var(--ease)}
.back:hover{color:var(--texte)}

.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--fond-2);border:1px solid var(--trait);padding:7px 10px;font:400 12px/1.4 var(--mono);color:var(--texte);max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:3}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:500;display:block}.tip span{color:var(--texte-2)}

.panel{grid-column:2;grid-row:1;background:var(--fond-2);border-left:1px solid var(--trait);overflow-y:auto;padding:20px 24px 20px;display:flex;flex-direction:column;gap:16px;min-height:0}
#toyPanel{display:flex;flex-direction:column;gap:16px}
.eyebrow{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2);margin:0 0 10px}
.eyebrow b{color:var(--accent);font-weight:500}
.panel h2{font:400 27px/1.1 var(--serif);margin:0 0 8px}
.txt{margin:0;color:var(--texte);opacity:.9;font-size:14.5px}
.txt+.txt{margin-top:8px}
.swap{animation:swap .55s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.meas{display:grid;gap:0;border-top:1px solid var(--trait)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--trait)}
.lab{font:400 12px var(--mono);color:var(--texte-2)}
.val{font:500 19px var(--mono);display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.val i{font:400 12px var(--mono);color:var(--texte-2);font-style:normal}
.row.small .val{font-size:14px}
.note{font:400 11.5px/1.5 var(--mono);color:var(--texte-2);margin:8px 0 0}
.eq{font:400 13.5px/1.5 var(--mono);background:var(--fond);border-left:2px solid var(--accent);padding:8px 12px;margin:0}
.katex{font-size:1.06em;color:inherit}
.eq .katex{font-size:1.12em}
.tex-bloc{display:block;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.tex-bloc .katex-display{margin:0}
.pos{color:var(--positif)}.neg{color:var(--negatif)}.acc{color:var(--accent)}.ener{color:var(--energie)}.lil{color:var(--acc-a)}.dim{color:var(--texte-2)}
.hints{margin:0;padding:0;list-style:none;font:400 11.5px/1.7 var(--mono);color:var(--texte-2)}
.hints kbd{font:500 11px var(--mono);color:var(--texte);border:1px solid var(--trait);padding:0 5px;border-radius:2px}
.liens{margin-top:auto;display:flex;flex-direction:column;gap:6px;position:sticky;bottom:-20px;background:var(--fond-2);padding:10px 0 20px;margin-bottom:-20px}
.comprendre{display:inline-flex;justify-content:space-between;align-items:center;text-decoration:none;font:500 14px var(--sans);padding:12px 14px;border:1px solid var(--accent);color:var(--accent);transition:background .35s var(--ease),color .35s var(--ease)}
.comprendre:hover{background:var(--accent);color:var(--fond)}

.controls{grid-column:1/-1;grid-row:2;border-top:1px solid var(--trait);background:var(--fond);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
#toyControls{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;flex:1 1 auto;min-width:0}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gl{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);margin-right:2px}
.btn{background:transparent;border:1px solid var(--trait);color:var(--texte);font:400 12px var(--mono);padding:7px 11px;cursor:pointer;line-height:1;border-radius:2px;transition:border-color .3s var(--ease),color .3s var(--ease),background .3s var(--ease);display:inline-flex;align-items:center;gap:7px;min-height:34px}
.btn:hover{border-color:var(--texte-2)}
.btn[aria-pressed="true"],.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:14px;height:14px;display:block;fill:currentColor}
.ico{padding:7px 9px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid currentColor;opacity:.9}
.btn[aria-pressed="true"] .dot{background:currentColor}

.tabs{display:flex;gap:4px;flex:1 0 100%;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--trait)}
.tab{flex:1 1 0;min-width:0;min-height:40px;background:transparent;border:0;border-top:3px solid var(--trait);padding:8px 4px 2px 0;text-align:left;cursor:pointer;font:400 11.5px/1.25 var(--mono);color:var(--texte-2);transition:border-color .35s var(--ease),color .35s var(--ease)}
.tab b{font-weight:500;margin-right:6px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:calc(100% - 28px);vertical-align:bottom}
.tab:hover{color:var(--texte);border-top-color:var(--texte-2)}
.tab[aria-selected="true"]{border-top-color:var(--accent);color:var(--texte)}
.tab[aria-selected="true"] b{color:var(--accent)}

input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:24px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--texte-2)}
input[type=range]::-moz-range-track{height:1px;background:var(--texte-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fond);border:1.5px solid var(--accent);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fond);border:1.5px solid var(--accent)}
.rv{font:500 12px var(--mono);min-width:56px}

@media (max-width:860px){
  .app{display:flex;flex-direction:column;height:auto}
  .scene{order:1;height:62vh;height:62svh;min-height:400px;flex:none}
  .controls{order:2;padding:10px 16px}
  .panel{order:3;border-left:0;border-top:1px solid var(--trait);padding:20px 16px}
  .head{left:16px;top:14px}
  .liens{margin-top:0;position:static;padding:0;margin-bottom:0}
  input[type=range]{width:110px}
}
@media (max-width:640px){
  .tab span{display:none}
  .tab b{margin:0;font-size:13px}
  .tab[aria-selected="true"] span{display:inline-block}
  .tab[aria-selected="true"] b{margin-right:6px}
}
@media (hover:none) and (pointer:coarse){ .kbd{display:none} }
@media (prefers-reduced-motion:reduce){
  .swap{animation:none}
  .tip,.btn,.comprendre,.tab{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <main class="scene" id="scene">
    <div id="stage"></div>
    <header class="head" id="head">
      <p class="serie" id="serie">LABO · Fondations 16 · 20</p>
      <h1 id="titre">Une valeur <em>partout</em></h1>
      <a class="back" href="../../labo/index.html">&larr; LABO</a>
    </header>
    <div class="tip" id="tip"></div>
  </main>

  <aside class="panel" aria-label="Panneau de lecture">
    <div id="toyPanel"></div>
    <section class="kbd">
      <p class="eyebrow">Clavier</p>
      <ul class="hints" id="hints">
        <li><kbd>1</kbd>–<kbd>4</kbd> changer de laboratoire</li>
        <li><kbd>Q</kbd> <kbd>W</kbd> <kbd>E</kbd> <kbd>R</kbd> modes 1 à 4 · <kbd>Espace</kbd> pause · <kbd>0</kbd> réinitialiser</li>
      </ul>
    </section>
    <nav class="liens">
      <a class="comprendre" id="lienComprendre" href="explication.html"><span>Comprendre ce qui se passe</span><span aria-hidden="true">&rarr;</span></a>
    </nav>
  </aside>

  <div class="controls" role="toolbar" aria-label="Contrôles">
    <div class="tabs" role="tablist" aria-label="Les quatre laboratoires" id="tabs"></div>
    <div id="toyControls"></div>
  </div>
</div>

<script>
/* ============ FX : aides communes aux quatre toys ============ */
const FX = (() => {
  'use strict';
  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const C = {
    fond: tok('--fond'), fond2: tok('--fond-2'), trait: tok('--trait'),
    texte: tok('--texte'), texte2: tok('--texte-2'),
    accent: tok('--accent'), lilas: tok('--acc-a'),
    pos: tok('--positif'), neg: tok('--negatif'), ener: tok('--energie'),
    mono: tok('--mono'), sans: tok('--sans'), serif: tok('--serif'),
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MINUS = '−', NNBSP = ' ';
  const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};

  /** rgba depuis #rrggbb */
  function rgba(hex, a) {
    const h = hex.replace('#','');
    return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
  }
  /** Nombre en français : virgule décimale, espace fine pour les milliers, vrai signe moins. */
  function fmt(x, dec = 2) {
    if (!isFinite(x)) return '—';
    if (Math.abs(x) < 0.5 * Math.pow(10, -dec)) x = 0;
    const s = Math.abs(x).toFixed(dec).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP);
    return (x < 0 ? MINUS : '') + s.join(',');
  }
  /** Signe explicite : +1,50 / −1,50 / 0,00 */
  function fmtS(x, dec = 2) { const t = fmt(x, dec); return (x > 0 && t !== fmt(0, dec)) ? '+' + t : t; }
  /** Exposant en chiffres supérieurs : sup(-5) → ⁻⁵ */
  function sup(n) { return String(n).split('').map(c => SUP[c] || c).join(''); }
  /** Notation scientifique : sci(0.00002, 2) → "2,0 × 10⁻⁵" (sig chiffres significatifs) */
  function sci(x, sig = 2) {
    if (x === 0) return '0';
    let e = Math.floor(Math.log10(Math.abs(x)));
    let m = x / Math.pow(10, e);
    if (Math.abs(+m.toFixed(sig - 1)) >= 10) { e += 1; m = x / Math.pow(10, e); }
    return `${fmt(m, sig - 1)} × 10${sup(e)}`;
  }
  /** Ordre de grandeur : puissance de 10 la plus proche (arrondi du log ; 7,5 µm → 10⁻⁵ m) */
  function ordre(x) { return Math.round(Math.log10(Math.abs(x))); }
  /** Graduations « rondes » (1, 2, 5 × 10ⁿ) entre a et b, environ n graduations */
  function niceTicks(a, b, n = 5) {
    if (a === b) { a -= 1; b += 1; }
    const span = Math.abs(b - a), raw = span / n;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p, step = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
    const lo = Math.ceil(Math.min(a, b) / step - 1e-9) * step, out = [];
    for (let v = lo; v <= Math.max(a, b) + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
    out.step = step;
    return out;
  }
  /** Couleur selon le signe (eps : seuil sous lequel on considère 0) */
  function signColor(v, eps = 1e-9) { return v > eps ? C.pos : v < -eps ? C.neg : C.texte2; }
  const mono = (px, w = 400) => `${w} ${px}px ${C.mono}`;
  const sans = (px, w = 400) => `${w} ${px}px ${C.sans}`;

  /**
   * Canevas net en HiDPI qui suit la taille de son parent.
   * const cv = FX.canvas(parentEl, signal, onResize) → { el, ctx, w, h } ; onResize(w, h) appelé à chaque changement.
   * Le contexte est déjà mis à l'échelle : on dessine en pixels CSS.
   */
  function canvas(parent, signal, onResize, cssText = 'position:absolute;inset:0;width:100%;height:100%') {
    const el = document.createElement('canvas');
    el.style.cssText = cssText;
    parent.appendChild(el);
    const o = { el, ctx: el.getContext('2d'), w: 0, h: 0 };
    const fit = () => {
      const r = el.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2.5);
      const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      if (w === o.w && h === o.h && el.width === Math.round(w * d)) return;
      o.w = w; o.h = h; el.width = Math.round(w * d); el.height = Math.round(h * d);
      o.ctx.setTransform(d, 0, 0, d, 0, 0);
      onResize && onResize(w, h);
    };
    const ro = new ResizeObserver(fit); ro.observe(el);
    signal && signal.addEventListener('abort', () => ro.disconnect());
    fit();
    return o;
  }
  /** Boucle d'animation : fn(dt en s, t en s) à chaque image jusqu'à l'annulation du signal. dt plafonné à 0,05 s. */
  function loop(fn, signal) {
    let last = performance.now(), id = 0;
    const step = now => {
      if (signal && signal.aborted) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      fn(dt, now / 1000);
      id = requestAnimationFrame(step);
    };
    id = requestAnimationFrame(step);
    signal && signal.addEventListener('abort', () => cancelAnimationFrame(id));
  }
  /** Flèche de (x1,y1) à (x2,y2) */
  function arrow(c, x1, y1, x2, y2, color, width = 2, head = 9) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    c.save(); c.strokeStyle = color; c.fillStyle = color; c.lineWidth = width; c.lineCap = 'round';
    if (L < 0.5) { c.restore(); return; }
    const hd = Math.min(head, L * 0.6), ux = dx / L, uy = dy / L;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2 - ux * hd * 0.8, y2 - uy * hd * 0.8); c.stroke();
    c.beginPath(); c.moveTo(x2, y2);
    c.lineTo(x2 - ux * hd - uy * hd * 0.45, y2 - uy * hd + ux * hd * 0.45);
    c.lineTo(x2 - ux * hd + uy * hd * 0.45, y2 - uy * hd - ux * hd * 0.45);
    c.closePath(); c.fill(); c.restore();
  }
  /** Étiquette sur un petit fond sombre, lisible par-dessus n'importe quel tracé */
  function tag(c, text, x, y, color = C.texte, align = 'left', base = 'middle', px = 11) {
    c.save(); c.font = mono(px); c.textAlign = align; c.textBaseline = base;
    const w = c.measureText(text).width, h = px + 4;
    let bx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    let by = base === 'middle' ? y - h / 2 : base === 'bottom' ? y - h : y;
    c.fillStyle = rgba(C.fond, 0.82); c.fillRect(bx - 3, by, w + 6, h);
    c.fillStyle = color; c.fillText(text, x, y + (base === 'top' ? 2 : base === 'bottom' ? -2 : 0));
    c.restore();
  }
  /** Infobulle partagée : FX.tip(html, xClient, yClient) ; FX.tip(null) pour cacher */
  const tipEl = document.getElementById('tip'), sceneEl = document.getElementById('scene');
  function tip(html, cx, cy) {
    if (!html) { tipEl.classList.remove('on'); return; }
    tipEl.innerHTML = html; tipEl.classList.add('on');
    const r = sceneEl.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    let x = cx - r.left + 14, y = cy - r.top + 14;
    if (x + tw > r.width - 8) x = cx - r.left - tw - 14;
    if (y + th > r.height - 8) y = cy - r.top - th - 14;
    tipEl.style.transform = 'none';
    tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
  }
  /** Rectangle occupé par l'en-tête, en coordonnées du #stage (pour ne rien y placer d'important) */
  function headRect() {
    const s = document.getElementById('stage').getBoundingClientRect(), h = document.getElementById('head').getBoundingClientRect();
    return { x: h.left - s.left, y: h.top - s.top, w: h.width, h: h.height, bottom: h.bottom - s.top, right: h.right - s.left };
  }
  /** Boutons segmentés de modes : FX.modes(parent, [{id,label,title}], actif, onChange) → { set(id) } */
  function modes(parent, list, active, onChange, signal) {
    const g = document.createElement('div'); g.className = 'grp'; g.setAttribute('role', 'group');
    g.innerHTML = `<span class="gl">Mode</span>` + list.map(m => `<button class="btn" data-m="${m.id}" title="${m.title || m.label}" aria-pressed="false">${m.label}</button>`).join('');
    parent.appendChild(g);
    const set = id => { g.querySelectorAll('.btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === id))); };
    g.addEventListener('click', e => { const b = e.target.closest('.btn'); if (b) { set(b.dataset.m); onChange(b.dataset.m); } }, { signal });
    set(active);
    return { el: g, set };
  }
  /** Le focus est-il dans un champ où les touches ont un sens propre ? */
  function typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }

  /**
   * Formules (KaTeX, chargé depuis cdnjs). Repli lisible en texte Unicode si KaTeX est absent (hors ligne).
   * FX.k(String.raw`\sqrt{A_x^2 + A_y^2}`, '√(Ax² + Ay²)') → chaîne HTML à insérer dans un gabarit.
   * FX.k(tex, repli, true) → formule en mode bloc (centrée, plus grande).
   * FX.tex(racine) → rend tous les éléments [data-tex] (repli = leur texte actuel ; classe .tex-bloc = mode bloc).
   * Couleurs dans une formule (String.raw`…` évite de doubler les barres obliques inverses) : \textcolor{#ff8a5b}{\Delta x}. Prévoir les formules statiques ; les valeurs
   * qui changent à chaque image restent en texte mono à côté (plus rapide, et les chiffres ne sautent pas).
   */
  const hasK = () => typeof window.katex !== 'undefined';
  function k(tex, repli = tex, bloc = false) {
    if (!hasK()) return `<span class="m">${repli}</span>`;

      /** Marching squares : environ 12 isolignes équidistantes en valeur (pas « rond ») */

        for (let cm = 0; cm <= 10; cm += 2) { const x = Math.round(GX(cm / 100)) + 0.5; c.moveTo(x, g.gy); c.lineTo(x, g.gy + g.gh); }
        const ticks = FX.niceTicks(ymin, ymax, 4); ticks.forEach(v => { const y = Math.round(GY(v)) + 0.5; c.moveTo(g.gx, y); c.lineTo(g.gx + g.gw, y); }); c.stroke();
        c.strokeStyle = rgba(C.texte, 0.7); c.beginPath(); c.moveTo(g.gx + 0.5, g.gy - 4); c.lineTo(g.gx + 0.5, g.gy + g.gh + 0.5); c.lineTo(g.gx + g.gw + 4, g.gy + g.gh + 0.5); c.stroke();
        c.strokeStyle = rgba(C.texte2, 0.7); c.setLineDash([2, 3]); c.beginPath(); c.moveTo(g.gx, GY(0) + 0.5); c.lineTo(g.gx + g.gw, GY(0) + 0.5); c.stroke(); c.setLineDash([]);
        const fs = g.mob ? 9.5 : 10.5; c.font = FX.mono(fs); c.fillStyle = C.texte2; c.textAlign = 'right'; c.textBaseline = 'middle';
        ticks.forEach(v => c.fillText(mode4 ? fmt(v, 1) : (Math.abs(v) >= 1000 ? fmt(v / 1000, 1) + 'k' : fmt(v, Math.abs(v) < 10 && v % 1 ? 1 : 0)), g.gx - 6, GY(v)));
        c.textAlign = 'center'; c.textBaseline = 'top'; for (let cm = 0; cm <= 10; cm += 2) c.fillText(String(cm), GX(cm / 100), g.gy + g.gh + 5);
        c.textAlign = 'left'; c.fillStyle = C.texte; c.textBaseline = 'bottom'; c.fillText(unitTxt, g.gx - (g.mob ? 38 : 60), g.gy - 8); c.textAlign = 'right'; c.fillText('x (cm)', g.gx + g.gw, g.gy + g.gh + (g.mob ? 22 : 24));
        const path = (arr, f) => { c.beginPath(); for (let i = 0; i <= N; i += 2) { const x = GX(i * s.dx), y = GY(arr[i] * f); i ? c.lineTo(x, y) : c.moveTo(x, y); } };
        // autre fluide (mode 4)
        if (sref) { c.strokeStyle = rgba(C.texte2, 0.9); c.lineWidth = 1.6; c.setLineDash([5, 4]); path(sref.arrays.p, 1 / sref.dP); c.stroke(); c.setLineDash([]); FX.tag(c, FLUIDS[ref].nom.toLowerCase(), GX(0.095), GY(sref.arrays.p[N - 8] / sref.dP) - 10, C.texte2, 'right', 'middle', fs); }
        // part de frottement (mode 4)
        if (mode4) { c.strokeStyle = rgba(C.texte2, 0.6); c.lineWidth = 1.2; path(s.arrays.pf, sc); c.stroke(); }
        // part de Bernoulli en tireté
        c.save(); c.strokeStyle = rgba(C.neg, 0.95); c.lineWidth = 1.6; c.setLineDash([4, 4]); path(s.arrays.pb, sc); c.stroke(); c.restore();
        // pression totale
        c.strokeStyle = C.texte; c.lineWidth = 2.4; c.lineJoin = 'round'; path(s.arrays.p, sc); c.stroke();
        // piézomètres sur la courbe
        XP.forEach(xp => { c.fillStyle = C.fond; c.strokeStyle = C.accent; c.lineWidth = 1.6; c.beginPath(); c.arc(GX(xp), GY(s.p(xp) * sc), 3.4, 0, TAU); c.fill(); c.stroke(); });
        // légende
        const ly = g.gy + 12;
        const lx = g.gx + g.gw - 8;
        FX.tag(c, mode4 ? `${FLUIDS[st.fluide].nom.toLowerCase()} : p total` : 'p(x) : pression totale', lx, ly, C.texte, 'right', 'middle', fs);
        FX.tag(c, 'part Bernoulli −½ρ(v̄² − v̄₀²)' + (g.mob ? '' : ' (tireté)'), lx, ly + fs + 6, C.neg, 'right', 'middle', fs);
        if (mode4) FX.tag(c, 'part frottement', lx, ly + 2 * (fs + 6), C.texte2, 'right', 'middle', fs);
        // annotation du creux de Venturi
        if (mode4) {
          const pbn = s.pb(0.05) * sc; if (Math.abs(pbn) > 0.01) FX.tag(c, `creux : ${fmt(s.pb(0.05), Math.abs(s.pb(0.05)) < 1 ? 3 : 1)} Pa`, GX(0.05), GY(pbn) - 12, C.neg, 'center', 'middle', fs);
        }
        if (st.mode === 'pression') FX.tag(c, g.mob ? 'écoulement vers p plus basse →' : 'poussé globalement vers p plus basse →', g.gx + g.gw - 6, g.gy + g.gh * 0.55, C.texte2, 'right', 'middle', fs);
        // étiquettes des tronçons
        c.fillStyle = C.texte2; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.font = FX.mono(fs - 0.5);
        [[0.02, 'L₁ 4 cm'], [0.05, 'L₂ 2 cm'], [0.08, 'L₃ 4 cm']].forEach(([x, t]) => c.fillText(t, GX(x), g.gy - 4));
      }

      function drawQGraph(c, W, H) {
        const s = S(); c.clearRect(0, 0, W, H);
        const pl = 38, pr = 10, pt = 16, pb = 40, x0 = pl, y0 = H - pb, w = W - pl - pr, h = H - pt - pb;
        const xm = niceCeil(st.dP * 1.7), ym = xm / s.R * 1e6;
        const sx = v => x0 + v / xm * w, sy = v => y0 - v / ym * h;
        c.strokeStyle = C.trait; c.lineWidth = 1; c.beginPath();
        FX.niceTicks(0, xm, 4).forEach(v => { const x = Math.round(sx(v)) + 0.5; c.moveTo(x, pt); c.lineTo(x, y0); });
        FX.niceTicks(0, ym, 3).forEach(v => { const y = Math.round(sy(v)) + 0.5; c.moveTo(x0, y); c.lineTo(x0 + w, y); }); c.stroke();
        c.strokeStyle = rgba(C.texte, 0.7); c.beginPath(); c.moveTo(x0 + 0.5, pt - 4); c.lineTo(x0 + 0.5, y0 + 0.5); c.lineTo(x0 + w + 4, y0 + 0.5); c.stroke();
        c.font = FX.mono(10); c.fillStyle = C.texte2; c.textAlign = 'center'; c.textBaseline = 'top';
        FX.niceTicks(0, xm, 4).forEach(v => c.fillText(v >= 1000 ? fmt(v / 1000, 1) + 'k' : fmt(v, 0), sx(v), y0 + 5));
        c.textAlign = 'right'; c.textBaseline = 'middle'; FX.niceTicks(0, ym, 3).forEach(v => c.fillText(fmt(v, ym < 1 ? 3 : ym < 10 ? 2 : 1), x0 - 5, sy(v)));
        c.fillStyle = C.texte; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText('ΔP (Pa)', x0 + w, H - 3); c.textAlign = 'left'; c.fillText('Q (mL/s)', 2, pt - 4);
        c.strokeStyle = C.texte; c.lineWidth = 2; c.beginPath(); c.moveTo(sx(0), sy(0)); c.lineTo(sx(xm), sy(xm / s.R * 1e6)); c.stroke();
        const qx = sx(st.dP), qy = sy(s.Q * 1e6);
        c.strokeStyle = rgba(C.ener, 0.6); c.lineWidth = 1; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(qx, y0); c.lineTo(qx, qy); c.lineTo(x0, qy); c.stroke(); c.setLineDash([]);
        c.fillStyle = C.fond; c.strokeStyle = C.ener; c.lineWidth = 2.2; c.beginPath(); c.arc(qx, qy, 5, 0, TAU); c.fill(); c.stroke();
      }

      function drawBanner(c, s) {
        const mob = g.mob, fs = mob ? 10.5 : 12, y = g.bottom + 2;
        c.font = FX.mono(fs);
        if (s.turb) {
          const lines = wrap(c, 'Régime turbulent probable : hors du modèle (le débit réel serait plus faible).', g.W - 24), h = lines.length * (fs + 4) + 8;
          c.fillStyle = rgba(C.pos, 0.16); c.fillRect(12, y, g.W - 24, h); c.strokeStyle = C.pos; c.lineWidth = 1; c.strokeRect(12.5, y + 0.5, g.W - 25, h - 1);
          c.fillStyle = C.pos; c.textAlign = 'left'; c.textBaseline = 'middle'; lines.forEach((l, i) => c.fillText(l, 20, y + 4 + (i + 0.5) * (fs + 4)));
          c.fillStyle = C.texte2; c.textBaseline = 'alphabetic';
        }
        const capY = g.H - 10; c.font = FX.mono(mob ? 9.5 : 11); c.fillStyle = C.texte2; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
        c.fillText(`diamètres ×${g.k} · temps : ${tfText(st.tf)}${st.mode === 'debit' || !g.mob ? ` · Re = ${fmt(s.ReMax, s.ReMax < 10 ? 2 : 0)}` : ''}`, 12, capY);
      }

      /* ====================== ENTRÉES ====================== */
      let hoverHit = null, drag = null;
      const pt = e => { const r = cv.el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      function hit(p) {
        const s = S();
        if (st.mode === 'resistance') {
          const x = X(st.xc), r = s.r(st.xc) * g.sy;
          if (Math.abs(p.x - x) <= 12 && p.y >= g.yc - r - 24 && p.y <= g.yc + r + 10) return { k: 'cut' };
        }
        for (let i = 0; i < XP.length; i++) { const L = piezoLabel[i]; if (L && Math.abs(p.x - L.x) <= 12 && p.y >= Math.min(L.yl, g.yc) - 14 && p.y <= Math.max(L.yl, g.yc) + 14 && (p.y < g.yc - s.r(XP[i]) * g.sy + 4 || p.y > g.yc + s.r(XP[i]) * g.sy - 4)) return { k: 'pz', i }; }
        if (st.mode === 'debit') for (let i = 0; i < XG.length; i++) { const r = s.r(XG[i]) * g.sy; if (Math.abs(p.x - X(XG[i])) <= 9 && p.y >= g.yc - r - 8 && p.y <= g.gateY + 16) return { k: 'gate', i }; }
        const xm = (p.x - g.x0) / g.sx;
        if (xm >= 0 && xm <= LT && Math.abs(p.y - g.yc) <= s.r(xm) * g.sy) return { k: 'tube', x: xm };
        return null;
      }
      function tipFor(h) {
        const s = S(); if (!h) return null;
        if (h.k === 'pz') { const L = piezoLabel[h.i]; return `<b>Piézomètre ${h.i + 1}${h.i === 2 ? ' · col' : ''}</b>h = p/(ρg) = ${hU(L.h)}<br><span>p = ${pU(L.p).join(' ')} au point x = ${fmt(XP[h.i] * 100, 0)} cm. La colonne monte à la hauteur qui équilibre la pression.</span>`; }
        if (h.k === 'gate') { const A = h.i === 1 ? s.A2 : s.A1, v = h.i === 1 ? s.v2 : s.v1; return `<b>Porte de comptage ${h.i + 1}</b>A = ${areaU(A).join(' ')} · v̄ = ${velU(v).join(' ')}<br><span>A · v̄ = ${flowU(A * v).join(' ')} : le même débit à chaque porte.</span>`; }
        if (h.k === 'cut') return `<b>Coupe transversale</b>v̄ = ${velU(s.vbar(st.xc)).join(' ')} · au centre ${velU(2 * s.vbar(st.xc)).join(' ')}<br><span>Glisse-la le long du tube. Profil parabolique : le fluide colle à la paroi.</span>`;
        if (h.k === 'tube') return `<b>Fluide · x = ${fmt(h.x * 100, 1)} cm</b>p = ${pU(s.p(h.x)).join(' ')} · v̄ = ${velU(s.vbar(h.x)).join(' ')}<br><span>La couleur est la pression : claire en amont, sombre vers la sortie.</span>`;
        return null;
      }
      cv.el.addEventListener('pointerdown', e => {
        const p = pt(e), h = hit(p); if (!h || h.k !== 'cut') return;
        e.preventDefault(); cv.el.setPointerCapture(e.pointerId); drag = { id: e.pointerId }; FX.tip(null);
      }, { signal });
      cv.el.addEventListener('pointermove', e => {
        const p = pt(e);
        if (drag && drag.id === e.pointerId) { st.xc = clamp((p.x - g.x0) / g.sx, 0.003, LT - 0.003); return; }
        const h = hit(p); hoverHit = h; cv.el.style.cursor = h && h.k === 'cut' ? 'ew-resize' : 'default';
        if (e.pointerType === 'touch') return;
        const html = tipFor(h); if (html) FX.tip(html, e.clientX, e.clientY); else FX.tip(null);
      }, { signal });
      const end = e => { if (drag && drag.id === e.pointerId) drag = null; };
      cv.el.addEventListener('pointerup', end, { signal });
      cv.el.addEventListener('pointercancel', end, { signal });
      cv.el.addEventListener('pointerleave', () => { hoverHit = null; FX.tip(null); }, { signal });

      window.addEventListener('keydown', e => {
        if (FX.typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
        const k = e.key, tg = e.target, onBtn = tg && tg.tagName === 'BUTTON', onRng = tg && tg.tagName === 'INPUT';
        const map = { q: 'debit', w: 'pression', e: 'resistance', r: 'retrecissement' };
        if (map[k.toLowerCase()]) { setMode(map[k.toLowerCase()]); e.preventDefault(); }
        else if (k === ' ' || k === 'Spacebar') { if (onBtn || onRng) return; setPlaying(!st.playing); e.preventDefault(); }
        else if (k === '0') resetAll();
      }, { signal });

      /* ====================== BOUCLE D'ANIMATION ====================== */
      let initDone = false;
      FX.loop(dt => {
        const c = cv.ctx, W = cv.w, H = cv.h, s = S();
        layout(W, H);
        if (!initDone) { initDone = true; initTracers(); recal(); }
        if (st.playing) stepTracers(dt);
        // axe des piézomètres : plage ronde, animée
        let hm = 0; for (const xp of XP) hm = Math.max(hm, s.p(xp) / (s.rho * G));
        const target = niceCeil(Math.max(hm * 1.12, 1e-3));
        st.hAxis += (target - st.hAxis) * (FX.reduced ? 1 : Math.min(1, dt * 7));
        c.clearRect(0, 0, W, H);
        const hs = drawRuler(c, s);
        drawTube(c, s);
        drawPiezo(c, s, hs, st.mode === 'pression');
        drawTracers(c, s, st.mode === 'debit');
        if (st.mode === 'debit') drawGates(c, s, true); else if (st.mode !== 'resistance') drawGates(c, s, false);
        if (st.mode === 'resistance') { drawSection(c, s); drawResTags(c, s); }
        drawPiezoLabels(c);
        FX.tag(c, 'entrée', g.x0, g.yc + g.band / 2 + 2 + (st.mode === 'resistance' ? 0 : 0), C.texte2, 'left', 'middle', g.mob ? 9.5 : 10.5);
        FX.tag(c, 'sortie : p = 0', g.x1, g.yc + g.band / 2 + 2, C.texte2, 'right', 'middle', g.mob ? 9.5 : 10.5);
        drawGraph(c, s);
        drawBanner(c, s);
        updatePanel();
        if (st.mode === 'pression' && qcv.w > 10) drawQGraph(qcv.ctx, qcv.w, qcv.h);
      }, signal);

      setMode('debit');
    },
    unmount() { FX.tip(null); },
  });
})();
</script>

<script>
/* ============ Coquille : onglets, montage et démontage des toys ============ */
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const tabsEl = $('#tabs'), stage = $('#stage'), panel = $('#toyPanel'), controls = $('#toyControls');
  const ordre = ['scalaire', 'vectoriel', 'flux', 'conduit'];
  const toys = ordre.map(id => FX.toys.find(t => t.id === id)).filter(Boolean);
  let cur = null, ctrl = null;

  tabsEl.innerHTML = toys.map((t, i) =>
    `<button class="tab" role="tab" data-i="${i}" aria-selected="false" title="${t.num} · ${t.titre} (${i + 1})"><b>${t.num}</b><span>${t.titre}</span></button>`).join('');

  function show(i, push = true) {
    const t = toys[i]; if (!t || t === cur) return;
    if (ctrl) ctrl.abort();
    if (cur && cur.unmount) { try { cur.unmount(); } catch (e) { console.error(e); } }
    FX.tip(null);
    stage.innerHTML = ''; panel.innerHTML = ''; controls.innerHTML = '';
    document.querySelectorAll('.extra-hint').forEach(n => n.remove());
    ctrl = new AbortController(); cur = t;
    tabsEl.querySelectorAll('.tab').forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
    $('#serie').textContent = `LABO · Fondations 16 · 20 — ${t.num} · ${t.titre}`;
    $('#titre').innerHTML = t.titreHtml || t.titre;
    $('#lienComprendre').href = `explication.html#${t.id}`;
    document.title = `${t.titre} — LABO`;
    if (t.hints) $('#hints').insertAdjacentHTML('beforeend', t.hints.map(h => `<li class="extra-hint">${h}</li>`).join(''));
    t.mount({ scene: stage, panel, controls, signal: ctrl.signal });
    FX.tex(panel); FX.tex(controls);
    panel.classList.remove('swap'); void panel.offsetWidth; panel.classList.add('swap');
    if (push) history.replaceState(null, '', '#' + t.id);
  }

  tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.i); });
  addEventListener('keydown', e => {
    if (FX.typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = +e.key; if (k >= 1 && k <= toys.length) { show(k - 1); e.preventDefault(); }
  });
  addEventListener('hashchange', () => { const i = toys.findIndex(t => '#' + t.id === location.hash); if (i >= 0) show(i, false); });
  const i0 = toys.findIndex(t => '#' + t.id === location.hash);
  show(i0 >= 0 ? i0 : 0, false);
})();
</script>
</body>
