<!--
  Note de design.
  1. Fondations : même paillasse sombre que la série, un seul vocabulaire visuel du début à la fin. Un individu est un petit corps ondulant, une copie du gène est une perle, une fréquence est une barre empilée ou une courbe p(t), une distribution est un histogramme sauge, une attente théorique est un tireté fin.
  2. Le hasard est réel et contrôlé : tout vient d'un générateur semé (mulberry32). « Nouveau tirage » change l'histoire, « Rejouer le même tirage » la refait à l'identique. Les générations sont discrètes et non chevauchantes ; l'étape A1 les décompose en quatre phases (vivre, sélection, reproduction, relève).
  3. Les moments forts passent par la forme : en A1 aucun individu ne change de couleur mais la population, si ; en D1 chaque perle est reliée à la copie dont elle descend, sans aucun avantage, et les fréquences bougent quand même.
-->

<script>
/* POPGEN-BEGIN */
// Moteur stochastique de « Évolution et génétique des populations » (module 40).
// Tout le hasard passe par un générateur semé : même graine = même histoire.
// Conventions : générations discrètes et non chevauchantes ; « copie » = une copie du gène
// (un individu diploïde en porte deux) ; fréquences dans [0, 1].

const PG = (() => {

  // ---------- Hasard ----------
  function makeRng(seed) {                       // mulberry32
    let a = (seed >>> 0) || 1;
    const r = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.seed = seed;
    return r;
  }
  function normal(rng) {                         // Box-Muller
    let u = 0; while (u === 0) u = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng());
  }
  function binomial(n, p, rng) {                 // exact (somme de Bernoulli) : n ≤ quelques milliers ici
    if (p <= 0) return 0; if (p >= 1) return n;
    let k = 0; for (let i = 0; i < n; i++) if (rng() < p) k++;
    return k;
  }
  function randInt(n, rng) { return Math.floor(rng() * n); }
  function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1, rng); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
  function reflect01(x) { while (x < 0 || x > 1) { if (x < 0) x = -x; if (x > 1) x = 2 - x; } return x; }

  // ---------- 1. Trait continu (A1, A2, B1) ----------
  // Chaque individu : un génotype g (héritable) et un phénotype z = g + bruit d'environnement.
  // z ∈ [0, 1] : la coloration, de sombre (0) à clair (1).
  // Variance totale fixe V = σ² ; h2 = part génétique de la variance au départ.
  const TRAIT = { N: 240, sigma: 0.15, mean0: 0.5, sigmaMut: 0.006, wMin: 0.04, width: 0.12 };

  function traitInit(o, rng) {
    const N = o.N || TRAIT.N, h2 = o.h2 == null ? 0.8 : o.h2, m = o.mean == null ? TRAIT.mean0 : o.mean;
    const sg = TRAIT.sigma * Math.sqrt(h2), se = TRAIT.sigma * Math.sqrt(1 - h2);
    const g = new Float64Array(N), z = new Float64Array(N), id = new Int32Array(N), parent = new Int32Array(N).fill(-1);
    for (let i = 0; i < N; i++) { g[i] = reflect01(m + sg * normal(rng)); z[i] = reflect01(g[i] + se * normal(rng)); id[i] = i; }
    return { N, g, z, id, parent, gen: 0, h2, se, nextId: N };
  }

  // Probabilité de survie (jusqu'à la reproduction) selon la coloration et l'environnement.
  // env : 'none' (pas de prédateur), 'dark' (fond sombre : les clairs se voient), 'light' (fond clair),
  // 'mid' (fond moyen : sélection stabilisante), 'patchy' (fond tacheté sombre/clair : disruptive).
  // s ∈ [0, 1] : intensité. Seul le rapport entre survies compte (fitness relative).
  function survival(z, env, s, harsh) {
    let w = 1;
    const W = TRAIT.width, d = z - 0.5, gauss = Math.exp(-d * d / (2 * W * W));
    if (env === 'dark') w = 1 - s * z;
    else if (env === 'light') w = 1 - s * (1 - z);
    else if (env === 'mid') w = 1 - s * (1 - gauss);
    else if (env === 'patchy') w = 1 - s * gauss;
    w = Math.max(TRAIT.wMin, w);
    return harsh ? w * 0.5 : w;                  // « environnement rude » : toutes les survies × 0,5
  }

  // Une génération en deux temps, pour pouvoir l'animer : 1) qui survit ; 2) qui naît de qui.
  function traitSurvive(pop, env, s, rng, harsh) {
    const alive = new Uint8Array(pop.N);
    for (let i = 0; i < pop.N; i++) alive[i] = rng() < survival(pop.z[i], env, s, harsh) ? 1 : 0;
    return alive;
  }
  function traitReproduce(pop, alive, rng, o) {
    o = o || {};
    const sm = o.sigmaMut == null ? TRAIT.sigmaMut : o.sigmaMut, N = o.N || pop.N;
    const surv = []; for (let i = 0; i < pop.N; i++) if (alive[i]) surv.push(i);
    if (surv.length === 0) return null;          // extinction
    const g = new Float64Array(N), z = new Float64Array(N), id = new Int32Array(N), parent = new Int32Array(N);
    for (let j = 0; j < N; j++) {
      const p = surv[randInt(surv.length, rng)]; // reproduction : parent tiré au hasard parmi les survivants
      parent[j] = p;
      g[j] = reflect01(pop.g[p] + sm * normal(rng));
      z[j] = reflect01(g[j] + pop.se * normal(rng));
      id[j] = pop.id[p];                         // lignée : l'identifiant de l'ancêtre fondateur
    }
    // Ordonner les enfants par parent : seulement pour l'affichage (l'ordre n'a pas de sens biologique).
    const ord = Array.from({ length: N }, (_, k) => k).sort((a, b) => parent[a] - parent[b]);
    const pick = (arr, T) => { const out = new T(N); for (let k = 0; k < N; k++) out[k] = arr[ord[k]]; return out; };
    return { N, g: pick(g, Float64Array), z: pick(z, Float64Array), id: pick(id, Int32Array), parent: pick(parent, Int32Array),
             gen: pop.gen + 1, h2: pop.h2, se: pop.se, nextId: pop.nextId };
  }
  function traitGeneration(pop, env, s, rng, o) {
    const alive = traitSurvive(pop, env, s, rng, o && o.harsh);
    const next = traitReproduce(pop, alive, rng, o);
    return { alive, next };
  }
  function meanVar(a, mask) {
    let n = 0, m = 0, q = 0;
    for (let i = 0; i < a.length; i++) if (!mask || mask[i]) { n++; const d = a[i] - m; m += d / n; q += d * (a[i] - m); }
    return { n, mean: n ? m : NaN, var: n > 1 ? q / (n - 1) : 0, sd: n > 1 ? Math.sqrt(q / (n - 1)) : 0 };
  }
  function traitStats(pop, alive) {
    const z = meanVar(pop.z), g = meanVar(pop.g);
    const r = { N: pop.N, gen: pop.gen, meanZ: z.mean, sdZ: z.sd, meanG: g.mean, varG: g.var, varZ: z.var,
                h2now: z.var > 0 ? Math.min(1, g.var / z.var) : 0 };
    if (alive) { const zs = meanVar(pop.z, alive); r.survivors = zs.n; r.S = zs.mean - z.mean; } // différentielle de sélection
    return r;
  }
  function histogram(a, bins, lo, hi, mask) {
    lo = lo == null ? 0 : lo; hi = hi == null ? 1 : hi;
    const h = new Float64Array(bins);
    for (let i = 0; i < a.length; i++) if (!mask || mask[i]) { let k = Math.floor((a[i] - lo) / (hi - lo) * bins); if (k < 0) k = 0; if (k >= bins) k = bins - 1; h[k]++; }
    return h;
  }
  const erf = x => { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
  const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
  // Génération suivante ATTENDUE (sans hasard) : chaque individu pèse sa survie ;
  // ses descendants ont le phénotype g ± bruit d'environnement. Rend un histogramme de N individus.

  if (fadeA < 1) { c.fillStyle = rgba(RGB.fd, 1 - fadeA); c.fillRect(0, 0, W, H); }
}
function drawSec() {
  const S = ST[idx]; if (!S.sec) return; const w = secC.width / dpr, h = secC.height / dpr; sx.setTransform(dpr, 0, 0, dpr, 0, 0); sx.clearRect(0, 0, w, h); S.sec.draw(sx, w, h);
  const lg = S.sec.leg(); if (lg !== legLast) { legLast = lg; $('#secLeg').innerHTML = lg; }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  const dr = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now;
  if (fadeDir !== 0) {
    if (fadeDir < 0) { fadeA -= dr / 0.16; if (fadeA <= 0.05) { fadeA = 0.05; initStep(pending); pending = -1; fadeDir = 1; } }
    else { fadeA += dr / 0.4; if (fadeA >= 1) { fadeA = 1; fadeDir = 0; } }
  } else {
    const S = ST[idx]; if (S.tick) S.tick(dr * TS, playing);
    if (S.rate && playing) { accum += dr * TS * S.rate; let n = 0; while (accum >= 1 && n < 4) { accum -= 1; S.gen(1); n++; } if (accum > 4) accum = 0; }
  }
  drawScene(); drawSec();
  if (now - lastRead > 100) { readouts(); lastRead = now; }
}

/* ---------------- Crochet de vérification (lecture seule pour la QA) ---------------- */
window.__evo = {
  step: () => idx,
  go: i => { goStep(i, true); },
  setParam: (n, v) => setParam(n, v),
  seed: n => { seed = (n >>> 0) || 1; syncSeed(); restart(); },
  gen: n => { ST[idx].gen(Math.max(0, n | 0)); readouts(); },
  found: () => { if (idx === 7) { ST[7].found(); readouts(); } },
  state: () => ST[idx].state()
};

syncSeed(); resize(); initStep(0); requestAnimationFrame(frame);
})();
