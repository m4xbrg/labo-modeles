<!doctype html>
<html lang="fr">
<head>
<!--
  Note de design.
  1. Une seule boîte, un seul moteur : une vraie dynamique moléculaire 2D (Verlet, Lennard-Jones) sert huit actes sur neuf ; d'un acte à l'autre on ne change que les conditions (énergie, piston, cloison, membrane, parois chaudes, attraction), jamais les lois.
  2. La couleur d'une molécule est sa vitesse, sur une rampe qui finit dans le jaune « énergie » de la série : chauffer un gaz le fait littéralement virer au jaune. A et eau en sable, B et soluté en lilas ; orange et bleu restent réservés aux charges.
  3. Chaque nombre du panneau est mesuré sur les particules (chocs comptés, force sur les parois, traversées d'une ligne, énergie injectée) puis lissé ; la théorie (Maxwell, NkT/A, binomiale, van 't Hoff) n'apparaît qu'en tireté, pour comparaison.
-->

<style>
:root{
  --fond:#0a0d12; --fond-2:#11161e; --trait:#1f2833;
  --texte:#e8e4dc; --texte-2:#8a93a0;
  --accent:#dcc29a;

}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;height:100vh;height:100dvh;min-height:600px}
.scene{grid-column:1;grid-row:1;position:relative;min-height:0;overflow:hidden;background:var(--fond)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cv.hand{cursor:ew-resize}

.head{position:absolute;left:26px;top:20px;pointer-events:none;max-width:70%;text-shadow:0 0 14px var(--fond),0 0 6px var(--fond)}
.serie{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2);margin:0 0 8px}

.back{pointer-events:auto;display:inline-block;margin-top:10px;font:400 12px var(--mono);color:var(--texte-2);text-decoration:none;transition:color .3s var(--ease)}

.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--fond-2);border:1px solid var(--trait);padding:7px 10px;font:400 12px/1.4 var(--mono);color:var(--texte);max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:3}

.panel{grid-column:2;grid-row:1;background:var(--fond-2);border-left:1px solid var(--trait);overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;min-height:0}

h2{font:400 27px/1.1 var(--serif);margin:0 0 8px}
#stepText{margin:0;opacity:.92;font-size:14.5px}

<body>
<div class="app">
  <main class="scene" id="scene">
    <canvas id="cv" role="img" aria-label="Boîte de molécules vues de dessus : chaque point est une molécule qui se déplace et rebondit ; sa couleur indique sa vitesse."></canvas>
    <header class="head">
      <p class="serie">L’invisible en mouvement — 07</p>
      <h1>Matière, <em>chaleur</em> et transport</h1>
      <a class="back" href="../index.html">&larr; Accueil de la série</a>
    </header>
    <div class="tip" id="tip"></div>
  </main>

  <aside class="panel" aria-label="Panneau de lecture">
    <section>
      <p class="eyebrow" id="eyebrow">Acte <b>I</b> sur IX</p>
      <h2 id="stepTitle"></h2>

    </section>
    <section>
      <p class="eyebrow" id="chartEye">Mesures</p>

        <li><kbd>R</kbd> recommencer l'acte · survole une molécule pour la mesurer</li>

  <div class="controls" role="toolbar" aria-label="Contrôles">

      <button class="btn ico" id="bPrev" title="Acte précédent (←)" aria-label="Acte précédent"><svg viewBox="0 0 14 14"><path d="M11 2v10L5 7zM3 2h1.6v10H3z"/></svg></button>
      <button class="btn ico" id="bPlay" title="Lecture / pause (Espace)" aria-label="Pause"><svg viewBox="0 0 14 14" id="icPause"><path d="M3 2h3v10H3zM8 2h3v10H8z"/></svg><svg viewBox="0 0 14 14" id="icPlay" style="display:none"><path d="M3 2l9 5-9 5z"/></svg></button>

<script>
(() => {
'use strict';

/*ENGINE-START*/
/* ---------------- Moteur : dynamique moléculaire 2D ----------------
   Unités réduites : diamètre σ = 1, masse m = 1, énergie ε = 1, temps τ, k = 1.
   Paires : Lennard-Jones U = 4[(s/r)¹² − (s/r)⁶], s = (σi + σj)/2, tronqué et décalé :
   à 2^(1/6)·s (WCA, purement répulsif) ou à 2,5·s (attraction, acte VIII).
   Parois : même répulsion avec s = σi/2. Intégration de Verlet vitesse, dt = 0,004 τ.
   Température : kT = ⟨½ m v²⟩ (2 degrés de liberté en 2D). Pression : force normale sur
   les parois divisée par leur longueur, moyennée dans le temps. */
const R6 = Math.pow(2, 1 / 6);
function gauss() { let u = 0; while (u === 0) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * Math.random()); }
function wallF(d, s) {                 // force (positive = repousse) d'une paroi à la distance d
  if (d < 0.35 * s) d = 0.35 * s;
  const q = s * s / (d * d), q6 = q * q * q;
  return 24 * q6 * (2 * q6 - 1) / d;
}
function Sim(o) {
  const cap = o.cap || 640;
  this.cap = cap; this.W = o.W; this.H = o.H; this.x1 = o.W; this.x1T = o.W;
  this.sig = o.sig || [1, 1, 5, 1.3];
  this.mass = o.mass || [1, 1, 40, 1];
  this.lj = !!o.lj; this.rcF = this.lj ? 2.5 : R6;
  this.ushift = 4 * (Math.pow(this.rcF, -12) - Math.pow(this.rcF, -6));
  this.dt = 0.004; this.t = 0; this.N = 0;
  const F = () => new Float64Array(cap);
  this.x = F(); this.y = F(); this.vx = F(); this.vy = F(); this.ax = F(); this.ay = F();
  this.sp = new Uint8Array(cap); this.side = new Int8Array(cap); this.gside = new Int8Array(cap);
  this.wc = new Uint8Array(cap); this.gcA = new Uint8Array(cap); this.gcB = new Uint8Array(cap);
  this.nb = new Uint8Array(cap);
  this.grains = [];
  this.part = null;      // cloison / membrane : {x, block:[par espèce], mobile, M, v, a, k, xr, gam, F}
  this.walls = null;     // parois thermiques : {TL, TR, gam, w}
  this.gate = null;      // ligne de comptage des traversées (x)
  this.countColl = !!o.countColl; this.cont = new Set(); this.cont2 = new Set();
  this.wantBonds = false; this.bonds = [];
  this.sparks = []; this.wallSparks = [];
  this.pe = 0;
  this.skip = new Uint8Array(16);   // paires d'espèces qui s'ignorent (solution idéale)
  if (o.ideal) for (const [a, b] of o.ideal) { this.skip[a * 4 + b] = 1; this.skip[b * 4 + a] = 1; }
  this.resetAcc();
  const cs = o.cell || (Math.max(...(o.gridSig || [1])) * this.rcF);
  this.ncx = Math.max(1, Math.floor(this.W / cs)); this.ncy = Math.max(1, Math.floor(this.H / cs));
  this.cw = this.W / this.ncx; this.ch = this.H / this.ncy;
  this.head = new Int32Array(this.ncx * this.ncy); this.next = new Int32Array(cap);
}
Sim.prototype.resetAcc = function () {
  this.acc = { wallImp: 0, hits: 0, coll: 0, gHits: 0, cross: [[0, 0], [0, 0], [0, 0], [0, 0]],
               mCross: [0, 0], heatL: 0, heatR: 0, memImp: 0, time: 0 };
};
Sim.prototype.add = function (x, y, sp, T) {
  const i = this.N++, m = this.mass[sp], s = Math.sqrt(T / m);
  this.x[i] = x; this.y[i] = y; this.vx[i] = s * gauss(); this.vy[i] = s * gauss(); this.sp[i] = sp;
  if (sp === 2) this.grains.push(i);
  return i;
};
/* Place des molécules sur un réseau légèrement bruité dans une région, en évitant les grains. */
Sim.prototype.fill = function (groups, r, T) {
  let n = 0; for (const g of groups) n += g.n;
  const w = r.x1 - r.x0, h = r.y1 - r.y0;
  let a = Math.sqrt(w * h / (n * 1.15)), cols, rows, pts;
  for (;;) {
    cols = Math.floor(w / a); rows = Math.floor(h / a); pts = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const px = r.x0 + (i + 0.5) * w / cols + (Math.random() - 0.5) * 0.15 * a;
      const py = r.y0 + (j + 0.5) * h / rows + (Math.random() - 0.5) * 0.15 * a;
      let ok = true;
      for (const gi of this.grains) { const dx = px - this.x[gi], dy = py - this.y[gi]; if (dx * dx + dy * dy < 13) ok = false; }
      if (ok) pts.push([px, py]);
    }
    if (pts.length >= n) break;
    a *= 0.95;
  }
  for (let i = pts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
  const tags = []; for (const g of groups) for (let k = 0; k < g.n; k++) tags.push(g.sp);
  for (let i = tags.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [tags[i], tags[j]] = [tags[j], tags[i]]; }
  for (let k = 0; k < n; k++) this.add(pts[k][0], pts[k][1], tags[k], T);
};
Sim.prototype.initSides = function () {
  const p = this.part;
  for (let i = 0; i < this.N; i++) {
    if (p) this.side[i] = this.x[i] > p.x ? 1 : -1;
    if (this.gate !== null) this.gside[i] = this.x[i] > this.gate ? 1 : -1;
  }
};
Sim.prototype.forces = function () {
  const N = this.N, x = this.x, y = this.y, ax = this.ax, ay = this.ay, sp = this.sp, sig = this.sig;
  const rcF = this.rcF, rcF2 = rcF * rcF, ush = this.ushift, ct2 = 0.94 * R6 * R6, nb = this.nb, wb = this.wantBonds;
  const cont = this.cont2, cc = this.countColl, gcNew = this.gcB, skip = this.skip;
  ax.fill(0, 0, N); ay.fill(0, 0, N); nb.fill(0, 0, N); gcNew.fill(0, 0, N);
  if (cc) cont.clear();
  if (wb) this.bonds.length = 0;
  let pe = 0;
  const self = this;
  function pair(i, j) {
    if (skip[sp[i] * 4 + sp[j]]) return;
    const dx = x[j] - x[i], dy = y[j] - y[i], r2 = dx * dx + dy * dy;
    const s = 0.5 * (sig[sp[i]] + sig[sp[j]]), s2 = s * s;
    if (r2 >= s2 * rcF2) return;
    const q = s2 / (r2 > 0.1 * s2 ? r2 : 0.1 * s2), q6 = q * q * q;
    let f = 24 * q6 * (2 * q6 - 1) / r2;
    if (f > 6000) f = 6000;
    ax[i] -= f * dx; ay[i] -= f * dy; ax[j] += f * dx; ay[j] += f * dy;
    pe += 4 * q6 * (q6 - 1) - ush;
    if (r2 < ct2 * s2) {
      if (sp[i] === 2) gcNew[j] = 1; else if (sp[j] === 2) gcNew[i] = 1;
      else if (cc) cont.add(i < j ? i * 4096 + j : j * 4096 + i);
    }
    if (r2 < 2.25 * s2) { nb[i]++; nb[j]++; if (wb && r2 < 1.69 * s2) self.bonds.push(i, j); }
  }
  // grille de cellules (les grains, trop gros, sont traités à part)
  const ncx = this.ncx, ncy = this.ncy, head = this.head, next = this.next, cw = this.cw, ch = this.ch;
  head.fill(-1);
  for (let i = 0; i < N; i++) {
    if (sp[i] === 2) continue;
    let cx = (x[i] / cw) | 0, cy = (y[i] / ch) | 0;
    if (cx < 0) cx = 0; else if (cx >= ncx) cx = ncx - 1;
    if (cy < 0) cy = 0; else if (cy >= ncy) cy = ncy - 1;
    const c = cy * ncx + cx; next[i] = head[c]; head[c] = i;
  }
  for (let cy = 0; cy < ncy; cy++) for (let cx = 0; cx < ncx; cx++) {
    for (let i = head[cy * ncx + cx]; i >= 0; i = next[i]) {
      for (let j = next[i]; j >= 0; j = next[j]) pair(i, j);
      if (cx + 1 < ncx) for (let j = head[cy * ncx + cx + 1]; j >= 0; j = next[j]) pair(i, j);
      if (cy + 1 < ncy) {
        const b = (cy + 1) * ncx;
        if (cx > 0) for (let j = head[b + cx - 1]; j >= 0; j = next[j]) pair(i, j);
        for (let j = head[b + cx]; j >= 0; j = next[j]) pair(i, j);
        if (cx + 1 < ncx) for (let j = head[b + cx + 1]; j >= 0; j = next[j]) pair(i, j);
      }
    }
  }
  for (const g of this.grains) for (let i = 0; i < N; i++) if (i !== g) pair(g, i);
  // parois, piston, cloison
  const acc = this.acc, W = this.x1, H = this.H, p = this.part, wc = this.wc;
  let imp = 0;
  if (p) p.F = 0;
  for (let i = 0; i < N; i++) {
    const rw = 0.5 * sig[sp[i]], rc = rw * R6, rt = 0.97 * rc;
    let touch = 0, f;
    if (x[i] < rc) { f = wallF(x[i], rw); ax[i] += f; imp += f; if (x[i] < rt) touch = 1; }
    if (W - x[i] < rc) { f = wallF(W - x[i], rw); ax[i] -= f; imp += f; if (W - x[i] < rt) touch = 2; }
    if (y[i] < rc) { f = wallF(y[i], rw); ay[i] += f; imp += f; if (y[i] < rt) touch = 3; }
    if (H - y[i] < rc) { f = wallF(H - y[i], rw); ay[i] -= f; imp += f; if (H - y[i] < rt) touch = 4; }
    if (touch && !wc[i]) { acc.hits++; if (this.wallSparks.length < 400) this.wallSparks.push(touch, x[i], y[i], this.t); }
    wc[i] = touch;
    if (p && p.block[sp[i]]) {
      const s = this.side[i];
      let d = s * (x[i] - p.x);
      if (d < 0.25 * rw) { x[i] = p.x + s * 0.25 * rw; d = 0.25 * rw; }
      if (d < rc) { f = wallF(d, rw); ax[i] += s * f; p.F -= s * f; if (sp[i] === 3) acc.memImp += f; }
    }
  }
  acc.wallImp += imp * this.dt;
  // nouveaux contacts grain-molécule et molécule-molécule
  const gcOld = this.gcA;
  for (let i = 0; i < N; i++) if (gcNew[i] && !gcOld[i]) acc.gHits++;
  this.gcA = gcNew; this.gcB = gcOld;
  if (cc) {
    for (const k of cont) if (!this.cont.has(k)) {
      acc.coll++;
      if (this.sparks.length < 300) { const i = (k / 4096) | 0, j = k % 4096; this.sparks.push(0.5 * (x[i] + x[j]), 0.5 * (y[i] + y[j]), this.t); }
    }
    this.cont2 = this.cont; this.cont = cont;
  }
  const mass = this.mass;
  for (let i = 0; i < N; i++) { const m = mass[sp[i]]; if (m !== 1) { ax[i] /= m; ay[i] /= m; } }
  this.pe = pe;
};
Sim.prototype.step = function () {
  const N = this.N, dt = this.dt, h = 0.5 * dt, x = this.x, y = this.y, vx = this.vx, vy = this.vy, ax = this.ax, ay = this.ay;
  for (let i = 0; i < N; i++) { vx[i] += h * ax[i]; vy[i] += h * ay[i]; x[i] += dt * vx[i]; y[i] += dt * vy[i]; }
  if (this.x1 !== this.x1T) { const m = 2.5 * dt, d = this.x1T - this.x1; this.x1 += d > m ? m : d < -m ? -m : d; }
  const p = this.part;
  if (p && p.mobile) { p.v += h * p.a; p.x += dt * p.v; if (p.x < 4) { p.x = 4; p.v = 0; } if (p.x > this.W - 4) { p.x = this.W - 4; p.v = 0; } }
  this.forces();
  for (let i = 0; i < N; i++) { vx[i] += h * ax[i]; vy[i] += h * ay[i]; }
  if (p && p.mobile) {     // membrane : frottement + agitation thermique (Langevin à T = 1), sinon elle refroidirait le soluté
    p.a = (p.F - p.k * (p.x - p.xr) - p.gam * p.v) / p.M; p.v += h * p.a + Math.sqrt(2 * p.gam * dt) / p.M * gauss();
  }
  const acc = this.acc, sp = this.sp;
  // parois thermiques (Langevin) : l'énergie échangée est la chaleur
  const w = this.walls;
  if (w) {
    const c1 = Math.exp(-w.gam * dt), q = Math.sqrt(1 - c1 * c1), mass = this.mass, W = this.x1;
    for (let i = 0; i < N; i++) {
      let T;
      if (x[i] < w.w && w.TL > 0) T = w.TL; else if (x[i] > W - w.w && w.TR > 0) T = w.TR; else continue;
      const m = mass[sp[i]], e0 = vx[i] * vx[i] + vy[i] * vy[i], s = q * Math.sqrt(T / m);
      vx[i] = c1 * vx[i] + s * gauss(); vy[i] = c1 * vy[i] + s * gauss();
      const de = 0.5 * m * (vx[i] * vx[i] + vy[i] * vy[i] - e0);
      if (x[i] < w.w) acc.heatL += de; else acc.heatR += de;
    }
  }
  // traversées : ligne de comptage fixe et membrane
  if (this.gate !== null) {
    const g = this.gate, gs = this.gside;
    for (let i = 0; i < N; i++) { const s = x[i] > g ? 1 : -1; if (s !== gs[i]) { acc.cross[sp[i]][s > 0 ? 0 : 1]++; gs[i] = s; } }
  }
  if (p) {
    const sd = this.side;
    for (let i = 0; i < N; i++) {
      if (p.block[sp[i]]) continue;
      const s = x[i] > p.x ? 1 : -1;
      if (s !== sd[i]) { if (sp[i] === 0) acc.mCross[s > 0 ? 0 : 1]++; sd[i] = s; }
    }
  }
  acc.time += dt;
  this.t += dt;
};
Sim.prototype.kin = function (filter) {
  let e = 0, n = 0;
  const vx = this.vx, vy = this.vy, sp = this.sp, mass = this.mass;
  for (let i = 0; i < this.N; i++) {
    if (filter !== undefined && !filter(i)) continue;
    e += 0.5 * mass[sp[i]] * (vx[i] * vx[i] + vy[i] * vy[i]); n++;
  }
  return { e, n, T: n ? e / n : 0 };
};
Sim.prototype.scaleV = function (lam) { for (let i = 0; i < this.N; i++) { this.vx[i] *= lam; this.vy[i] *= lam; } };
/* Thermostat de Berendsen : rapproche doucement T de T0 (constante de temps tau). */
Sim.prototype.berendsen = function (T0, simDt, tau) {
  const T = this.kin().T; if (T <= 0) return;
  let l2 = 1 + (simDt / tau) * (T0 / T - 1); if (l2 < 0.25) l2 = 0.25;
  this.scaleV(Math.sqrt(l2));
};

/* Rampe vitesse / température : gris-bleu froid → jaune énergie → blanc chaud */
const RAMP = [];
(function () {
  const stops = [[0, [52, 68, 88]], [0.35, [96, 128, 158]], [0.7, hex('#ffd166')], [1, [255, 243, 214]]];
  for (let k = 0; k < 48; k++) {
    const u = k / 47; let a = stops[0], b = stops[1];
    for (let s = 1; s < stops.length; s++) if (u <= stops[s][0]) { a = stops[s - 1]; b = stops[s]; break; }
    const f = (u - a[0]) / (b[0] - a[0] || 1);
    RAMP.push(`rgb(${a[1].map((v, c) => Math.round(v + (b[1][c] - v) * f)).join(',')})`);
  }
})();
const rampV = v => RAMP[Math.max(0, Math.min(47, Math.round(v / 3.4 * 47)))];          // vitesse en σ/τ
const rampT = T => RAMP[Math.max(0, Math.min(47, Math.round(Math.sqrt(T / 3.2) * 47)))]; // kT

const K = 300;                                           // kT = 1 ↔ 300 K
const fr = (v, d = 1) => !isFinite(v) ? '—' : (v < 0 ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',');
const fK = T => Math.round(T * K) + '';
function sup(n) { const m = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' }; return String(n).split('').map(c => m[c] || c).join(''); }
function big(log10) {                                    // 10^x lisible
  if (log10 < 6) return Math.round(Math.pow(10, log10)).toLocaleString('fr-CA');
  const e = Math.floor(log10), m = Math.pow(10, log10 - e);
  return fr(m, 1) + ' × 10' + sup(e);
}
const LF = [0]; for (let i = 1; i <= 400; i++) LF[i] = LF[i - 1] + Math.log10(i);
const log10C = (n, k) => LF[n] - LF[k] - LF[n - k];

/* ---------------- Contrôles dynamiques ---------------- */
function slider(label, min, max, step, value, fmt, on, aria, id) {
  const g = document.createElement('div'); g.className = 'grp';
  g.innerHTML = `<span class="gl">${label}</span>`;
  const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = value;
  r.setAttribute('aria-label', aria || label); if (id) r.id = id;
  const v = document.createElement('span'); v.className = 'rv'; v.textContent = fmt(+value);
  r.addEventListener('input', () => { v.textContent = fmt(+r.value); on(+r.value); });
  g.append(r, v); return g;
}
function toggle(label, on0, on, title) {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.title = title || label;
  b.setAttribute('aria-pressed', on0 ? 'true' : 'false');
  b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); on(v); });
  return b;
}
function button(label, on) {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = label;
  b.addEventListener('click', () => on(b)); return b;
}
function radio(label, opts, cur, on) {
  const g = document.createElement('div'); g.className = 'grp'; g.setAttribute('role', 'group'); g.setAttribute('aria-label', label);
  g.innerHTML = `<span class="gl">${label}</span>`;
  const bs = [];
  for (const o of opts) {
    const [t, v] = Array.isArray(o) ? o : [String(o), o];
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = t; b.setAttribute('aria-pressed', v === cur ? 'true' : 'false');
    b.addEventListener('click', () => { bs.forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); on(v); });
    bs.push(b); g.append(b);
  }
  return g;
}

/* ---------------- Graphiques du panneau ---------------- */
function axes(c, w, h, xl, yl) {
  c.strokeStyle = C.trait; c.lineWidth = 1;
  c.beginPath(); c.moveTo(30, 8); c.lineTo(30, h - 20); c.lineTo(w - 8, h - 20); c.stroke();
  c.fillStyle = C.texte2; c.font = mono(10); c.textAlign = 'right'; c.textBaseline = 'bottom';
  c.fillText(xl, w - 8, h - 4);
  c.save(); c.translate(11, 10); c.rotate(-Math.PI / 2); c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(yl, 0, 0); c.restore();
  return { x0: 30, y0: h - 20, w: w - 40, h: h - 30 };
}
function chartHist(c, w, h, hist, bw, T) {
  const a = axes(c, w, h, 'vitesse (σ/τ)', 'nombre'), n = hist.length;
  let tot = 0; for (const v of hist) tot += v;
  if (!tot) return;

  for (let k = 0; k < nb; k++) {
    const v = Math.min(prof[k], vmax) / vmax, bh = v * hh;
    c.fillStyle = isT ? rampT(prof[k]) : rgba(RA, 0.5);
    c.globalAlpha = isT ? 0.7 : 1;
    c.fillRect(x0 + k * w / nb + 1, y0 + hh - bh, w / nb - 2, bh);
  }
  c.globalAlpha = 1;
  // pente (gradient) : droite de régression
  if (st.slope !== undefined) {
    const xm = sim.W / 2, sub = isT ? prof.slice(1, nb - 1) : prof, mean = sub.reduce((s, v) => s + v, 0) / sub.length;
    const yAt = xx => y0 + hh - Math.max(0, Math.min(1, (mean + st.slope * (xx - xm)) / vmax)) * hh;
    const xa = isT ? 0.5 * sim.W / nb * 3 : 0, xb = isT ? sim.W - xa : sim.W;
    c.strokeStyle = C.texte; c.lineWidth = 1; c.setLineDash([5, 4]);
    c.beginPath(); c.moveTo(PX(xa), yAt(xa)); c.lineTo(PX(xb), yAt(xb)); c.stroke(); c.setLineDash([]);
    c.fillStyle = C.texte; c.font = mono(10.5); c.textAlign = 'right'; c.textBaseline = 'bottom';
    c.fillText('gradient = pente', x0 + w, y0 - 2);
  }
  // flèche de flux à la ligne médiane (au-dessus de la bande)
  const J = isT ? (E.pin + E.pout) / 2 : E.J;
  if (J !== undefined && isFinite(J)) {
    const ref = isT ? 4 : 2.5, len = Math.max(-1, Math.min(1, J / ref)) * Math.min(160, w * 0.3);
    if (Math.abs(len) > 12) arrow(c, PX(sim.W / 2), PY(sim.H) + 16, len, isT ? C.ener : C.ener, 2.5, null);
    c.fillStyle = C.ener; c.font = mono(11); c.textAlign = 'left'; c.textBaseline = 'middle';
    const lab = (isT ? 'flux de chaleur ' : 'flux net de A ') + fr(J, 2) + (isT ? ' ε/τ' : ' /τ');
    c.fillText(lab, PX(sim.W / 2) + Math.abs(len) / 2 + 10, PY(sim.H) + 16);
  }
}
function drawLabels() {
  const c = ctx;
  c.font = mono(11); c.textBaseline = 'bottom';
  if (act === 4) {
    c.strokeStyle = rgba(RT2, 0.5); c.setLineDash([3, 4]); c.lineWidth = 1;
    if (!sim.part) { c.beginPath(); c.moveTo(PX(sim.W / 2), PY(0)); c.lineTo(PX(sim.W / 2), PY(sim.H)); c.stroke(); }
    c.setLineDash([]);
    c.font = `400 ${Math.round(Math.min(46, box.h * 0.22))}px ${tok('--serif')}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = rgba(RT, 0.18);
    c.fillText(st.nL, PX(sim.W / 4), PY(sim.H / 2)); c.fillText(st.N - st.nL, PX(3 * sim.W / 4), PY(sim.H / 2));
  }
  if (act === 6) {
    c.fillStyle = C.ener; c.textAlign = 'left'; c.textBaseline = 'bottom'; c.font = mono(11);
    c.fillText(sim.walls.TL > 0 ? 'paroi chaude · ' + fK(sim.walls.TL) + ' K' : 'paroi isolée', PX(0), PY(0) - 6);
    c.fillStyle = C.texte2; c.textAlign = 'right';
    c.fillText(sim.walls.TR > 0 ? 'paroi froide · ' + fK(sim.walls.TR) + ' K' : 'paroi isolée', PX(sim.x1), PY(0) - 6);
  }
  if (act === 5) {
    c.fillStyle = C.texte2; c.font = mono(11); c.textAlign = 'center'; c.textBaseline = 'top';
    c.fillText('eau + soluté', PX(sim.part.x / 2), PY(sim.H) + 6);
    c.fillText('eau pure', PX((sim.part.x + sim.W) / 2), PY(sim.H) + 6);
    if (!st.mobile) { c.fillStyle = C.texte2; c.fillText('membrane fixée', PX(sim.part.x), PY(sim.H) + 20); }
  }
  if (act === 3) {
    c.fillStyle = C.texte2; c.font = mono(11); c.textAlign = 'left'; c.textBaseline = 'bottom';
    c.fillText(st.removed ? '' : 'cloison : A à gauche, B à droite', PX(0), PY(0) - 6);
  }
}

/* Acte IX : deux schémas */
function drawSchematic() {
  const c = ctx, narrow = W < 700, top = headBottom() + 18, side = narrow ? 14 : 28, gap = 24;
  let r1, r2;
  if (narrow) { const hh = (H - top - 20 - gap) / 2; r1 = { x: side, y: top, w: W - 2 * side, h: hh }; r2 = { x: side, y: top + hh + gap, w: W - 2 * side, h: hh }; }
  else { const ww = (W - 2 * side - gap) / 2, hh = Math.min(H - top - 34, ww * 0.85); r1 = { x: side, y: top, w: ww, h: hh }; r2 = { x: side + ww + gap, y: top, w: ww, h: hh }; }
  st.r1 = r1; st.r2 = r2;
  c.font = mono(11); c.textBaseline = 'bottom'; c.textAlign = 'left';
  // convection
  c.fillStyle = C.texte2; c.fillText('convection : le fluide se déplace', r1.x, r1.y + 14);
  const b = { x: r1.x, y: r1.y + 22, w: r1.w, h: r1.h - 34 };
  if (b.w < 40 || b.h < 40) return;
  c.fillStyle = 'rgba(17,22,30,0.55)'; c.fillRect(b.x, b.y, b.w, b.h);
  c.strokeStyle = '#33404f'; c.lineWidth = 1.5; c.strokeRect(b.x, b.y, b.w, b.h);
  const hg = c.createLinearGradient(0, b.y + b.h, 0, b.y + b.h - 20); hg.addColorStop(0, rgba(RE, 0.35)); hg.addColorStop(1, rgba(RE, 0)); c.fillStyle = hg; c.fillRect(b.x, b.y + b.h - 20, b.w, 20);
  c.strokeStyle = C.ener; c.lineWidth = 3; c.beginPath(); c.moveTo(b.x, b.y + b.h); c.lineTo(b.x + b.w, b.y + b.h); c.stroke();
  c.strokeStyle = C.froid; c.beginPath(); c.moveTo(b.x, b.y); c.lineTo(b.x + b.w, b.y); c.stroke();
  // lignes de courant (indicatives)
  c.strokeStyle = rgba(RT2, 0.25); c.lineWidth = 1;
  for (const lv of [0.35, 0.7]) for (const half of [0, 1]) { c.beginPath(); c.ellipse(b.x + b.w * (0.25 + 0.5 * half), b.y + b.h / 2, b.w * 0.2 * lv, b.h * 0.42 * lv, 0, 0, 7); c.stroke(); }
  for (const p of st.parcels) { c.fillStyle = rampT(0.2 + p.th * 2.8); c.beginPath(); c.arc(b.x + p.u * b.w, b.y + (1 - p.v) * b.h, Math.max(2, b.w / 110), 0, 7); c.fill(); }
  c.fillStyle = C.ener; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText('plaque chaude', b.x + b.w / 2, b.y + b.h + 4);
  c.fillStyle = C.texte2; c.textBaseline = 'top'; c.textAlign = 'right'; c.fillText('plafond froid', b.x + b.w - 6, b.y + 5); c.textBaseline = 'bottom';
  // rayonnement
  c.textAlign = 'left'; c.fillStyle = C.texte2; c.fillText('rayonnement : rien ne se déplace sauf la lumière', r2.x, r2.y + 14);
  const R = { x: r2.x, y: r2.y + 22, w: r2.w, h: r2.h - 34 };
  if (R.w < 40 || R.h < 40) return;
  c.strokeStyle = C.trait; c.setLineDash([2, 4]); c.strokeRect(R.x, R.y, R.w, R.h); c.setLineDash([]);
  const rad = Math.min(R.w, R.h) * 0.13, hx = R.x + R.w * 0.22, cx2 = R.x + R.w * 0.8, cy = R.y + R.h / 2;
  st.rad = rad; st.hot = [hx, cy]; st.cold = [cx2, cy];
  const reach = Math.hypot(R.w, R.h);
  const spd = reach / 1.6;
  const dtR = st.real || 1 / 60;
  const keep = [];
  for (const ph of st.ph) {
    if (playing) ph.t += dtR;
    const [sx, sy] = ph.src ? st.cold : st.hot, d = rad + ph.t * spd;
    const px = sx + Math.cos(ph.a) * d, py = sy + Math.sin(ph.a) * d;
    if (px < R.x || px > R.x + R.w || py < R.y || py > R.y + R.h) continue;
    const [tx, ty] = ph.src ? st.hot : st.cold;
    if (Math.hypot(px - tx, py - ty) < rad) { if (!ph.src) st.absorbed++; continue; }
    keep.push(ph);
    const T = ph.src ? st.Tc : st.Th, lam = 14 / T, col = T > 3 ? '#fff3d6' : T > 1.8 ? C.ener : '#ff9a6b';
    c.strokeStyle = col; c.globalAlpha = 0.85; c.lineWidth = 1.2; c.beginPath();
    for (let k = 0; k <= 10; k++) { const s = d - 12 + k * 1.2, w = Math.sin(k / 10 * 12 / lam * 6.28) * 2.2; const qx = sx + Math.cos(ph.a) * s - Math.sin(ph.a) * w, qy = sy + Math.sin(ph.a) * s + Math.cos(ph.a) * w; k ? c.lineTo(qx, qy) : c.moveTo(qx, qy); }
    c.stroke(); c.globalAlpha = 1;
  }
  st.ph = keep;
  const glow = (x, y, T) => { const g = c.createRadialGradient(x, y, rad * 0.4, x, y, rad * 2.2); g.addColorStop(0, rgba(RE, Math.min(0.45, 0.04 * Math.pow(T, 2)))); g.addColorStop(1, rgba(RE, 0)); c.fillStyle = g; c.beginPath(); c.arc(x, y, rad * 2.2, 0, 7); c.fill(); c.fillStyle = rampT(T); c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill(); };
  glow(hx, cy, st.Th); glow(cx2, cy, st.Tc);
  c.fillStyle = C.texte2; c.textAlign = 'center'; c.textBaseline = 'top'; c.font = mono(11);
  c.fillText('chaud · ' + fK(st.Th) + ' K', hx, cy + rad + 8); c.fillText('froid · ' + fK(st.Tc) + ' K', cx2, cy + rad + 8);
  c.fillText('vide', (hx + cx2) / 2, R.y + 6);
}

function draw() {
  const c = ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = C.fond; c.fillRect(0, 0, W, H);
  if (ACTS[act].schematic) { drawSchematic(); return; }
  if (!sim) return;
  drawBox(); drawParticles(); drawLabels(); drawStrip();
}

/* ---------------- Survol et glisser ---------------- */
function pick(mx, my) {
  const A = ACTS[act];
  if (A.schematic) {
    if (!st.hot) return null;
    if (Math.hypot(mx - st.hot[0], my - st.hot[1]) < st.rad) return { kind: 'hot', t: 'Corps chaud', d: 'Émet de la lumière infrarouge (et visible s’il est très chaud) ; puissance ∝ T⁴.' };
    if (Math.hypot(mx - st.cold[0], my - st.cold[1]) < st.rad) return { kind: 'cold', t: 'Corps froid', d: 'Absorbe le rayonnement qui l’atteint et émet lui aussi, moins.' };
    if (st.r1 && mx > st.r1.x && mx < st.r1.x + st.r1.w && my > st.r1.y && my < st.r1.y + st.r1.h) return { kind: 'conv', t: 'Parcelle de fluide', d: 'Chauffée en bas, elle se dilate et monte ; refroidie en haut, elle redescend.' };
    return null;
  }
  if (!sim) return null;
  const sx = (mx - box.ox) / box.sc, sy = (my - box.oy) / box.sc, tol = 8 / box.sc;
  if (act === 1 && Math.abs(sx - sim.x1) < Math.max(tol, 0.8) && sy > -0.5 && sy < sim.H + 0.5) return { kind: 'piston', t: 'Piston', d: 'Glisse-le pour changer le volume. Les molécules qui le frappent le poussent : c’est la pression.' };
  if (sim.part && act === 5 && Math.abs(sx - sim.part.x) < Math.max(tol, 0.6) && sy > -1.5 && sy < sim.H) return { kind: 'membrane', t: 'Membrane semi-perméable', d: 'Laisse passer l’eau, retient le soluté. Retenue par un ressort.' };
  if (sim.part && act === 3 && Math.abs(sx - sim.part.x) < tol && sy > 0 && sy < sim.H) return { kind: 'part', t: 'Cloison', d: 'Imperméable. Retire-la pour laisser A et B diffuser.' };
  let best = -1, bd = 1e9;
  for (let i = 0; i < sim.N; i++) {
    if (act === 2 && st.micro && sim.sp[i] !== 2) continue;
    const d = Math.hypot(sim.x[i] - sx, sim.y[i] - sy) - 0.5 * sim.sig[sim.sp[i]];
    if (d < bd) { bd = d; best = i; }
  }
  if (best >= 0 && bd < Math.max(0.4, 6 / box.sc)) return { kind: 'mol', i: best };
  if (sim.walls && sy > 0 && sy < sim.H) {
    if (Math.abs(sx) < tol * 1.5) return { kind: 'wall', t: 'Paroi chaude', d: 'Les molécules qui la touchent repartent avec l’agitation de la paroi : elle leur donne de l’énergie.' };
    if (Math.abs(sx - sim.x1) < tol * 1.5) return { kind: 'wall', t: 'Paroi froide', d: 'Les molécules qui la touchent repartent plus lentes : elle leur prend de l’énergie.' };
  }
  return null;
}
function molInfo(i) {
  const s = sim.sp[i], v = Math.hypot(sim.vx[i], sim.vy[i]), m = sim.mass[s], ec = 0.5 * m * v * v;
  const T = sim.kin().T;
  const name = s === 2 ? 'Grain (M = 40 m)' : act === 5 ? (s === 0 ? 'Molécule d’eau' : 'Soluté (retenu par la membrane)') : act === 3 ? (s === 0 ? 'Molécule A' : 'Molécule B') : 'Molécule';
  return `<b>${name}</b><span>v = ${fr(v, 2)} σ/τ · Ec = ${fr(ec, 2)} ε<br>moyenne de toutes : ${fr(T, 2)} ε (= kT)</span>`;
}
function showTip(h, mx, my) {
  if (!h) { tipEl.classList.remove('on'); return; }
  tipEl.innerHTML = h.kind === 'mol' ? molInfo(h.i) : `<b>${h.t}</b><span>${h.d}</span>`;
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  tipEl.style.left = Math.min(W - tw - 8, mx + 14) + 'px'; tipEl.style.top = Math.max(8, Math.min(H - th - 8, my + 14)) + 'px';
  tipEl.classList.add('on');
}
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointermove', e => {
  const [mx, my] = pos(e);
  if (drag) { const sx = (mx - box.ox) / box.sc; sim.x1T = Math.max(22, Math.min(60, sx)); const r = $('#rVol'); if (r) { r.value = sim.x1T; r.nextSibling.textContent = fr((sim.x1T - 1) * 35, 0) + ' σ²'; } return; }
  hover = pick(mx, my); showTip(hover, mx, my);
  cv.classList.toggle('hand', !!hover && hover.kind === 'piston');
});
cv.addEventListener('pointerleave', () => { if (!drag) { hover = null; showTip(null); } });
cv.addEventListener('pointerdown', e => {
  const [mx, my] = pos(e); const h = pick(mx, my);
  if (h && h.kind === 'piston') { drag = true; cv.setPointerCapture(e.pointerId); e.preventDefault(); }
  else if (e.pointerType !== 'mouse') { hover = h; showTip(h, mx, my); }
});
cv.addEventListener('pointerup', () => { drag = false; });
cv.addEventListener('pointercancel', () => { drag = false; });

/* ---------------- Navigation ---------------- */
const stepper = $('#stepper'), tools = $('#tools');
ACTS.forEach((A, k) => {
  const b = document.createElement('button'); b.className = 'seg'; b.title = `Acte ${A.num} — ${A.title}`;
  b.innerHTML = `<b>${A.num}</b><span>${A.short}</span>`; b.addEventListener('click', () => goAct(k));
  stepper.append(b);
});
function buildPanel() {
  const A = ACTS[act];
  $('#eyebrow').innerHTML = `Acte <b>${A.num}</b> sur IX`;
  $('#stepTitle').textContent = A.title;
  const t = $('#stepText'); t.innerHTML = A.text; t.classList.remove('swap'); void t.offsetWidth; if (!reduce) t.classList.add('swap');
  $('#leg').innerHTML = A.legend; $('#note').textContent = A.note;
  $('#chartEye').textContent = A.schematic ? 'Schéma · puissance rayonnée' : 'Mesures sur les molécules';
  $('#meas').innerHTML = A.meas.map(([id, l, u]) => `<div class="row"><span class="lab">${l}</span><span class="val"><b id="m_${id}">—</b>${u ? `<i>${u}</i>` : ''}</span></div>`).join('');
  [...stepper.children].forEach((b, k) => { if (k === act) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
}
function restart() {
  const A = ACTS[act];
  const keep = { N: st.N, mobile: st.mobile };
  st = {}; if (act === 4) st.N = keep.N; if (act === 5) st.mobile = keep.mobile;
  for (const k in E) delete E[k];
  A.setup();
  if (sim) { sim.forces(); sim.resetAcc(); }
  tools.innerHTML = ''; tools.append(...A.tools());
  hover = null; showTip(null);
  layout(); readOut(true);
}
function goAct(k) {
  k = Math.max(0, Math.min(ACTS.length - 1, k));
  act = k; st = {}; fast = !!ACTS[k].fast; $('#bFast').setAttribute('aria-pressed', fast); buildPanel(); restart();
}
function setPlay(v) {
  playing = v; $('#icPause').style.display = v ? '' : 'none'; $('#icPlay').style.display = v ? 'none' : '';
  $('#bPlay').setAttribute('aria-label', v ? 'Pause' : 'Lecture');
}
$('#bPlay').addEventListener('click', () => setPlay(!playing));
$('#bPrev').addEventListener('click', () => goAct(act - 1));
$('#bNext').addEventListener('click', () => goAct(act + 1));
$('#bReset').addEventListener('click', () => restart());
$('#bFast').addEventListener('click', e => { fast = !fast; e.currentTarget.setAttribute('aria-pressed', fast); });
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName, isRange = tag === 'INPUT';
  if (e.key === ' ' || e.code === 'Space') { if (tag === 'BUTTON' || isRange || tag === 'A' || tag === 'SUMMARY') return; e.preventDefault(); setPlay(!playing); return; }
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !isRange) { e.preventDefault(); goAct(act + (e.key === 'ArrowRight' ? 1 : -1)); return; }
  if ((e.key === 'r' || e.key === 'R') && !isRange) { restart(); return; }
  if (/^[1-9]$/.test(e.key) && !isRange) goAct(+e.key - 1);
});

/* ---------------- Lecture des mesures ---------------- */
let lastRead = 0;
function readOut(force) {
  const A = ACTS[act];
  if (sim && !A.schematic) {
    E.T_ = sim.kin().T;
    if (E.T === undefined) E.T = E.T_;
  }
  const v = A.read();
  for (const k in v) { const el = document.getElementById('m_' + k); if (el && el.textContent !== v[k]) el.textContent = v[k]; }
  const cw = chartC.width / dpr, ch = chartC.height / dpr;
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0); cctx.clearRect(0, 0, cw, ch);
  A.chart(cctx, cw, ch);
}

/* ---------------- Boucle ---------------- */
let last = 0, slow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = 0; return; }
  const real = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60; last = now;
  const A = ACTS[act];
  if (playing) {
    if (sim) {
      const want = real * SPEED * (A.speed || 1) * (fast ? 4 : 1);
      const n = Math.min(fast ? 160 : 60, Math.max(1, Math.round(want / sim.dt)));
      const t0 = performance.now();
      sim.resetAcc();
      for (let k = 0; k < n; k++) sim.step();
      const simDt = n * sim.dt;
      A.tick(simDt, real);
      const cost = performance.now() - t0;
      slow = cost > 22 ? slow + 1 : 0;
      if (slow > 30 && fast) { fast = false; $('#bFast').setAttribute('aria-pressed', 'false'); slow = 0; }
    } else A.tick(0, real);
  }
  draw();
  if (now - lastRead > 140) { lastRead = now; readOut(); }
}

new ResizeObserver(() => resize()).observe(sceneEl);
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { last = 0; });
resize();
goAct(0);
requestAnimationFrame(frame);
})();
</script>
</body>
