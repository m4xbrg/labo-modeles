<!doctype html>
<!--
NOTE DE DESIGN
Une seule scène canvas, une seule caméra : l'impulsion est suivie le long de l'axone par un ressort amorti, puis la caméra plonge dans la synapse sans coupure ; les détails moléculaires n'apparaissent qu'à mesure que le grossissement les rend lisibles.
Chaque mouvement est un état du modèle : le tracé de l'oscilloscope vient d'un vrai calcul de Hodgkin-Huxley (couplé nœud à nœud), les ions et les portes de canaux sont des fonctions de cet état, donc tout recule proprement quand on remonte le temps.
Couleur = sens : orange pour Na+ et la dépolarisation, bleu pour K+ et la repolarisation, jaune pour l'énergie et les moments clés, magenta réservé à l'activité synaptique et à la mémoire ; le magenta n'apparaît presque pas avant l'acte 2.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le neurone — L’invisible en mouvement 03</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#0a0d12; --fond-2:#11161e; --trait:#1f2833; --texte:#e8e4dc; --texte-2:#8a93a0;
  --accent:#ff6fae; --positif:#ff8a5b; --negatif:#5bb8ff; --energie:#ffd166;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte)}
body{font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:minmax(0,1fr) auto;height:100vh;height:100dvh;min-height:600px}
.scene{grid-column:1;grid-row:1;position:relative;min-height:0;overflow:hidden;touch-action:pan-y}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.head{position:absolute;left:24px;top:20px;z-index:2;pointer-events:none;max-width:min(640px,calc(100% - 48px))}
.kicker{font:400 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2)}
h1{margin:6px 0 0;font:400 clamp(25px,2.7vw,38px)/1.06 var(--serif);letter-spacing:-.005em}
h1 em{font-style:italic;color:var(--accent)}
.tip{position:absolute;z-index:4;pointer-events:none;max-width:270px;padding:9px 12px 10px;background:rgba(17,22,30,.96);border:1px solid var(--trait);border-left:2px solid var(--energie);border-radius:2px;font:400 12.5px/1.45 var(--sans);color:var(--texte);opacity:0;transform:translateY(4px);transition:opacity .25s var(--ease),transform .25s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--energie);margin-bottom:3px}
.panel{grid-column:2;grid-row:1;border-left:1px solid var(--trait);background:var(--fond-2);padding:24px 24px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.panel .kick{font:400 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

.stext{margin:0;color:var(--texte);min-height:7.4em}
.fade{transition:opacity .35s var(--ease),transform .35s var(--ease)}

.metrics{margin:0;display:grid;grid-template-columns:1fr auto;gap:0;border-top:1px solid var(--trait)}
.metrics>div{display:contents}
.metrics dt,.metrics dd{margin:0;padding:7px 0;border-bottom:1px solid var(--trait);font-size:13px}

.metrics .bar{display:inline-block;width:54px;height:4px;background:var(--trait);position:relative}
.metrics .bar b{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--texte-2)}
.metrics .bar.pos b{background:var(--positif)}.metrics .bar.neg b{background:var(--negatif)}.metrics .bar.acc b{background:var(--accent)}.metrics .bar.en b{background:var(--energie)}

.links a:hover{color:var(--accent)}
.links a span{font-family:var(--mono);color:var(--texte-2)}
.links a.sub{color:var(--texte-2);font-size:12.5px}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:500 12px/1 var(--mono);letter-spacing:.05em;color:var(--texte);background:transparent;border:1px solid var(--trait);height:34px;padding:0 13px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .3s var(--ease),background .3s var(--ease),color .3s var(--ease);-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--texte-2)}
.btn:focus-visible,input[type=range]:focus-visible,.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.icon{width:34px;padding:0}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.go{border-color:var(--positif);color:var(--positif)}
.btn.go:hover{background:rgba(255,138,91,.12)}
.btn.syn{border-color:var(--accent);color:var(--accent)}
.btn.syn:hover{background:rgba(255,111,174,.12)}
.seg{display:inline-flex}
.seg .btn{border-radius:0}.seg .btn+.btn{margin-left:-1px}
.seg .btn[aria-pressed=true]{border-color:var(--texte);background:rgba(232,228,220,.07);position:relative;z-index:1}
.kbd{font:400 10px/1 var(--mono);color:var(--texte-2);border:1px solid var(--trait);padding:2px 4px;border-radius:2px}
.readout{font:400 12px/1 var(--mono);color:var(--texte-2);min-width:96px;font-variant-numeric:tabular-nums}
.grow{flex:1 1 140px;min-width:110px}
.lab{font:400 11px/1 var(--mono);color:var(--texte-2);letter-spacing:.04em;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0;width:100%;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--texte-2) var(--p),var(--trait) var(--p))}
input[type=range]::-moz-range-track{height:2px;background:var(--trait)}
input[type=range]::-moz-range-progress{height:2px;background:var(--texte-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--texte);border:0;transition:transform .3s var(--ease)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--texte);border:0}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
.controls[data-act="1"] .only2,.controls[data-act="2"] .only1{display:none}
.sp{flex:1}
@media (max-width:860px){
  .app{display:flex;flex-direction:column;height:auto;min-height:0}
  .scene{height:74vh;height:74svh;min-height:560px;flex:none}
  .controls{order:2;padding:12px 16px}
  .panel{order:3;border-left:0;border-top:1px solid var(--trait);padding:20px 16px 22px}
  .stext{min-height:0}

}

  .scene{height:700px}

}
@media (prefers-reduced-motion:reduce){
  .fade,.tip,.btn{transition-duration:.01s}
}
</style>

<body>
<div class="app">
  <div class="scene" id="scene">
    <canvas id="cv" role="img" aria-label="Scène interactive : un neurone, un oscilloscope de la tension de membrane, une vue rapprochée de la membrane, puis une synapse qui se renforce"></canvas>
    <header class="head" id="head">
      <div class="kicker">L’invisible en mouvement — 03</div>
      <h1>Le neurone : de l’impulsion à l’<em>apprentissage</em></h1>
    </header>
    <div class="tip" id="tip" role="status"></div>
  </div>

  <aside class="panel" id="panel">
    <div class="kick" id="kick">Acte 1 — Le potentiel d’action</div>
    <h2 class="step fade" id="stepTitle">Repos</h2>
    <p class="stext fade" id="stepText" aria-live="polite"></p>
    <dl class="metrics" id="metrics"></dl>
    <p class="note" id="note"></p>
    <div class="legend" aria-label="Code couleur de la série">
      <span><i style="background:var(--positif)"></i>Na⁺, dépolarisation</span>
      <span><i style="background:var(--negatif)"></i>K⁺, repolarisation</span>
      <span><i style="background:var(--energie)"></i>énergie, moment clé</span>
      <span><i style="background:var(--accent)"></i>synapse, mémoire</span>
    </div>
    <nav class="links">
      <a href="explication.html">Comprendre ce qui se passe <span>→</span></a>
      <a class="sub" href="../index.html"><span>←</span> Accueil de la série</a>
    </nav>
  </aside>

  <section class="controls" id="controls" data-act="1" aria-label="Contrôles">
    <div class="row">
      <button class="btn icon" id="bPlay" aria-label="Lecture / pause (Espace)" title="Lecture / pause (Espace)"><svg id="iPlay" viewBox="0 0 16 16"><path d="M5 3v10M11 3v10"/></svg></button>
      <button class="btn icon" id="bBack" aria-label="Reculer (flèche gauche)" title="Reculer (←)"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <button class="btn icon" id="bFwd" aria-label="Avancer (flèche droite)" title="Avancer (→)"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      <input class="grow" type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Remonter le temps">
      <span class="readout" id="tRead">t = 0,00 ms</span>
      <button class="btn" id="bSpeed" aria-label="Vitesse de lecture" title="Vitesse de lecture">×1</button>
      <button class="btn" id="bReset" aria-label="Réinitialiser (R)" title="Réinitialiser (R)"><svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/></svg><span class="txt">Réinit.</span></button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Choisir l’acte">
        <button class="btn" id="bAct1" aria-pressed="true">Acte 1 · Impulsion</button>
        <button class="btn" id="bAct2" aria-pressed="false">Acte 2 · Synapse</button>
      </div>
      <span class="sp"></span>
      <div class="row only1" style="gap:10px">
        <span class="lab">intensité</span>
        <input type="range" id="inten" min="0" max="100" value="62" step="1" style="width:130px;--p:62%" aria-label="Intensité de la stimulation">
        <span class="lab" id="intenVal" style="min-width:74px;color:var(--texte)">50 µA/cm²</span>
        <button class="btn go" id="bStim" title="Stimuler (S)">Stimuler <span class="kbd">S</span></button>
      </div>
      <div class="row only2" style="gap:10px">
        <button class="btn syn" id="bRep" title="Envoyer un influx (S)">Répéter <span class="kbd">S</span></button>
        <button class="btn syn" id="bBurst" title="Dix influx rapprochés">Rafale ×10</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
/* ==================================================================
   Utilitaires
   ================================================================== */
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const fract = x => x - Math.floor(x);
const sig = x => 1 / (1 + Math.exp(-x));
const hash = (a, b) => { let h = Math.imul(a + 1, 374761393) ^ Math.imul(b + 7, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmtMv = (v, d = 1) => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(d);
const fmtNum = (v, d = 2) => v.toFixed(d).replace('.', ',');

const rootStyle = getComputedStyle(document.documentElement);
const tok = n => rootStyle.getPropertyValue(n).trim();
const hex2rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const RGB = { fond: hex2rgb(tok('--fond') || '#0a0d12'), fond2: hex2rgb(tok('--fond-2') || '#11161e'), trait: hex2rgb(tok('--trait') || '#1f2833'), texte: hex2rgb(tok('--texte') || '#e8e4dc'), texte2: hex2rgb(tok('--texte-2') || '#8a93a0'), accent: hex2rgb(tok('--accent') || '#ff6fae'), pos: hex2rgb(tok('--positif') || '#ff8a5b'), neg: hex2rgb(tok('--negatif') || '#5bb8ff'), en: hex2rgb(tok('--energie') || '#ffd166') };
const rgba = (n, a) => { const c = RGB[n]; return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1).toFixed(3) + ')'; };
const FM = '"IBM Plex Mono", ui-monospace, Consolas, monospace';
const FS = '"IBM Plex Sans", system-ui, sans-serif';
const PROT = '#1b2530', PROT2 = '#2a3542', EDGE = '#3f4d5e', EDGE2 = '#5a6b7f', TUBE = '#1a222d';

/* ==================================================================
   Modèle 1 : Hodgkin-Huxley couplé nœud à nœud (acte 1)
   Tension affichée = V_HH - 5 mV (repos -70 mV). Le taux d'activation m est
   décalé de 3 mV pour que le seuil tombe près de -55 mV.
   ================================================================== */
const HH = (() => {
  const SH = 5, MSH = 3, gNa = 120, gK = 36, gL = 0.3, ENa = 50, EK = -77, GC = 2, N = 8;
  const g = z => Math.abs(z) < 1e-7 ? 1 : z / (1 - Math.exp(-z));
  const r = { am: 0, bm: 0, ah: 0, bh: 0, an: 0, bn: 0 };
  function rates(V) {
    const vm = V - MSH;
    r.am = g((vm + 40) / 10); r.bm = 4 * Math.exp(-(vm + 65) / 18);
    r.an = 0.1 * g((V + 55) / 10); r.bn = 0.125 * Math.exp(-(V + 65) / 80);
    r.ah = 0.07 * Math.exp(-(V + 65) / 20); r.bh = 1 / (1 + Math.exp(-(V + 35) / 10));
  }
  const Vr = -70 + SH; rates(Vr);
  const m0 = r.am / (r.am + r.bm), h0 = r.ah / (r.ah + r.bh), n0 = r.an / (r.an + r.bn);
  const EL = Vr + (gNa * m0 ** 3 * h0 * (Vr - ENa) + gK * n0 ** 4 * (Vr - EK)) / gL;
  const d = new Float64Array(N * 4);
  function step(s, dt, I0) {
    for (let i = 0; i < N; i++) {
      const o = i * 4, V = s[o], m = s[o+1], h = s[o+2], n = s[o+3];
      rates(V);
      let ax = 0; if (i > 0) ax += GC * (s[o-4] - V); if (i < N - 1) ax += GC * (s[o+4] - V);
      const Iion = gNa * m*m*m * h * (V - ENa) + gK * n*n*n*n * (V - EK) + gL * (V - EL);
      d[o] = -Iion + ax + (i === 0 ? I0 : 0);
      d[o+1] = r.am * (1 - m) - r.bm * m; d[o+2] = r.ah * (1 - h) - r.bh * h; d[o+3] = r.an * (1 - n) - r.bn * n;
    }
    for (let k = 0; k < N * 4; k++) s[k] += dt * d[k];
  }
  return { SH, N, Vr, m0, h0, n0, step };
})();
const NN = HH.N, SH = HH.SH;
const T1 = 0.02, SUB = 4, MS_PER_S = 1 / 0.6; // 1 ms de neurone = 0,6 s a l'ecran a vitesse 1 (ralenti x600)
const S1 = { h: [], cur: 0, stims: [], acc: 0, probe: 4, inten: 0.62 };
function rest1() { const a = new Float64Array(NN * 4 + 1); for (let i = 0; i < NN; i++) { a[i*4] = HH.Vr; a[i*4+1] = HH.m0; a[i*4+2] = HH.h0; a[i*4+3] = HH.n0; } return a; }
function inj(t) { let I = 0; for (const s of S1.stims) if (t >= s.t && t < s.t + 1) I += s.amp; return I; }
function next1(p) { const q = Float64Array.from(p); let t = p[NN * 4]; const dt = T1 / SUB; for (let k = 0; k < SUB; k++) { HH.step(q, dt, inj(t)); t += dt; } q[NN * 4] = t; return q; }
function reset1() { S1.h = [rest1()]; S1.cur = 0; S1.stims = []; S1.acc = 0; }
const tOf1 = s => s[NN * 4];
const vOf = (s, i) => s[i * 4] - SH;
function refrClass(s, i) { const h = s[i*4+2], n = s[i*4+3]; return h < 0.30 ? 2 : (h < 0.45 || n > 0.45) ? 1 : 0; }
function adv1(dt) {
  S1.acc += dt * speed * MS_PER_S; let n = 0;
  while (S1.acc >= T1 && n < 60) {
    S1.acc -= T1; n++;
    if (S1.cur < S1.h.length - 1) S1.cur++;
    else { S1.h.push(next1(S1.h[S1.cur])); S1.cur++; }
  }
  if (S1.h.length > 40000) { S1.h.splice(0, 8000); S1.cur -= 8000; S1.stims = S1.stims.filter(s => s.t > tOf1(S1.h[0]) - 20); }
}
function seek1(delta) {
  let tg = S1.cur + delta; if (tg < 0) tg = 0;
  while (tg > S1.h.length - 1) S1.h.push(next1(S1.h[S1.h.length - 1]));
  S1.cur = tg;
}
function stimulate(ampOverride) {
  if (mode !== 'a1' && mode !== 'follow') return;
  const c = S1.h[S1.cur], t = tOf1(c);
  if (S1.cur < S1.h.length - 1) { S1.h.length = S1.cur + 1; S1.stims = S1.stims.filter(s => s.t <= t); }
  const amp = ampOverride != null ? ampOverride : S1.inten * 80;
  S1.stims.push({ t, amp, res: null, why: '', refr: refrClass(c, 0) });
  S1.acc = 0;
}
function resolveStims() {
  const c = S1.h[S1.cur], tn = tOf1(c);
  for (const s of S1.stims) {
    if (s.res !== null || tn < s.t + 5) continue;
    let i = S1.cur; while (i > 0 && tOf1(S1.h[i]) > s.t) i--;
    let mx = -999; for (let k = i; k <= S1.cur; k++) mx = Math.max(mx, vOf(S1.h[k], 0));
    s.res = mx > -20; s.why = s.res ? '' : (s.refr > 0 ? 'réfractaire' : 'sous le seuil');
  }
}
/* geometrie du neurone (unites du monde, 1000 x 300) */
const NX = i => 228 + 79.4 * i;
const AY = x => 112 + 6 * Math.sin((x - 140) / 110);
const SOMA = { x: 128, y: 112, r: 30 };
const CW = { x: 905, y: 208 };
function frontX(s) {
  let f = -1;
  for (let i = 0; i < NN; i++) if (vOf(s, i) > -20) f = i;
  if (f < 0) return null;
  if (f >= NN - 1) return NX(NN - 1) + 60;
  const nxt = clamp((vOf(s, f + 1) + 70) / 60, 0, 0.95);
  return lerp(NX(f), NX(f + 1), nxt);
}

/* ==================================================================
   Modèle 2 : la synapse qui apprend (acte 2)
   Etat : [t, D, G, C, w, s, dernierEpisode, auDessus]
     D  depolarisation postsynaptique (mV au-dessus du repos)
     G  glutamate dans la fente (relatif)
     C  calcium dans l'epine (relatif)
     w  force de la connexion (0..1)  = recepteurs AMPA inseres
     s  stabilite (consolidation, favorisee par l'espacement)
   Le temps est ralenti environ x20 : 1 s a l'ecran = ~50 ms reelles.
   ================================================================== */
const T2 = 0.02, C_TH = 0.35;
