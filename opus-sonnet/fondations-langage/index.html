<!doctype html>
<html lang="fr">
<head>
<!--
  Note de design.
  1. Quatre petits laboratoires dans une seule page, comme quatre instruments posés sur la même paillasse : même scène, même panneau de lecture, même barre de contrôles ; on change d'instrument, pas de site.
  2. Le code couleur de la série sert ici au signe : orange = positif, bleu = négatif, gris = nul ; le jaune d'énergie marque le repère du moment. Chaque grandeur garde sa couleur d'un toy à l'autre (x blanc cassé, v sarcelle, a lilas).
  3. Le mouvement n'illustre que des changements de grandeur : un zoom qui franchit des puissances de dix, un volume qui monte, une flèche qu'on saisit, un mobile dont les trois graphes avancent ensemble. Rien ne bouge pour décorer.
-->
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langage scientifique — L’invisible en mouvement, Fondations 01·03</title>
<meta name="description" content="Quatre petits laboratoires pour lire les planches : échelles et unités, graphiques, vecteurs, position-vitesse-accélération.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --fond:#0a0d12; --fond-2:#11161e; --trait:#1f2833;
  --texte:#e8e4dc; --texte-2:#8a93a0;
  --accent:#6fd6c8; --acc-a:#c38bff;
  --positif:#ff8a5b; --negatif:#5bb8ff; --energie:#ffd166;
  --serif:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;height:100vh;height:100dvh;min-height:600px}
.scene{grid-column:1;grid-row:1;position:relative;min-height:0;overflow:hidden;background:var(--fond)}
#stage{position:absolute;inset:0}
#stage canvas{display:block}

.head{position:absolute;left:26px;top:20px;pointer-events:none;max-width:70%;z-index:2;isolation:isolate;text-shadow:0 0 14px var(--fond),0 0 6px var(--fond),0 0 2px var(--fond)}
.head::before{content:"";position:absolute;inset:-36px -110px -36px -60px;pointer-events:none;z-index:-1;opacity:.75;background:radial-gradient(ellipse farthest-side at 28% 48%,rgba(10,13,18,.96) 0%,rgba(10,13,18,.88) 52%,rgba(10,13,18,0) 100%)}
.serie{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2);margin:0 0 8px}
h1{font:400 clamp(30px,4.2vw,48px)/1 var(--serif);margin:0;letter-spacing:-.005em}
h1 em{color:var(--accent);font-style:italic}
.back{pointer-events:auto;display:inline-block;margin-top:10px;font:400 12px var(--mono);color:var(--texte-2);text-decoration:none;letter-spacing:.02em;transition:color .3s var(--ease)}
.back:hover{color:var(--texte)}

.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--fond-2);border:1px solid var(--trait);padding:7px 10px;font:400 12px/1.4 var(--mono);color:var(--texte);max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:3}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:500;display:block}.tip span{color:var(--texte-2)}

.panel{grid-column:2;grid-row:1;background:var(--fond-2);border-left:1px solid var(--trait);overflow-y:auto;padding:20px 24px 20px;display:flex;flex-direction:column;gap:16px;min-height:0}
#toyPanel{display:flex;flex-direction:column;gap:16px}
.eyebrow{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--texte-2);margin:0 0 10px}
.eyebrow b{color:var(--accent);font-weight:500}
.panel h2{font:400 27px/1.1 var(--serif);margin:0 0 8px}
.txt{margin:0;color:var(--texte);opacity:.9;font-size:14.5px}
.txt+.txt{margin-top:8px}
.swap{animation:swap .55s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.meas{display:grid;gap:0;border-top:1px solid var(--trait)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--trait)}
.lab{font:400 12px var(--mono);color:var(--texte-2)}
.val{font:500 19px var(--mono);display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.val i{font:400 12px var(--mono);color:var(--texte-2);font-style:normal}
.row.small .val{font-size:14px}
.note{font:400 11.5px/1.5 var(--mono);color:var(--texte-2);margin:8px 0 0}
.eq{font:400 13.5px/1.5 var(--mono);background:var(--fond);border-left:2px solid var(--accent);padding:8px 12px;margin:0}
.katex{font-size:1.06em;color:inherit}
.eq .katex{font-size:1.12em}
.tex-bloc{display:block;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.tex-bloc .katex-display{margin:0}
.pos{color:var(--positif)}.neg{color:var(--negatif)}.acc{color:var(--accent)}.ener{color:var(--energie)}.lil{color:var(--acc-a)}.dim{color:var(--texte-2)}
.hints{margin:0;padding:0;list-style:none;font:400 11.5px/1.7 var(--mono);color:var(--texte-2)}
.hints kbd{font:500 11px var(--mono);color:var(--texte);border:1px solid var(--trait);padding:0 5px;border-radius:2px}
.liens{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:6px}
.comprendre{display:inline-flex;justify-content:space-between;align-items:center;text-decoration:none;font:500 14px var(--sans);padding:12px 14px;border:1px solid var(--accent);color:var(--accent);transition:background .35s var(--ease),color .35s var(--ease)}
.comprendre:hover{background:var(--accent);color:var(--fond)}

.controls{grid-column:1/-1;grid-row:2;border-top:1px solid var(--trait);background:var(--fond);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
#toyControls{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;flex:1 1 auto;min-width:0}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gl{font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--texte-2);margin-right:2px}
.btn{background:transparent;border:1px solid var(--trait);color:var(--texte);font:400 12px var(--mono);padding:7px 11px;cursor:pointer;line-height:1;border-radius:2px;transition:border-color .3s var(--ease),color .3s var(--ease),background .3s var(--ease);display:inline-flex;align-items:center;gap:7px;min-height:34px}
.btn:hover{border-color:var(--texte-2)}
.btn[aria-pressed="true"],.btn.on{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:14px;height:14px;display:block;fill:currentColor}
.ico{padding:7px 9px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid currentColor;opacity:.9}
.btn[aria-pressed="true"] .dot{background:currentColor}

.tabs{display:flex;gap:4px;flex:1 0 100%;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--trait)}
.tab{flex:1 1 0;min-width:0;min-height:40px;background:transparent;border:0;border-top:3px solid var(--trait);padding:8px 4px 2px 0;text-align:left;cursor:pointer;font:400 11.5px/1.25 var(--mono);color:var(--texte-2);transition:border-color .35s var(--ease),color .35s var(--ease)}
.tab b{font-weight:500;margin-right:6px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:calc(100% - 28px);vertical-align:bottom}
.tab:hover{color:var(--texte);border-top-color:var(--texte-2)}
.tab[aria-selected="true"]{border-top-color:var(--accent);color:var(--texte)}
.tab[aria-selected="true"] b{color:var(--accent)}

input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:24px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--texte-2)}
input[type=range]::-moz-range-track{height:1px;background:var(--texte-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fond);border:1.5px solid var(--accent);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--fond);border:1.5px solid var(--accent)}
.rv{font:500 12px var(--mono);min-width:56px}

@media (max-width:860px){
  .app{display:flex;flex-direction:column;height:auto}
  .scene{order:1;height:62vh;height:62svh;min-height:400px;flex:none}
  .controls{order:2;padding:10px 16px}
  .panel{order:3;border-left:0;border-top:1px solid var(--trait);padding:20px 16px}
  .head{left:16px;top:14px}
  .liens{margin-top:0;position:static;padding:0;margin-bottom:0}
  input[type=range]{width:110px}
}
@media (max-width:640px){
  .tab span{display:none}
  .tab b{margin:0;font-size:13px}
  .tab[aria-selected="true"] span{display:inline-block}
  .tab[aria-selected="true"] b{margin-right:6px}
}
@media (hover:none) and (pointer:coarse){ .kbd{display:none} }
@media (prefers-reduced-motion:reduce){
  .swap{animation:none}
  .tip,.btn,.comprendre,.tab{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <main class="scene" id="scene">
    <div id="stage"></div>
    <header class="head" id="head">
      <p class="serie" id="serie">Fondations 01·03 — A · Échelles</p>
      <h1 id="titre">Puissances <em>de dix</em></h1>
      <a class="back" href="../index.html">&larr; Accueil de la série</a>
    </header>
    <div class="tip" id="tip"></div>
  </main>

  <aside class="panel" aria-label="Panneau de lecture">
    <div id="toyPanel"></div>
    <section class="kbd">
      <p class="eyebrow">Clavier</p>
      <ul class="hints" id="hints">
        <li><kbd>1</kbd>–<kbd>4</kbd> changer de laboratoire</li>
      </ul>
    </section>
    <nav class="liens">
      <a class="comprendre" id="lienComprendre" href="explication.html"><span>Comprendre ce qui se passe</span><span aria-hidden="true">&rarr;</span></a>
    </nav>
  </aside>

  <div class="controls" role="toolbar" aria-label="Contrôles">
    <div class="tabs" role="tablist" aria-label="Les quatre laboratoires" id="tabs"></div>
    <div id="toyControls"></div>
  </div>
</div>

<script>
/* ============ FX : aides communes aux quatre toys ============ */
const FX = (() => {
  'use strict';
  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const C = {
    fond: tok('--fond'), fond2: tok('--fond-2'), trait: tok('--trait'),
    texte: tok('--texte'), texte2: tok('--texte-2'),
    accent: tok('--accent'), lilas: tok('--acc-a'),
    pos: tok('--positif'), neg: tok('--negatif'), ener: tok('--energie'),
    mono: tok('--mono'), sans: tok('--sans'), serif: tok('--serif'),
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MINUS = '−', NNBSP = ' ';
  const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};

  /** rgba depuis #rrggbb */
  function rgba(hex, a) {
    const h = hex.replace('#','');
    return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
  }
  /** Nombre en français : virgule décimale, espace fine pour les milliers, vrai signe moins. */
  function fmt(x, dec = 2) {
    if (!isFinite(x)) return '—';
    if (Math.abs(x) < 0.5 * Math.pow(10, -dec)) x = 0;
    const s = Math.abs(x).toFixed(dec).split('.');
    s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, NNBSP);
    return (x < 0 ? MINUS : '') + s.join(',');
  }
  /** Signe explicite : +1,50 / −1,50 / 0,00 */
  function fmtS(x, dec = 2) { const t = fmt(x, dec); return (x > 0 && t !== fmt(0, dec)) ? '+' + t : t; }
  /** Exposant en chiffres supérieurs : sup(-5) → ⁻⁵ */
  function sup(n) { return String(n).split('').map(c => SUP[c] || c).join(''); }
  /** Notation scientifique : sci(0.00002, 2) → "2,0 × 10⁻⁵" (sig chiffres significatifs) */
  function sci(x, sig = 2) {
    if (x === 0) return '0';
    let e = Math.floor(Math.log10(Math.abs(x)));
    let m = x / Math.pow(10, e);
    if (Math.abs(+m.toFixed(sig - 1)) >= 10) { e += 1; m = x / Math.pow(10, e); }
    return `${fmt(m, sig - 1)} × 10${sup(e)}`;
  }
  /** Ordre de grandeur : puissance de 10 la plus proche (arrondi du log ; 7,5 µm → 10⁻⁵ m) */
  function ordre(x) { return Math.round(Math.log10(Math.abs(x))); }
  /** Graduations « rondes » (1, 2, 5 × 10ⁿ) entre a et b, environ n graduations */
  function niceTicks(a, b, n = 5) {
    if (a === b) { a -= 1; b += 1; }
    const span = Math.abs(b - a), raw = span / n;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p, step = (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
    const lo = Math.ceil(Math.min(a, b) / step - 1e-9) * step, out = [];
    for (let v = lo; v <= Math.max(a, b) + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
    out.step = step;
    return out;
  }
  /** Couleur selon le signe (eps : seuil sous lequel on considère 0) */
  function signColor(v, eps = 1e-9) { return v > eps ? C.pos : v < -eps ? C.neg : C.texte2; }
  const mono = (px, w = 400) => `${w} ${px}px ${C.mono}`;
  const sans = (px, w = 400) => `${w} ${px}px ${C.sans}`;

  /**
   * Canevas net en HiDPI qui suit la taille de son parent.
   * const cv = FX.canvas(parentEl, signal, onResize) → { el, ctx, w, h } ; onResize(w, h) appelé à chaque changement.
   * Le contexte est déjà mis à l'échelle : on dessine en pixels CSS.
   */
  function canvas(parent, signal, onResize, cssText = 'position:absolute;inset:0;width:100%;height:100%') {
    const el = document.createElement('canvas');
    el.style.cssText = cssText;
    parent.appendChild(el);
    const o = { el, ctx: el.getContext('2d'), w: 0, h: 0 };
    const fit = () => {
      const r = el.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2.5);
      const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      if (w === o.w && h === o.h && el.width === Math.round(w * d)) return;
      o.w = w; o.h = h; el.width = Math.round(w * d); el.height = Math.round(h * d);
      o.ctx.setTransform(d, 0, 0, d, 0, 0);
      onResize && onResize(w, h);
    };
    const ro = new ResizeObserver(fit); ro.observe(el);
    signal && signal.addEventListener('abort', () => ro.disconnect());
    fit();
    return o;
  }
  /** Boucle d'animation : fn(dt en s, t en s) à chaque image jusqu'à l'annulation du signal. dt plafonné à 0,05 s. */
  function loop(fn, signal) {
    let last = performance.now(), id = 0;
    const step = now => {
      if (signal && signal.aborted) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      fn(dt, now / 1000);
      id = requestAnimationFrame(step);
    };
    id = requestAnimationFrame(step);
    signal && signal.addEventListener('abort', () => cancelAnimationFrame(id));
  }
  /** Flèche de (x1,y1) à (x2,y2) */
  function arrow(c, x1, y1, x2, y2, color, width = 2, head = 9) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    c.save(); c.strokeStyle = color; c.fillStyle = color; c.lineWidth = width; c.lineCap = 'round';
    if (L < 0.5) { c.restore(); return; }
    const hd = Math.min(head, L * 0.6), ux = dx / L, uy = dy / L;
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2 - ux * hd * 0.8, y2 - uy * hd * 0.8); c.stroke();
    c.beginPath(); c.moveTo(x2, y2);
    c.lineTo(x2 - ux * hd - uy * hd * 0.45, y2 - uy * hd + ux * hd * 0.45);
    c.lineTo(x2 - ux * hd + uy * hd * 0.45, y2 - uy * hd - ux * hd * 0.45);
    c.closePath(); c.fill(); c.restore();
  }
  /** Étiquette sur un petit fond sombre, lisible par-dessus n'importe quel tracé */
  function tag(c, text, x, y, color = C.texte, align = 'left', base = 'middle', px = 11) {
    c.save(); c.font = mono(px); c.textAlign = align; c.textBaseline = base;
    const w = c.measureText(text).width, h = px + 4;
    let bx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    let by = base === 'middle' ? y - h / 2 : base === 'bottom' ? y - h : y;
    c.fillStyle = rgba(C.fond, 0.82); c.fillRect(bx - 3, by, w + 6, h);
    c.fillStyle = color; c.fillText(text, x, y + (base === 'top' ? 2 : base === 'bottom' ? -2 : 0));
    c.restore();
  }
  /** Infobulle partagée : FX.tip(html, xClient, yClient) ; FX.tip(null) pour cacher */
  const tipEl = document.getElementById('tip'), sceneEl = document.getElementById('scene');
  function tip(html, cx, cy) {
    if (!html) { tipEl.classList.remove('on'); return; }
    tipEl.innerHTML = html; tipEl.classList.add('on');
    const r = sceneEl.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    let x = cx - r.left + 14, y = cy - r.top + 14;
    if (x + tw > r.width - 8) x = cx - r.left - tw - 14;
    if (y + th > r.height - 8) y = cy - r.top - th - 14;
    tipEl.style.transform = 'none';
    tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = Math.max(8, y) + 'px';
  }
  /** Rectangle occupé par l'en-tête, en coordonnées du #stage (pour ne rien y placer d'important) */
  function headRect() {
    const s = document.getElementById('stage').getBoundingClientRect(), h = document.getElementById('head').getBoundingClientRect();
    return { x: h.left - s.left, y: h.top - s.top, w: h.width, h: h.height, bottom: h.bottom - s.top, right: h.right - s.left };
  }
  /** Boutons segmentés de modes : FX.modes(parent, [{id,label,title}], actif, onChange) → { set(id) } */
  function modes(parent, list, active, onChange, signal) {
    const g = document.createElement('div'); g.className = 'grp'; g.setAttribute('role', 'group');
    g.innerHTML = `<span class="gl">Mode</span>` + list.map(m => `<button class="btn" data-m="${m.id}" title="${m.title || m.label}" aria-pressed="false">${m.label}</button>`).join('');
    parent.appendChild(g);
    const set = id => { g.querySelectorAll('.btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === id))); };
    g.addEventListener('click', e => { const b = e.target.closest('.btn'); if (b) { set(b.dataset.m); onChange(b.dataset.m); } }, { signal });
    set(active);
    return { el: g, set };
  }
  /** Le focus est-il dans un champ où les touches ont un sens propre ? */
  function typing(e) { const t = e.target; return t && (t.tagName === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'); }

  /**
   * Formules (KaTeX, chargé depuis cdnjs). Repli lisible en texte Unicode si KaTeX est absent (hors ligne).
   * FX.k(String.raw`\sqrt{A_x^2 + A_y^2}`, '√(Ax² + Ay²)') → chaîne HTML à insérer dans un gabarit.
   * FX.k(tex, repli, true) → formule en mode bloc (centrée, plus grande).
   * FX.tex(racine) → rend tous les éléments [data-tex] (repli = leur texte actuel ; classe .tex-bloc = mode bloc).
   * Couleurs dans une formule (String.raw`…` évite de doubler les barres obliques inverses) : \textcolor{#ff8a5b}{\Delta x}. Prévoir les formules statiques ; les valeurs
   * qui changent à chaque image restent en texte mono à côté (plus rapide, et les chiffres ne sautent pas).
   */
  const hasK = () => typeof window.katex !== 'undefined';
  function k(tex, repli = tex, bloc = false) {
    if (!hasK()) return `<span class="m">${repli}</span>`;
    try { return katex.renderToString(tex, { throwOnError: false, displayMode: bloc, output: 'html' }); }
    catch (e) { return `<span class="m">${repli}</span>`; }
  }
  function tex(root = document) {
    if (!hasK()) return;

      /* ====================== MODE ZOOM ====================== */
      function zoomBy(dec) {

      function buildZoom() {

          g1.appendChild(newBtn(l, d < 0 ? `Zoom avant : champ ${l}` : `Zoom arrière : champ ${l}`, () => zoomBy(d))));

      /** Calcule position et opacité de chaque objet pour le champ courant */
      function zoomLayout(W, H) {
        const L = Math.pow(10, st.logL), cx = W / 2, cy = H / 2;
        return OBJ.map(o => { const f = o.size / L; return { o, f, s: f * W, A: alphaOf(f), LA: labelA(f), cx, cy }; });
      }

      function drawZoom(c, W, H) {
        const L = Math.pow(10, st.logL), cx = W / 2, cy = H / 2;
        // grille : trois niveaux de puissances de dix, qui se fondent d'une décade à l'autre
        if (st.grid) {
          const k0 = Math.floor(st.logL);
          for (let k = k0 - 3; k <= k0 + 2; k++) {
            const px = Math.pow(10, k) / L * W;

            const n = Math.min(120, Math.floor(Math.max(W, H) / 2 / px) + 1);
            for (let i = -n; i <= n; i++) {
              const x = Math.round(cx + i * px) + 0.5, y = Math.round(cy + i * px) + 0.5;

        const lay = zoomLayout(W, H);
        const sorted = lay.slice().sort((a, b) => b.o.size - a.o.size);

        const n = vis.length; c.font = FX.mono(W < 500 ? 10.5 : 11.5);

      /* ====================== MODE LINÉAIRE / LOG ====================== */

      function buildLL() {

            <div class="row"><span class="lab">Axe</span><span class="val" data-k="ax"></span></div>

        body.querySelectorAll('[data-k]').forEach(e => ui[e.dataset.k] = e);
        const g1 = group('Axe');
        ui.bLin = newBtn('Linéaire', 'Axe linéaire', () => setLL(true));
        ui.bLog = newBtn('Logarithmique', 'Axe logarithmique', () => setLL(false));

        const w = document.createElement('div'); w.className = 'ec-rng';
        w.innerHTML = `<input type="range" min="-9" max="13" step="0.01" value="${st.ll.maxLog}" aria-label="Borne maximale de l'axe linéaire, échelle logarithmique"><span class="rv" data-k="rv" style="min-width:64px"></span>`;
        ui.gMax.appendChild(w);
        ui.rng = w.querySelector('input'); ui.rv = w.querySelector('.rv');
        ui.rng.addEventListener('input', () => { st.ll.maxLog = +ui.rng.value; }, { signal });
        ui.bLin.setAttribute('aria-pressed', String(st.ll.lin)); ui.bLog.setAttribute('aria-pressed', String(!st.ll.lin));

      }

      function llGeom(W, H) {
        const m = W < 500 ? 20 : 48;

      /** Positions des repères pour le tracé courant */
      function llLayout(W, H) {
        const g = llGeom(W, H), u = st.ll.u, maxL = Math.pow(10, st.ll.maxLog), span = g.x1 - g.x0, sp = (span - (W < 500 ? 75 : 95)) / OBJ.length;
        let rank = 0;

          const fl = o.size / maxL, inLin = fl <= 1 + 1e-9;

          const sLog = g.x0 + (i + 0.5) * sp;

          return { o, inLin, mx: lerp(xl, xg, u), a: lerp(inLin ? 1 : 0, 1, u), sx: lerp(sLin, sLog, u), xl };
        });
      }

      function drawLL(c, W, H) {
        const g = llGeom(W, H), { x0, x1, axisY } = g, u = st.ll.u, span = x1 - x0, small = W < 500;

        if (aLin > 0.01) {
          c.globalAlpha = aLin; c.fillStyle = C.texte2; c.font = FX.mono(small ? 10 : 11); c.textAlign = 'center'; c.textBaseline = 'top';
          c.strokeStyle = T(0.7); c.beginPath();

          tk.forEach(v => { const x = x0 + v * Math.pow(10, pu) / maxL * span; c.fillText(fmt(v, dec), x, axisY + 10); });

          if (tk.length > 2) braceBelow(c, x0 + tk[1] * Math.pow(10, pu) / maxL * span, x0 + tk[2] * Math.pow(10, pu) / maxL * span, axisY + 34, '+' + fmt(tk.step, dec) + ' ' + unitLin, small);
          c.globalAlpha = 1;

          c.globalAlpha = aLog; c.font = FX.mono(small ? 10 : 11); c.textAlign = 'center'; c.textBaseline = 'top';
          for (let e = -10; e <= 13; e++) {
            const x = x0 + (e + 10) / 23 * span, lab = ((e + 10) % step === 0) || e === 13;
            c.strokeStyle = T(lab ? 0.75 : 0.45); c.beginPath(); c.moveTo(x, axisY); c.lineTo(x, axisY + (lab ? 8 : 5)); c.stroke();
            if (lab && !(e === 13 && step > 1 && (e + 10) % step !== 0 && (13 - (Math.floor(23 / step) * step - 10)) < step * 0.7)) { c.fillStyle = C.texte2; c.fillText('10' + sup(e), x, axisY + 11); }

        }

      /* ====================== MODE PRÉCISION ====================== */
      const INST = {

        pied: { g: 0.01, d: 2, name: 'Pied à coulisse', gl: '0,1 mm' },
      };
      function buildPrec() {
        body.innerHTML = `
          <div><p class="eyebrow">Mode · <b>Précision</b></p>
          <h2>Mesurer, c'est choisir une graduation</h2>
          <p class="txt">La valeur mesurée est le nombre qu'on lit ; la précision dit ce que l'instrument peut distinguer : la moitié de sa plus petite graduation.</p></div>

        ui.rb.setAttribute('aria-pressed', String(st.pr.reveal)); g2.appendChild(ui.rb);
      }
      function setInst(k) {
        st.pr.inst = k; Object.keys(ui.ib || {}).forEach(i => ui.ib[i].setAttribute('aria-pressed', String(i === k)));
      }
      function newObj() { st.pr.len = Math.round((3 + Math.random() * 9) * 1000) / 1000; st.pr.reveal = false; if (ui.rb) { ui.rb.innerHTML = 'révéler la longueur'; ui.rb.setAttribute('aria-pressed', 'false'); } }
      /** Quantités de lecture pour une longueur L (cm) avec l'instrument courant */
      function readOut(L) {
        const I = INST[st.pr.inst], r = Math.round(L / I.g + 1e-9) * I.g, u = I.g / 2;
        const rs = fmt(r, I.d), sig = rs.replace(/[^0-9]/g, '').replace(/^0+/, '').length || 1;

      function drawPrec(c, W, H, dt) {
        const P = st.pr; P.shown += (P.len - P.shown) * (1 - Math.exp(-dt * (FX.reduced ? 30 : 8)));
        if (Math.abs(P.len - P.shown) < 1e-4) P.shown = P.len;
        const L = P.shown, small = W < 500, mx = small ? 18 : 44, ppc = (W - 2 * mx) / 13.2, x0 = mx;
        const { I, r, u } = readOut(L), caliper = P.inst === 'pied';
        const ph = small ? 15 : 24, yP = Math.max(hb + 44, H * 0.3), rh = small ? 54 : 84, yR = yP + ph / 2 + (caliper ? 30 : 22);

        c.strokeStyle = T(0.55); c.lineWidth = 1; c.strokeRect(x0 + 0.5, yR + 0.5, 13.2 * ppc, rh);
        c.strokeStyle = T(0.8); c.beginPath();
        if (P.inst === 'cm') {
          for (let i = 0; i <= 13; i++) { c.moveTo(Math.round(X(i)) + 0.5, yR); c.lineTo(Math.round(X(i)) + 0.5, yR + rh * 0.42); }
        } else {
          for (let i = 0; i <= 132; i++) {
            const len = i % 10 === 0 ? 0.42 : i % 5 === 0 ? 0.3 : 0.18, x = Math.round(X(i / 10)) + 0.5;
            if (ppc / 10 < 3 && i % 5 && i % 10) continue;
            c.moveTo(x, yR); c.lineTo(x, yR + rh * len);
          }
        }
        c.stroke();
        c.fillStyle = C.texte; c.font = FX.mono(small ? 11 : 13); c.textAlign = 'center'; c.textBaseline = 'middle';
        for (let i = 0; i <= 13; i++) c.fillText(String(i), X(i), yR + rh * (caliper ? 0.56 : 0.66));
        c.fillStyle = C.texte2; c.textAlign = 'right'; c.font = FX.mono(11); c.fillText('cm', x0 + 13.2 * ppc - 4, yR + rh - 9);
        // bande d'incertitude et lecture

        c.strokeStyle = EN(0.95); c.lineWidth = 1.2; c.beginPath(); c.moveTo(X(r) - bw / 2, yR); c.lineTo(X(r) - bw / 2, yR + rh); c.moveTo(X(r) + bw / 2, yR); c.lineTo(X(r) + bw / 2, yR + rh); c.stroke();

        c.fillStyle = EN(0.8); c.fillRect(x0, yP - ph / 2, xL - x0 - tipL, ph);
        c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x0, yP - ph / 2, xL - x0 - tipL, 3);
        c.fillStyle = T(0.75); poly(c, [[xL - tipL, yP - ph / 2], [xL, yP], [xL - tipL, yP + ph / 2]], true); c.fill();
        c.fillStyle = '#2a2f38'; poly(c, [[xL - tipL * 0.3, yP - ph * 0.15], [xL, yP], [xL - tipL * 0.3, yP + ph * 0.15]], true); c.fill();
        c.strokeStyle = C.texte; c.lineWidth = 1; c.strokeRect(x0 + 0.5, yP - ph / 2 + 0.5, xL - x0 - tipL - 1, ph - 1);
        // trait de visée de l'extrémité réelle
        c.strokeStyle = T(0.6); c.setLineDash([3, 3]); c.beginPath(); c.moveTo(xL, yP); c.lineTo(xL, yR + rh); c.stroke(); c.setLineDash([]);
        c.strokeStyle = T(0.6); c.beginPath(); c.moveTo(x0 + 0.5, yP - ph / 2 - 4); c.lineTo(x0 + 0.5, yR + rh); c.stroke();
        // pied à coulisse : mâchoires et vernier
        if (caliper) {
          c.fillStyle = C.fond2; c.strokeStyle = T(0.8);
          c.fillRect(x0 - 9, yP - ph / 2 - 10, 9, yR + rh - (yP - ph / 2 - 10)); c.strokeRect(x0 - 8.5, yP - ph / 2 - 9.5, 8, yR + rh - (yP - ph / 2 - 9.5) - 0);
          c.fillRect(xL, yP - ph / 2 - 10, 9, yR + rh - (yP - ph / 2 - 10)); c.strokeRect(xL + 0.5, yP - ph / 2 - 9.5, 8, yR + rh - (yP - ph / 2 - 9.5));
          const pv = yR + rh * 0.6, pw = 9.2 * (ppc / 10) + 8;
          c.fillStyle = AC(0.12); c.fillRect(xL, pv, pw, rh * 0.4); c.strokeStyle = AC(0.7); c.strokeRect(xL + 0.5, pv + 0.5, pw, rh * 0.4 - 1);
          c.beginPath(); c.strokeStyle = AC(0.9);
          for (let j = 0; j <= 10; j++) { const x = xL + j * 0.09 * ppc; c.moveTo(x, pv); c.lineTo(x, pv + rh * 0.18); }
          c.stroke();
        }
        // étiquette de la lecture
        const lab = `${fmt(r, I.d)} ± ${fmt(u, I.d + 1)} cm`;
        FX.tag(c, lab, clamp(X(r), x0 + 70, W - mx - 70), yR + rh + 15, C.ener, 'center', 'middle', small ? 11 : 12.5);
        const ly = yR + rh + 38;
        if (caliper) drawLoupe(c, W, H, L, mx, ly, small);
        else drawBars(c, W, H, I, r, u, mx, ly, small);
      }

      function drawBars(c, W, H, I, r, u, mx, ly, small) {
        const BW = small ? 120 : 250, lab = small ? 64 : 88, bx = mx + lab, ch = small ? 11.5 : 12.5;
        if (H - ly < 70) return;
        c.fillStyle = C.texte2; c.font = FX.mono(11); c.textAlign = 'left'; c.textBaseline = 'middle';
        c.fillText('Même nombre, deux messages', mx, ly);
        const cx = bx + BW / 2;
        [[fmt(r, I.d), 2 * u, 0], [fmt(r, I.d + 1), 2 * u / 10, 1]].forEach(([t, w, k]) => {
          const y = ly + 26 + k * 26, ww = Math.max(2.5, w / (2 * u) * BW);
          c.fillStyle = C.texte; c.font = FX.mono(ch); c.textAlign = 'left'; c.fillText(t + ' cm', mx, y);
          c.fillStyle = T(0.08); c.fillRect(bx, y - 9, BW, 18);
          c.fillStyle = k ? EN(0.95) : EN(0.55); c.fillRect(cx - ww / 2, y - 6, ww, 12);
          c.fillStyle = C.texte2; c.font = FX.mono(11); c.fillText('± ' + fmt(k ? u / 10 : u, I.d + 1 + k), bx + BW + 10, y);
        });
      }

      function drawLoupe(c, W, H, L, mx, ly, small) {
        const bh = Math.min(H - ly - 30, small ? 100 : 150), w = W - 2 * mx;
        if (bh < 70) return;
        const Lmm = L * 10, red = Math.round(Lmm * 10 + 1e-9) / 10, M = Math.floor(red + 1e-9), n = Math.round((red - M) * 10);
        const a = Lmm - 1.6, pxmm = w / 12, X = mm => mx + (mm - a) * pxmm;
        c.save(); c.beginPath(); c.rect(mx, ly, w, bh); c.clip();
        c.fillStyle = C.fond2; c.fillRect(mx, ly, w, bh);
        const mid = ly + bh * 0.5;
        // échelle principale (mm)
        c.strokeStyle = T(0.8); c.lineWidth = 1; c.fillStyle = C.texte; c.font = FX.mono(small ? 10 : 11.5); c.textAlign = 'center'; c.textBaseline = 'top';
        for (let m = Math.ceil(a); m <= a + 12; m++) {
          const x = Math.round(X(m)) + 0.5, hit = m === M + n;
          c.strokeStyle = hit ? C.ener : T(0.8); c.lineWidth = hit ? 1.6 : 1;
          c.beginPath(); c.moveTo(x, ly); c.lineTo(x, mid - 6); c.stroke();
          c.fillStyle = hit ? C.ener : C.texte; c.fillText(String(m), x, ly + 4);
        }
        // vernier : 10 divisions sur 9 mm, zéro au bout du crayon
        c.fillStyle = AC(0.1); c.fillRect(X(Lmm) - 3, mid, 9 * pxmm + 6, bh * 0.5 - 2);
        c.strokeStyle = AC(0.6); c.strokeRect(X(Lmm) - 2.5, mid + 0.5, 9 * pxmm + 5, bh * 0.5 - 3);
        for (let j = 0; j <= 10; j++) {
          const x = Math.round(X(Lmm + 0.9 * j)) + 0.5, hit = j === n;
          c.strokeStyle = hit ? C.ener : AC(0.95); c.lineWidth = hit ? 1.6 : 1;
          c.beginPath(); c.moveTo(x, mid + (hit ? -6 : 0)); c.lineTo(x, mid + 13); c.stroke();
          if (j % 5 === 0 || hit) { c.fillStyle = hit ? C.ener : C.texte; c.textBaseline = 'top'; c.fillText(String(j), x, mid + 17); }
        }
        // bande d'incertitude : ± 0,05 mm
        c.fillStyle = EN(0.2); const bw = 0.1 * pxmm, xr = X(M + n); c.fillRect(xr - bw / 2, ly, bw, bh);

        c.strokeStyle = T(0.7); c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(Lmm), ly); c.lineTo(X(Lmm), mid + 2); c.stroke(); c.setLineDash([]);
        c.restore();
        c.strokeStyle = T(0.4); c.lineWidth = 1; c.strokeRect(mx + 0.5, ly + 0.5, w - 1, bh - 1);

      }

      /* ====================== PANNEAU ====================== */
      function updatePanel(force) {
        if (st.mode === 'zoom') {
          const L = Math.pow(10, st.logL), p = pexp(L);
          setTxt(ui.dec, `${lenStr(L, 2)}`);
          setTxt(ui.sci, sciM(L));
          { const n = Math.round(st.logL); if (ui.ord._n !== n) { ui.ord._n = n; ui.ord.innerHTML = FX.k(String.raw`10^{${n < 0 ? '-' : ''}${Math.abs(n)}}\ \mathrm{m}`, `10${sup(n)} m`); } }
          const r = L / HUMAIN;
          setTxt(ui.hum, r >= 1 ? `le champ = ${nbr(r)} humain${r >= 2 ? 's' : ''}` : `1 humain = ${nbr(1 / r)} champs`);
          ui.preEls.forEach(e => e.classList.toggle('on', +e.dataset.p === p));
          const names = zoomLayout(cv.w, cv.h).filter(i => i.LA > 0.5).sort((a, b) => a.o.size - b.o.size).map(i => i.o.name);
          setTxt(ui.in, names.length ? 'Dans le champ : ' + names.join(', ') + '.' : 'Rien de nommé à cette échelle : le champ est entre deux objets.');
          if (ui.rv) setTxt(ui.rv, lenStr(L, 2));
          if (ui.rng && document.activeElement !== ui.rng) ui.rng.value = st.logL; else if (ui.rng && st.tween) ui.rng.value = st.logL;
        } else if (st.mode === 'loglin') {
          const lin = st.ll.lin, maxL = Math.pow(10, st.ll.maxLog);
          setTxt(ui.h2, lin ? 'Presque tout s\'écrase sur zéro' : 'Chaque décade a la même longueur');
          setTxt(ui.ax, lin ? 'linéaire' : 'logarithmique');
          setTxt(ui.max, lin ? lenStr(maxL, 2) : '10⁻¹⁰ m à 10¹³ m');
          const on = OBJ.filter(o => lin ? o.size <= maxL : true), span = cv.w - 2 * (cv.w < 500 ? 20 : 48);
          setTxt(ui.on, `${on.length} <i>sur 15</i>`);
          const crush = lin ? on.filter(o => o.size / maxL * span < 3).length : 0;
          setTxt(ui.crush, lin ? `${crush} <i>objets (&lt; 3 px)</i>` : '<i>aucun : ×10 = même longueur</i>');
          setTxt(ui.span, FX.sci(OBJ[14].size / OBJ[0].size, 1) + ' <i>fois</i>');
          if (ui.rv) setTxt(ui.rv, lenStr(maxL, 2));

          const P = st.pr, { I, r, u, rs, sig } = readOut(P.len), d = I.d;
          setTxt(ui.grad, I.gl);
          setTxt(ui.read, `${rs} <i>cm</i>`);
          setTxt(ui.unc, `± ${fmt(u, d + 1)} <i>cm</i>`);
          setTxt(ui.wr, `${rs} ± ${fmt(u, d + 1)} <i>cm</i>`);
          setTxt(ui.sig, String(sig));
          setTxt(ui.si, FX.sci(r / 100, sig) + ' <i>m</i>');
          setTxt(ui.real, P.reveal ? `${fmt(P.len, 3)} <i>cm</i>` : '<i>cachée</i>');

          }

          setTxt(ui.nt, P.reveal ? `Écart réel : ${fmt(Math.abs(P.len - r), d + 2)} cm, ${inside ? 'inférieur ou égal à' : 'supérieur à'} l'incertitude ${fmt(u, d + 1)} cm.` : 'Révèle la vraie longueur pour vérifier que l\'écart reste sous l\'incertitude.');

      /* ====================== ENTRÉES ====================== */
      function wheelDelta(e) { return e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1); }

      }, { passive: false, signal });

      const pt = e => { const r = cv.el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      let tipTimer = 0;
      signal.addEventListener('abort', () => clearTimeout(tipTimer));
      function hoverAt(e, p) {
        let html = null, id = null;
        if (st.mode === 'zoom') {
          const W = cv.w, H = cv.h, lay = zoomLayout(W, H).filter(i => i.A > 0.3).sort((a, b) => a.o.size - b.o.size);
          for (const it of lay) if (hitTest(it.o, p.x - it.cx, p.y - it.cy, it.s)) { id = it.o.id; html = tipHtml(it.o); break; }
        } else if (st.mode === 'loglin') {
          const g = llGeom(cv.w, cv.h), near = llLayout(cv.w, cv.h).filter(i => i.a > 0.5 && Math.hypot(p.x - i.mx, p.y - g.axisY) < 11);
          if (near.length) { id = near[0].o.id; html = near.length === 1 ? tipHtml(near[0].o) : `<b>${near.length} objets ici</b>` + near.map(i => `${i.o.name} <span>${i.o.sizeStr}</span>`).join('<br>'); }
        }
        st.hover = id;
        if (html) FX.tip(html, e.clientX, e.clientY); else FX.tip(null);
        cv.el.style.cursor = id ? 'help' : (st.mode === 'zoom' ? 'ns-resize' : 'default');
      }
      scene.addEventListener('pointerdown', e => {
        if (e.button > 0 || e.target !== cv.el) return;
        st.dragging = { y: e.clientY, id: e.pointerId, moved: false, x: e.clientX };
        try { cv.el.setPointerCapture(e.pointerId); } catch (_) { /* sans effet */ }
      }, { signal });
      scene.addEventListener('pointermove', e => {
        const d = st.dragging;
        if (d && d.id === e.pointerId) {
          if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 4) d.moved = true;
          if (d.moved && st.mode === 'zoom') {
            st.tween = null; st.logL = st.target = clamp(st.logL + (e.clientY - d.y) * 0.012, LMIN, LMAX); d.y = e.clientY; FX.tip(null); st.hover = null;
          }
          return;
        }
        if (e.pointerType === 'mouse' && e.target === cv.el) hoverAt(e, pt(e));
      }, { signal });
      const up = e => {
        const d = st.dragging; if (!d || d.id !== e.pointerId) return;
        st.dragging = null;
        if (!d.moved && e.pointerType !== 'mouse') {
          hoverAt(e, pt(e)); clearTimeout(tipTimer); tipTimer = setTimeout(() => { FX.tip(null); st.hover = null; }, 3000);
        }
      };
      scene.addEventListener('pointerup', up, { signal });
      scene.addEventListener('pointercancel', up, { signal });
      scene.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { FX.tip(null); st.hover = null; } }, { signal });

      window.addEventListener('keydown', e => {
        if (FX.typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
        const tg = e.target, onBtn = tg.tagName === 'BUTTON', onRng = tg.tagName === 'INPUT';
        const k = e.key;
        if (st.mode === 'zoom' && (k === '+' || k === '=' || k === '-' || k === '_' || k === 'ArrowUp' || k === 'ArrowDown')) {
          if (onRng && (k === 'ArrowUp' || k === 'ArrowDown')) return;
          zoomBy(k === '+' || k === '=' || k === 'ArrowUp' ? -1 : 1); e.preventDefault();
          // « + » = zoom avant = champ ÷10
        } else if (k === ' ' && st.mode === 'loglin' && !onBtn && !onRng) { setLL(!st.ll.lin); e.preventDefault(); }
        else if (st.mode === 'prec' && (k === 'n' || k === 'N')) newObj();
        else if (st.mode === 'prec' && (k === 'ArrowLeft' || k === 'ArrowRight') && !onRng) {
          const ks = Object.keys(INST), i = clamp(ks.indexOf(st.pr.inst) + (k === 'ArrowRight' ? 1 : -1), 0, 2); setInst(ks[i]); e.preventDefault();
        }
      }, { signal });

      /* ====================== BOUCLE ====================== */
      let pTick = 0;
      FX.loop((dt) => {
        const c = cv.ctx, W = cv.w, H = cv.h;
        // dynamique du zoom
        if (st.tween) {
          const tw = st.tween; tw.t += dt;
          const k = clamp(tw.t / tw.dur, 0, 1); st.logL = tw.from + (tw.to - tw.from) * ease(k); st.target = st.logL;
          if (k >= 1) { st.logL = st.target = tw.to; st.tween = null; }
        } else if (Math.abs(st.target - st.logL) > 1e-5) {
          st.logL += (st.target - st.logL) * (1 - Math.exp(-dt * (FX.reduced ? 40 : 13)));
        }
        const an = st.ll.anim;
        if (an) { an.t += dt; const k = clamp(an.t / an.dur, 0, 1); st.ll.u = lerp(an.from, an.to, ease(k)); if (k >= 1) { st.ll.u = an.to; st.ll.anim = null; } }

        c.clearRect(0, 0, W, H);
        c.save();
        if (st.mode === 'zoom') drawZoom(c, W, H);
        else if (st.mode === 'loglin') drawLL(c, W, H);
        else drawPrec(c, W, H, dt);
        c.restore();
        pTick += dt;
        if (pTick > 0.05 || st.tween) { pTick = 0; updatePanel(false); }
      }, signal);

      setMode('zoom');
    },
    unmount() { /* tout est attaché au signal d'annulation */ },
  });
})();
</script>
<script>
/* ============ Toy B · Graphiques — « Le réservoir » ============ */
(() => {
  'use strict';
  const C = FX.C, fmt = FX.fmt, fmtS = FX.fmtS, rgba = FX.rgba, sgn = FX.signColor;
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const CAP = 100, TMAX = 10, KT = 2.5; // capacité (L), durée de l'axe (min), coefficient de vidange (L^½/min)
  const V4 = 100;                       // volume de départ du mode non linéaire
  const V3 = 50;                        // volume de départ du mode aire

  /** Nombre pour KaTeX : virgule décimale, vrai signe moins */
  const tx = (v, d = 1) => fmt(v, d).replace(',', '{,}').replace('−', '-');
  const col = c => c.replace('#', '');
  const kc = (c, s) => String.raw`\textcolor{#${col(c)}}{${s}}`;

  /* ---------- le modèle : volume V(t) et débit effectif Q(t) ---------- */
  const P = { // réglages propres à chaque mode
    prop: { Q: 5, t1: 3 },
    pente: { V0: 30, Q: 6 },
    aire: { Q: 4 },
  };
  /** Volume (L) à l'instant t pour les modes en forme fermée ; borné à [0, CAP] */
  function Vclosed(mode, t) {
    if (mode === 'prop') return clamp(P.prop.Q * t, 0, CAP);
    if (mode === 'pente') return clamp(P.pente.V0 + P.pente.Q * t, 0, CAP);
    const s = Math.max(0, Math.sqrt(V4) - KT * t / 2); // solution exacte : √V = √V₀ − k t / 2
    return s * s;
  }
  /** Débit effectif : tombe à 0 quand le réservoir est plein ou vide */
  function Qclosed(mode, t) {
    if (mode === 'prop' || mode === 'pente') {
      const p = P[mode], raw = (mode === 'prop' ? 0 : p.V0) + p.Q * t;
      if (p.Q > 0 && raw < CAP) return p.Q;
      if (p.Q < 0 && raw > 0) return p.Q;
      return 0;
    }
    return Vclosed('non', t) > 1e-9 ? -KT * Math.sqrt(Vclosed('non', t)) : 0;
  }

  FX.register('graphiques', {
    num: 'B', titre: 'Graphiques', titreHtml: 'Le <em>réservoir</em>',
    hints: [
      '<kbd>Espace</kbd> lecture / pause · <kbd>R</kbd> réinitialiser',
      '<kbd>↑</kbd> <kbd>↓</kbd> débit Q ± 0,5 L/min',

      panel.appendChild(body);

      const modeList = [
        { id: 'prop', label: 'Proportionnalité', title: 'V = Q · t, une droite par l\'origine' },
        { id: 'pente', label: 'Pente', title: 'La pente est un débit' },
        { id: 'aire', label: 'Aire', title: 'L\'aire sous Q(t) est un volume' },

      }

      }

      function buildPanel(id) {

          pente: ['Pente', 'La pente est un débit', 'Entre deux instants, le volume change de ΔV pendant Δt. Leur rapport est la pente, et son unité est celle de V divisée par celle de t.'],

          non: ['Non linéaire', 'Une pente qui change', 'Un trou vide le réservoir : plus le niveau baisse, moins l\'eau est poussée. Plus la courbe est raide, plus le volume change vite ; la pente change d\'un point à l\'autre.'],

          aire: [['q', 'Débit Q maintenant'], ['t', 'Temps t'], ['area', 'Aire signée = ΔV'], ['split', 'au-dessus / dessous'], ['v', 'Volume V']],

          <div class="meas">${rows[id].map(r => `<div class="row"><span class="lab">${r[1]}</span><span class="val" data-k="${r[0]}"></span></div>`).join('')}</div>

      }

      const unit = (v, u) => `${v} <i>${u}</i>`;
      const colored = (v, s) => `<span style="color:${sgn(v, 1e-9)}">${s}</span>`;

      function updatePanel() {
        const m = st.mode, t = st.t, end = endTime();
        if (ui.tl) setTxt(ui.tl, `t = ${fmt(t, 1)} min`);

            FX.k(String.raw`t:\ ${tx(t1)} \to ${tx(2 * t1)}\ \mathrm{min}\ \Rightarrow\ V:\ ${tx(v1)} \to ${tx(v2)}\ \mathrm{L}`, `t : ${fmt(t1, 1)} → ${fmt(2 * t1, 1)} min ⇒ V : ${fmt(v1, 1)} → ${fmt(v2, 1)} L`) +

          setTxt(ui.q, unit(fmt(Q, 1), 'L/min'));

            FX.k(String.raw`\text{pente} = \dfrac{\Delta V}{\Delta t}`, 'pente = ΔV / Δt') +
            FX.k(String.raw`= \dfrac{${kc(sgn(dV), tx(dV) + String.raw`\ \mathrm{L}`)}}{1\ \mathrm{min}} = ${kc(sgn(dV), tx(dV) + String.raw`\ \mathrm{L/min}`)}`, `= ${fmt(dV, 1)} L / 1 min = ${fmt(dV, 1)} L/min`));
          setTxt(ui.nt, V0 === 0 ? 'V₀ = 0 : la droite passe par l\'origine, la relation est proportionnelle (V ÷ t reste égal à Q).' :

          setTxt(ui.q, colored(st.qNow, unit(fmtS(st.qNow, 1), 'L/min')));

          setTxt(ui.v, unit(fmt(V, 1), 'L'));

            FX.k(String.raw`\text{aire} = Q \times \Delta t`, 'aire = Q × Δt') +
            FX.k(String.raw`\dfrac{\mathrm{L}}{\mathrm{min}} \times \mathrm{min} = \mathrm{L}`, 'L/min × min = L'));

      /* ====================== MISE EN PAGE ====================== */
      function layout(W, H) {

        if (wide) {

          const tw = clamp(zw * 0.5, 120, 200);
          let th = clamp(H - 250, 200, 460), ty = Math.max(hb + 104, Math.round((H - th) / 2) + 20);
          if (ty + th > H - 84) th = H - 84 - ty;
          L.tank = { x: Math.round((zw - tw) / 2) + 18, y: ty, w: tw, h: Math.max(th, 140) };
          const px = zw + 62, pw = W - px - 28;
          let ph = Math.min(H - 110, pw * 0.85); ph = Math.max(ph, 220);

        } else {

          L.tank = { x: 50, y: hb + 52, w: clamp(Math.round(W * 0.34), 100, 150), h: th };
          const py = hb + tzh + 30;
          L.plot = { x: 46, y: py, w: W - 46 - 16, h: Math.max(100, H - py - 36) };
        }
        return L;
      }

      /* ====================== RÉSERVOIR ====================== */
      function stream(c, x, y0, y1, w, color) {
        if (y1 - y0 < 1 || w < 0.4) return;
        c.fillStyle = rgba(color, 0.5); c.fillRect(x - w / 2, y0, w, y1 - y0);
        c.strokeStyle = rgba(C.texte, 0.55); c.lineWidth = Math.max(0.8, w * 0.22); c.setLineDash([6, 9]); c.lineDashOffset = -st.phase * 70;
        c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke(); c.setLineDash([]); c.lineDashOffset = 0;
      }
      const wFlow = q => 1 + 0.6 * Math.abs(q);

      function currentState() {
        const m = st.mode;
        if (m === 'aire') { const h = st.h, n = h.t.length; return { V: h.v[n - 1], Q: st.qNow }; }
        return { V: Vclosed(m, st.t), Q: Qclosed(m, st.t) };
      }

      function drawTank(c, L, W, H) {
        const T = L.tank, { V, Q } = currentState(), m = st.mode, small = !L.wide;
        const bx = T.x, by = T.y + T.h, bw = T.w, th = T.h;
        const yOf = v => by - v / CAP * th;
        const yL = yOf(V);
        const nx = bx + bw * 0.5; // axe du robinet et de l'évacuation
        // eau
        if (V > 0.05) {
          const amp = Math.min(2.6, 0.6 + 0.5 * Math.sqrt(Math.abs(Q))), w = st.phase * 5;
          const g = c.createLinearGradient(0, yL, 0, by); g.addColorStop(0, rgba(C.accent, 0.38)); g.addColorStop(1, rgba(C.accent, 0.14));
          c.fillStyle = g; c.beginPath(); c.moveTo(bx + 1, by - 1);
          for (let x = bx + 1; x <= bx + bw - 1; x += 3) c.lineTo(x, yL + (Math.abs(Q) > 0.01 ? amp * Math.sin(x * 0.09 + w) : 0));
          c.lineTo(bx + bw - 1, by - 1); c.closePath(); c.fill();
          c.strokeStyle = rgba(C.accent, 0.95); c.lineWidth = 1.5; c.beginPath();
          for (let x = bx + 1; x <= bx + bw - 1; x += 3) { const y = yL + (Math.abs(Q) > 0.01 ? amp * Math.sin(x * 0.09 + w) : 0); x === bx + 1 ? c.moveTo(x, y) : c.lineTo(x, y); }
          c.stroke();

        const mark = (v, label, color, alpha, dash) => {

          c.fillStyle = rgba(color, Math.min(1, alpha + 0.2)); c.textAlign = 'left'; c.fillText(label, bx + bw + 6, yOf(v));
        };
        if (m === 'prop') {
          const t1 = P.prop.t1;
          mark(Vclosed('prop', t1), 'V(t₁)', C.ener, st.t >= t1 ? 0.9 : 0.3, true);

        } else if (m === 'pente') {
          mark(P.pente.V0, 'V₀', C.texte2, 0.9, true);
        } else if (m === 'aire') {
          const y0 = yOf(V3), y1 = yL, cc = sgn(V - V3, 0.02);
          c.strokeStyle = rgba(C.texte2, 0.7); c.setLineDash([3, 3]); c.beginPath(); c.moveTo(bx - 8, y0); c.lineTo(bx + bw + 8, y0); c.stroke(); c.setLineDash([]);
          if (Math.abs(y1 - y0) > 1) {
            const xb = bx + bw + 12;
            c.strokeStyle = cc; c.lineWidth = 2; c.beginPath(); c.moveTo(xb, y0); c.lineTo(xb, y1); c.stroke();
            c.fillStyle = cc; c.textAlign = 'left'; c.fillText('ΔV = ' + fmtS(V - V3, 1) + ' L', xb + 6, (y0 + y1) / 2);
          }
        }
        // parois et graduations (réservoir ouvert dessus)
        c.strokeStyle = rgba(C.texte, 0.9); c.lineWidth = 1.6; c.lineJoin = 'round';
        c.beginPath(); c.moveTo(bx, T.y - 4); c.lineTo(bx, by); c.lineTo(bx + bw, by); c.lineTo(bx + bw, T.y - 4); c.stroke();
        c.fillStyle = C.texte2; c.font = FX.mono(small ? 9.5 : 10.5); c.textAlign = 'right'; c.textBaseline = 'middle';
        const step = small ? 50 : 20;
        for (let v = 0; v <= CAP; v += step) {
          const y = yOf(v); c.strokeStyle = rgba(C.texte, 0.55); c.lineWidth = 1; c.beginPath(); c.moveTo(bx - 6, y); c.lineTo(bx, y); c.stroke();
          c.fillText(String(v), bx - 9, y);
        }
        c.textAlign = 'right'; c.fillText('L', bx - 9, T.y - 14);
        // robinet : tuyau, buse, volant (il tourne avec le débit positif)
        const open = m === 'non' ? 0 : clamp(Q / 10, 0, 1), py = T.y - (small ? 24 : 40), pxL = bx - (small ? 8 : 26);
        c.strokeStyle = rgba(C.texte, 0.9); c.lineWidth = 1.6; c.fillStyle = C.fond;
        c.beginPath(); c.moveTo(pxL - (small ? 22 : 40), py - 5); c.lineTo(nx - 6, py - 5); c.lineTo(nx - 6, py + 5); c.lineTo(pxL - (small ? 22 : 40), py + 5); c.stroke();
        c.beginPath(); c.moveTo(nx - 8, py + 5); c.lineTo(nx - 8, py + 12); c.lineTo(nx + 8, py + 12); c.lineTo(nx + 8, py - 5); c.lineTo(nx - 6, py - 5); c.stroke();
        const hx = pxL + (small ? 6 : 8), hy = py - 14, ang = (m === 'non' ? 0 : Math.max(0, Q)) / 10 * Math.PI * 0.9;
        c.beginPath(); c.moveTo(hx, hy + 9); c.lineTo(hx, py - 5); c.stroke();
        c.save(); c.translate(hx, hy); c.rotate(ang); c.strokeStyle = rgba(open > 0 ? C.accent : C.texte2, 1); c.beginPath(); c.moveTo(-9, 0); c.lineTo(9, 0); c.stroke(); c.restore();
        // orifice d'évacuation au fond
        c.strokeStyle = rgba(C.texte, 0.9); c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(nx - 5, by); c.lineTo(nx - 5, by + 10); c.moveTo(nx + 5, by); c.lineTo(nx + 5, by + 10); c.stroke();
        // filets : épaisseur proportionnelle à |Q|
        if (Q > 0.01) stream(c, nx, py + 12, Math.max(py + 12, V > 0.05 ? yL : by), wFlow(Q), C.accent);
        if (Q < -0.01) stream(c, nx, by + 10, Math.min(H - 20, by + 10 + (small ? 18 : 56)), wFlow(Q), C.accent);
        // étiquettes de lecture
        const fs = small ? 10.5 : 12;
        if (small) FX.tag(c, `Q = ${fmtS(Q, 1)} L/min`, nx + 16, py + 2, sgn(Q, 1e-9), 'left', 'middle', fs);
        else if (m !== 'non') FX.tag(c, `Q = ${fmtS(Q, 1)} L/min`, bx - 20, py - 38, sgn(Q, 1e-9), 'left', 'middle', fs);
        else FX.tag(c, `Q = ${fmtS(Q, 1)} L/min`, bx + bw + 8, by + 22, sgn(Q, 1e-9), 'left', 'middle', fs);
        const vy = clamp(yL, T.y + 8, by - 8);
        if (small) FX.tag(c, `V = ${fmt(V, 1)} L`, bx + bw + 8, by - 10, C.texte, 'left', 'middle', fs); else FX.tag(c, `V = ${fmt(V, 1)} L`, bx, by + 30, C.texte, 'left', 'middle', fs);
        L.hit = { x: bx - 40, y: T.y - 70, w: bw + 80, h: th + 100, tank: { x: bx, y: T.y, w: bw, h: th }, nozzle: { x: pxL - 40, y: py - 24, w: nx - pxL + 56, h: 48 } };
      }

      /* ====================== GRAPHE ====================== */
      /** Cadre : grille, axes, graduations rondes, titres avec unités */
      function frame(c, r, ymin, ymax, ticks, ytitle, xlabels, small) {
        const X = t => r.x + t / TMAX * r.w, Y = v => r.y + r.h - (v - ymin) / (ymax - ymin) * r.h;
        c.lineWidth = 1; c.strokeStyle = rgba(C.trait, 1);
        c.beginPath();
        FX.niceTicks(0, TMAX, 5).forEach(t => { const x = Math.round(X(t)) + 0.5; c.moveTo(x, r.y); c.lineTo(x, r.y + r.h); });
        ticks.forEach(v => { const y = Math.round(Y(v)) + 0.5; c.moveTo(r.x, y); c.lineTo(r.x + r.w, y); });
        c.stroke();
        c.strokeStyle = rgba(C.texte, 0.75); c.beginPath(); c.moveTo(r.x + 0.5, r.y - 4); c.lineTo(r.x + 0.5, r.y + r.h + 0.5); c.lineTo(r.x + r.w + 4, r.y + r.h + 0.5); c.stroke();
        c.fillStyle = C.texte2; c.font = FX.mono(small ? 10 : 11);
        c.textAlign = 'right'; c.textBaseline = 'middle';
        ticks.forEach(v => c.fillText(fmt(v, 0), r.x - 7, Y(v)));
        if (xlabels) { c.textAlign = 'center'; c.textBaseline = 'top'; FX.niceTicks(0, TMAX, 5).forEach(t => c.fillText(fmt(t, 0), X(t), r.y + r.h + 7)); }
        c.fillStyle = C.texte; c.textAlign = 'left'; c.textBaseline = 'bottom'; c.font = FX.mono(small ? 11 : 12);
        c.fillText(ytitle, r.x - (small ? 40 : 46), r.y - 10);
        if (xlabels) { c.textAlign = 'right'; c.textBaseline = 'top'; c.fillText('t (min)', r.x + r.w, r.y + r.h + (small ? 22 : 26)); }
        return { X, Y };
      }
      function trace(c, f, X, Y, t0, t1, n = 140) {
        c.beginPath();
        for (let i = 0; i <= n; i++) { const t = t0 + (t1 - t0) * i / n, x = X(t), y = Y(f(t)); i ? c.lineTo(x, y) : c.moveTo(x, y); }
      }
      function dot(c, x, y, r, color, ring) {
        c.fillStyle = ring ? C.fond : color; c.strokeStyle = color; c.lineWidth = 1.8; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.stroke();
      }

      function drawGraph(c, L, W, H) {
        const m = st.mode, r = L.plot, small = !L.wide, t = st.t;
        c.save(); c.lineJoin = 'round';
        if (m === 'aire') drawAire(c, L, small);
        else {
          const yt = FX.niceTicks(0, CAP, 5), { X, Y } = frame(c, r, 0, 104, yt, 'V (L)', true, small);
          L.X = X; L.Y = Y; L.ymin = 0; L.ymax = 104;
          const f = tt => Vclosed(m, tt), end = endTime();
          // courbe complète (modèle), puis la partie déjà parcourue
          c.strokeStyle = rgba(C.texte, 0.28); c.lineWidth = 1.6; c.setLineDash([4, 5]); trace(c, f, X, Y, 0, m === 'non' ? 8 : TMAX); c.stroke(); c.setLineDash([]);
          c.strokeStyle = C.texte; c.lineWidth = 2.4; trace(c, f, X, Y, 0, Math.min(t, TMAX), Math.max(2, Math.round(160 * t / TMAX))); c.stroke();
          // réservoir plein ou vide : pente nulle, dite honnêtement
          if (m !== 'non') {
            const p = P[m], V0 = m === 'prop' ? 0 : p.V0;
            if (p.Q !== 0) {
              const ts = p.Q > 0 ? (CAP - V0) / p.Q : (0 - V0) / p.Q;
              if (ts > 0.05 && ts < TMAX - 0.1) FX.tag(c, p.Q > 0 ? 'plein : pente nulle' : 'vide : pente nulle', X(ts) + 8, Y(p.Q > 0 ? CAP : 0) + (p.Q > 0 ? 14 : -12), C.texte2, 'left', 'middle', small ? 10 : 11);
              if (ts > 0.05 && ts < TMAX - 0.1) dot(c, X(ts), Y(p.Q > 0 ? CAP : 0), 3, C.texte2, true);
            } else if (V0 === 0 && m === 'pente') { /* droite horizontale à 0 */ }
          }
          if (m === 'prop') drawProp(c, L, X, Y, small);
          else if (m === 'pente') drawPente(c, L, X, Y, small);
          else drawNon(c, L, X, Y, small);
          // tête de lecture
          if (t > 0) { c.strokeStyle = rgba(C.ener, 0.55); c.lineWidth = 1; c.beginPath(); c.moveTo(X(t), r.y); c.lineTo(X(t), r.y + r.h); c.stroke(); }
          if (m !== 'non') dot(c, X(t), Y(f(t)), 4.5, C.ener, false);
        }
        c.restore();
      }

      function drawProp(c, L, X, Y, small) {
        const t1 = P.prop.t1, r = L.plot, fs = small ? 10 : 11.5;
        for (const [k, tt] of [[1, t1], [2, 2 * t1]]) {
          const v = Vclosed('prop', tt), x = X(tt), y = Y(v), on = st.t >= tt;
          c.strokeStyle = rgba(C.ener, on ? 0.95 : 0.5); c.lineWidth = 1; c.setLineDash([3, 4]);
          c.beginPath(); c.moveTo(x, r.y + r.h); c.lineTo(x, y); c.lineTo(r.x, y); c.stroke(); c.setLineDash([]);
          dot(c, x, y, 4, C.ener, !on);
          FX.tag(c, `${fmt(v, 1)} L`, r.x + 6, y - 11, C.ener, 'left', 'middle', fs);
          FX.tag(c, k === 1 ? `t₁ = ${fmt(tt, 1)}` : `2t₁ = ${fmt(tt, 1)}`, x, r.y + r.h - 12, C.ener, 'center', 'middle', fs);
        }
        // flèche « ×2 » entre les deux repères
        const ya = Y(Vclosed('prop', t1)), yb = Y(Vclosed('prop', 2 * t1)), xm = X(2 * t1) + 14;
        if (xm < r.x + r.w - 60) FX.tag(c, '×2 sur t, ×2 sur V', xm, (ya + yb) / 2 + 18, C.texte, 'left', 'middle', fs);
      }

      function drawPente(c, L, X, Y, small) {
        const { V0, Q } = P.pente, ta = clamp(st.t, 0, TMAX - 1), fs = small ? 10 : 11.5;
        const va = Vclosed('pente', ta), vb = Vclosed('pente', ta + 1), dV = vb - va, cc = sgn(dV, 1e-9);
        // ordonnée à l'origine
        dot(c, X(0), Y(V0), 4, C.texte, true);
        FX.tag(c, `V₀ = ${fmt(V0, 0)} L`, X(0) + 10, Y(V0) + (Q > 0 ? 16 : -16), C.texte, 'left', 'middle', fs);
        // triangle de pente : Δt = 1 min, ΔV
        c.fillStyle = rgba(cc, 0.2); c.beginPath(); c.moveTo(X(ta), Y(va)); c.lineTo(X(ta + 1), Y(va)); c.lineTo(X(ta + 1), Y(vb)); c.closePath(); c.fill();
        c.lineWidth = 1.6; c.strokeStyle = rgba(C.texte2, 1); c.beginPath(); c.moveTo(X(ta), Y(va)); c.lineTo(X(ta + 1), Y(va)); c.stroke();
        c.strokeStyle = cc; c.lineWidth = 2.2; c.beginPath(); c.moveTo(X(ta + 1), Y(va)); c.lineTo(X(ta + 1), Y(vb)); c.stroke();
        const up = dV >= 0;
        FX.tag(c, 'Δt = 1 min', X(ta + 0.5), Y(va) + (up ? 13 : -13), C.texte2, 'center', 'middle', fs);
        const flip = X(ta + 1) + 110 > L.plot.x + L.plot.w;
        FX.tag(c, `ΔV = ${fmtS(dV, 1)} L`, X(ta + 1) + (flip ? -8 : 8), (Y(va) + Y(vb)) / 2 + (flip ? (up ? -16 : 16) : 0), cc, flip ? 'right' : 'left', 'middle', fs);
      }

      function drawNon(c, L, X, Y, small) {
        const t = st.t, V = Vclosed('non', t), Q = Qclosed('non', t), r = L.plot, cc = sgn(Q, 1e-9), fs = small ? 10 : 11.5;
        // tangente : segment centré sur la sonde, longueur fixe en pixels
        const sx = r.w / TMAX, sy = r.h / (L.ymax - L.ymin), dx = sx, dy = -Q * sy, nn = Math.hypot(dx, dy), half = small ? 40 : 62;
        const x = X(t), y = Y(V);
        c.save(); c.beginPath(); c.rect(r.x, r.y - 6, r.w + 6, r.h + 8); c.clip();
        c.strokeStyle = cc; c.lineWidth = 2.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(x - dx / nn * half, y - dy / nn * half); c.lineTo(x + dx / nn * half, y + dy / nn * half); c.stroke();
        c.restore();
        c.strokeStyle = rgba(C.ener, 0.55); c.lineWidth = 1; c.beginPath(); c.moveTo(x, r.y); c.lineTo(x, r.y + r.h); c.stroke();
        dot(c, x, y, 5.5, C.ener, false);
        const lx = x + 12 + (small ? 0 : 6), flip = lx + 150 > r.x + r.w;
        FX.tag(c, `pente = ${fmtS(Q, 1)} L/min`, flip ? x - 14 : lx, y - (Q < -8 ? -22 : 22) * (flip ? 1 : 1) + (Q < -8 ? 0 : 0), cc, flip ? 'right' : 'left', 'middle', fs);
        if (t < 0.15) FX.tag(c, 'glisse la sonde', x + 14, y + 40, C.texte2, 'left', 'middle', fs);
      }

      function drawAire(c, L, small) {
        const r = L.plot, h = st.h, n = h.t.length, t = st.t, fs = small ? 10 : 11.5;
        const hm = Math.round(r.h * (small ? 0.58 : 0.62)), gap = small ? 30 : 38;
        const r1 = { x: r.x, y: r.y, w: r.w, h: hm }, r2 = { x: r.x, y: r.y + hm + gap, w: r.w, h: r.h - hm - gap };
        // débit Q(t)
        const f1 = frame(c, r1, -10.5, 10.5, [-10, -5, 0, 5, 10], 'Q (L/min)', false, small);
        const f2 = frame(c, r2, 0, 104, FX.niceTicks(0, CAP, small ? 2 : 4), 'V (L)', true, small);
        L.f1 = f1; L.r1 = r1; L.f2 = f2; L.r2 = r2;
        const { X, Y } = f1;
        // aire signée sous Q(t)
        for (let i = 1; i < n; i++) {
          const q = h.q[i]; if (Math.abs(q) < 1e-9) continue;
          const x0 = X(h.t[i - 1]), x1 = X(h.t[i]);
          c.fillStyle = rgba(q > 0 ? C.pos : C.neg, 0.42); c.fillRect(x0, Math.min(Y(0), Y(q)), Math.max(1, x1 - x0 + 0.6), Math.abs(Y(q) - Y(0)));
        }
        c.strokeStyle = rgba(C.texte, 0.8); c.lineWidth = 1; c.beginPath(); c.moveTo(r1.x, Y(0) + 0.5); c.lineTo(r1.x + r1.w, Y(0) + 0.5); c.stroke();
        // projection du débit commandé (pointillés), puis l'escalier réel
        c.strokeStyle = rgba(C.accent, 0.4); c.lineWidth = 1.6; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(X(t), Y(P.aire.Q)); c.lineTo(X(TMAX), Y(P.aire.Q)); c.stroke(); c.setLineDash([]);
        c.strokeStyle = C.accent; c.lineWidth = 2.4; c.beginPath();
        for (let i = 1; i < n; i++) {
          const q = h.q[i], xa = X(h.t[i - 1]), xb = X(h.t[i]);
          if (i === 1) c.moveTo(xa, Y(q)); else c.lineTo(xa, Y(q));
          c.lineTo(xb, Y(q));
        }
        c.stroke();
        // volume V(t) en vignette
        const fV = f2;
        c.strokeStyle = rgba(C.texte, 0.28); c.lineWidth = 1.2; c.setLineDash([4, 5]); c.beginPath(); c.moveTo(fV.X(0), fV.Y(V3)); c.lineTo(fV.X(TMAX), fV.Y(V3)); c.stroke(); c.setLineDash([]);
        c.strokeStyle = C.texte; c.lineWidth = 2.2; c.beginPath();
        for (let i = 0; i < n; i++) { const x = fV.X(h.t[i]), y = fV.Y(h.v[i]); i ? c.lineTo(x, y) : c.moveTo(x, y); }
        c.stroke();
        // tête de lecture et liens entre les deux graphes
        c.strokeStyle = rgba(C.ener, 0.55); c.lineWidth = 1; c.beginPath(); c.moveTo(X(t), r1.y); c.lineTo(X(t), r2.y + r2.h); c.stroke();
        const V = h.v[n - 1], A = V - V3;
        if (n > 1) dot(c, X(t), Y(st.qNow), 4.5, C.ener, false);
        dot(c, fV.X(t), fV.Y(V), 4.5, C.ener, false);
        c.strokeStyle = sgn(A, 0.02); c.lineWidth = 2; c.beginPath(); c.moveTo(fV.X(t) + 7, fV.Y(V3)); c.lineTo(fV.X(t) + 7, fV.Y(V)); c.stroke();
        FX.tag(c, `aire = ${fmtS(A, 1)} L`, r1.x + r1.w - 6, r1.y + 14, sgn(A, 0.02), 'right', 'middle', small ? 11 : 12.5);
      }

      /* ====================== ENTRÉES ====================== */
      const pt = e => { const r = cv.el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      const inPlot = (L, p) => { const r = L.plot; return p.x >= r.x - 14 && p.x <= r.x + r.w + 10 && p.y >= r.y - 6 && p.y <= r.y + r.h + 40; };
      const timeAt = (L, x) => clamp((x - L.plot.x) / L.plot.w * TMAX, 0, TMAX);

      function applyPointer(e) {
        const L = layout(cv.w, cv.h), p = pt(e);
        const t = timeAt(L, p.x), m = st.mode;
        if (m === 'prop') { P.prop.t1 = clamp(Math.round(t * 4) / 4, 0.5, 5); }
        else if (m === 'pente') { st.t = clamp(t, 0, TMAX); setPlaying(false); }
        else if (m === 'non') { st.t = clamp(t, 0, 8); setPlaying(false); }
      }
      scene.addEventListener('pointerdown', e => {
        if (e.button > 0 || e.target !== cv.el) return;
        const L = layout(cv.w, cv.h), p = pt(e);
        if (!inPlot(L, p) || st.mode === 'aire') return;
        st.drag = e.pointerId; try { cv.el.setPointerCapture(e.pointerId); } catch (_) { /* sans effet */ }
        applyPointer(e); FX.tip(null);
      }, { signal });
      scene.addEventListener('pointermove', e => {
        if (st.drag === e.pointerId) { applyPointer(e); return; }
        if (e.pointerType !== 'mouse' || e.target !== cv.el) return;
        hover(e);
      }, { signal });
      const end = e => { if (st.drag === e.pointerId) st.drag = false; };
      scene.addEventListener('pointerup', end, { signal });
      scene.addEventListener('pointercancel', end, { signal });
      scene.addEventListener('pointerleave', () => { FX.tip(null); }, { signal });

      /** Infobulles : réservoir, robinet, et lecture sur le graphe */
      function hover(e) {
        const L = layout(cv.w, cv.h), p = pt(e), cur = currentState(), inR = (r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
        let html = null, cursor = 'default';
        if (L.hit && inR(L.hit.nozzle)) html = `<b>Robinet</b>Débit Q = ${fmtS(cur.Q, 1)} L/min<br><span>Plus le filet est épais, plus le débit est grand. Q est positif quand l'eau entre.</span>`;
        else if (L.hit && inR(L.hit.tank)) html = `<b>Réservoir · 100 L</b>V = ${fmt(cur.V, 1)} L<br><span>Le volume est borné entre 0 et 100 L : à ces limites, le débit effectif est nul.</span>`;
        else if (inPlot(L, p)) {
          const t = timeAt(L, p.x), m = st.mode;
          if (m === 'aire') { const h = st.h, i = h.t.findIndex(x => x >= t); if (i > 0 && t <= st.t) html = `<b>t = ${fmt(t, 1)} min</b>Q = ${fmtS(h.q[i], 1)} L/min<br>V = ${fmt(h.v[i], 1)} L`; }
          else if (t <= (m === 'non' ? 8 : TMAX)) html = `<b>t = ${fmt(t, 1)} min</b>V = ${fmt(Vclosed(m, t), 1)} L<br><span>${m === 'non' ? 'Débit ' + fmtS(Qclosed(m, t), 1) + ' L/min' : 'Clique pour ' + (m === 'prop' ? 'placer t₁' : 'placer la tête de lecture')}</span>`;
          cursor = m === 'aire' ? 'default' : 'crosshair';
        }
        cv.el.style.cursor = cursor;
        if (html) FX.tip(html, e.clientX, e.clientY); else FX.tip(null);
      }

      const nudgeQ = d => {
        const k = st.mode === 'prop' ? P.prop : st.mode === 'pente' ? P.pente : st.mode === 'aire' ? P.aire : null; if (!k) return;
        const lo = st.mode === 'prop' ? 1 : -10; k.Q = clamp(Math.round((k.Q + d) * 2) / 2, lo, 10); syncSliders();
      };
      window.addEventListener('keydown', e => {
        if (FX.typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
        const tg = e.target, onBtn = tg.tagName === 'BUTTON', onRng = tg.tagName === 'INPUT', k = e.key;
        if (k === ' ' || k === 'Spacebar') { if (onBtn || onRng) return; togglePlay(); e.preventDefault(); }
        else if (k === 'r' || k === 'R') { reset(); }
        else if ((k === 'ArrowUp' || k === 'ArrowDown') && !onRng) { nudgeQ(k === 'ArrowUp' ? 0.5 : -0.5); e.preventDefault(); }
        else if ((k === 'ArrowLeft' || k === 'ArrowRight') && !onRng) {
          const d = k === 'ArrowRight' ? 0.25 : -0.25;
          if (st.mode === 'prop') P.prop.t1 = clamp(P.prop.t1 + d, 0.5, 5);
          else if (st.mode === 'pente' || st.mode === 'non') { st.t = clamp(st.t + d, 0, endTime()); setPlaying(false); }
          else return;
          e.preventDefault();
        }
      }, { signal });

      /* ====================== BOUCLE ====================== */
      let pTick = 0;
      FX.loop(dt => {
        const c = cv.ctx, W = cv.w, H = cv.h, m = st.mode;
        st.phase += dt;
        // avance du temps du modèle : 1 min du modèle = 1 s réelle
        if (st.playing) {
          const end = endTime(), t0 = st.t, t1 = Math.min(end, t0 + dt);
          if (m === 'aire') {
            const h = st.h, n = h.t.length, V = h.v[n - 1], q = P.aire.Q, dtm = t1 - t0;
            const Vn = clamp(V + q * dtm, 0, CAP), qe = dtm > 1e-9 ? (Vn - V) / dtm : 0;
            if (dtm > 1e-9) { h.t.push(t1); h.q.push(qe); h.v.push(Vn); st.qNow = qe; }
          }
          st.t = t1;
          if (t1 >= end - 1e-9) setPlaying(false);
        }
        if (m === 'aire') { // débit effectif courant, même à l'arrêt : celui qui s'appliquerait maintenant
          const h = st.h, V = h.v[h.t.length - 1], q = P.aire.Q;
          if (!st.playing) st.qNow = (q > 0 && V >= CAP) || (q < 0 && V <= 0) ? 0 : q;
        }
        c.clearRect(0, 0, W, H);
        const L = layout(W, H); st._L = L;
        drawTank(c, L, W, H);
        drawGraph(c, L, W, H);
        updatePanel();
      }, signal);

      setMode('prop');
      if (FX.reduced) setPlaying(false);
    },
    unmount() { /* tout est attaché au signal d'annulation */ },
  });
})();
</script>

    { id: 'scalaire', label: 'Scalaire ou vecteur', title: 'Un nombre, ou une flèche ?' },

  ];
  const TXT = {

    composantes: ['Deux pattes, une flèche', 'Une flèche se décrit par deux nombres : sa part le long de x et sa part le long de y. Les pattes pointillées montrent le chemin depuis l\'origine.'],
    addition: ['Bout à bout', 'On glisse B à la pointe de A : la flèche de l\'origine à la pointe de B est la résultante R = A + B. Les composantes s\'additionnent.'],
