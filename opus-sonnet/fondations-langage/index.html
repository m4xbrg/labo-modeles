  };

  FX.register('vecteurs', {
    num: 'C', titre: 'Vecteurs', titreHtml: 'Une flèche, <em>pas un nombre</em>',
    hints: [
      '<kbd>Tab</kbd> flèche active',
      '<kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> pointe ±0,5 (m ou N)',
      '<kbd>G</kbd> aimant de grille',
    ],
    mount(ctx) {
      const { scene, panel, controls, signal } = ctx;
      const st = {
        mode: 'scalaire', snap: true, active: 0, dirty: true, drag: null, hover: null,
        d: 5, fixed: true, P: [3, 4],                       // mode 1
        A: [4, 3], B: [3, -2], k: 0, joined: false, para: false, kAnim: null,   // modes 2-3
        F: [5, 5], phi: 20, phase: 0, fAnim: null,           // mode 4
      };
      const g = { ox: 0, oy: 0, s: 20, w: 0, h: 0 };

      /* ---------- DOM : panneau ---------- */
      panel.innerHTML = `<div id="vHead"></div><div class="meas" id="vMeas"></div>
        <div id="vBarsWrap" style="position:relative;height:128px;display:none"></div>
        <div id="vEq"></div><p class="note" id="vNote"></p>`;
      const elHead = panel.querySelector('#vHead'), elMeas = panel.querySelector('#vMeas'),
        elBarsWrap = panel.querySelector('#vBarsWrap'), elEq = panel.querySelector('#vEq'), elNote = panel.querySelector('#vNote');
      let lastMeas = '', lastEq = '', lastNote = '';

      /* ---------- Canevas ---------- */
      const cv = FX.canvas(scene, signal, (w, h) => { g.w = w; g.h = h; layout(); st.dirty = true; });
      const c = cv.ctx, el = cv.el;
      el.style.touchAction = 'none'; el.tabIndex = 0; el.setAttribute('aria-label', 'Plan des vecteurs : saisir la pointe d\'une flèche, flèches du clavier pour la déplacer');
      el.style.outline = 'none';
      let bars = null;
      bars = FX.canvas(elBarsWrap, signal, () => { st.dirty = true; });

      /* Mise en page : le plan carré [-10,5 ; +10,5] se range en bas à droite, hors de la zone de l'en-tête */
      function layout() {
        const w = g.w, h = g.h, hr = FX.headRect(), m = 8, R = 10.5;
        const right = w - m, bottom = h - m;
        let s = Math.min(right - m, bottom - m) / (2 * R);
        const top = bottom - 2 * R * s, left = right - 2 * R * s;
        if (top < hr.bottom + 4 && left < hr.right + 8) {
          const sx = (right - hr.right - 8) / (2 * R), sy = (bottom - hr.bottom - 4) / (2 * R);
          s = Math.max(sx, sy);
        }
        s = Math.max(s, 8);
        g.s = s; g.ox = right - R * s; g.oy = bottom - R * s;
      }
      document.fonts && document.fonts.ready.then(() => { layout(); st.dirty = true; });
      const tl = setTimeout(() => { layout(); st.dirty = true; }, 400);
      signal.addEventListener('abort', () => clearTimeout(tl));

      const X = x => g.ox + x * g.s, Y = y => g.oy - y * g.s;
      const wx = px => (px - g.ox) / g.s, wy = py => (g.oy - py) / g.s;
      const unit = () => st.mode === 'projection' ? 'N' : 'm';
      const snapV = v => st.snap ? Math.round(v * 2) / 2 : v;
      const lim = v => clamp(v, -MAXV, MAXV);
      const railU = () => [Math.cos(st.phi * RAD), Math.sin(st.phi * RAD)];

      /* ---------- Poignées (pointe des flèches) ---------- */
      function setP(x, y) {
        if (st.fixed) {
          const L = Math.hypot(x, y); if (L < 1e-6) return;
          let a = Math.atan2(y, x);
          if (st.snap) a = Math.round(a / (5 * RAD)) * 5 * RAD;
          st.P = [st.d * Math.cos(a), st.d * Math.sin(a)];
        } else st.P = [lim(snapV(x)), lim(snapV(y))];
      }
      function setRail(x, y, kb) {
        if (Math.hypot(x, y) < 0.5) return;
        let a = Math.atan2(y, x) / RAD;
        if (st.snap) {
          const r = Math.round(a / 5) * 5;
          a = (kb && r === Math.round(st.phi / 5) * 5 && Math.abs(a - st.phi) > 0.1) ? st.phi + 5 * Math.sign(wrap180(a - st.phi)) : r;
        }
        st.phi = wrap180(a); syncAngle();
      }
      function handles() {
        switch (st.mode) {
          case 'scalaire': return [{ id: 'P', color: C.accent, get: () => st.P, set: setP }];
          case 'composantes': return [{ id: 'A', color: C.accent, get: () => st.A, set: (x, y) => { st.A = [lim(snapV(x)), lim(snapV(y))]; } }];
          case 'addition': return [
            { id: 'A', color: C.accent, get: () => st.A, set: (x, y) => { st.A = [lim(snapV(x)), lim(snapV(y))]; } },
            { id: 'B', color: C.lilas, get: () => [st.k * st.A[0] + st.B[0], st.k * st.A[1] + st.B[1]],
              set: (x, y) => { st.B = [lim(snapV(x - st.k * st.A[0])), lim(snapV(y - st.k * st.A[1]))]; } }];
          default: { const u = railU(); return [
            { id: 'F', color: C.accent, get: () => st.F, set: (x, y) => { st.fAnim = null; st.F = [lim(snapV(x)), lim(snapV(y))]; } },
            { id: 'rail', color: C.texte, get: () => [8.5 * u[0], 8.5 * u[1]], set: setRail }]; }
        }
      }
      const hpos = h => { const p = h.get(); return [X(p[0]), Y(p[1])]; };

      /* ---------- Aide à la lecture (survol) ---------- */
      function hoverAt(px, py, touch) {
        const hs = handles(), rad = touch ? 28 : 20;
        let best = -1, bd = rad;
        hs.forEach((h, i) => { const [hx, hy] = hpos(h), d = Math.hypot(px - hx, py - hy); if (d < bd) { bd = d; best = i; } });
        if (best >= 0) return { handle: best, html: handleTip(hs[best].id) };
        const o = [X(0), Y(0)];
        const nearSeg = (x1, y1, x2, y2, r = 8) => distSeg(px, py, X(x1), Y(y1), X(x2), Y(y2)) < r;
        if (Math.hypot(px - o[0], py - o[1]) < 9) return { html: `<b>Origine O</b><span>Point de départ (0 ; 0)</span>` };
        if (st.mode === 'scalaire') {
          const d = Math.hypot(px - o[0], py - o[1]);
          if (nearSeg(0, 0, st.P[0], st.P[1])) return { html: `<b>Déplacement</b><span>Une grandeur (${f1(Math.hypot(...st.P))} m) et une direction</span>` };
          if (Math.abs(d - st.d * g.s) < 8) return { html: `<b>Cercle de rayon ${f1(st.d)} m</b><span>Toutes les arrivées possibles pour « ${f1(st.d)} m »</span>` };
        } else if (st.mode === 'composantes') {
          const [ax, ay] = st.A;
          if (nearSeg(0, 0, ax, 0)) return { html: `<b>Composante Ax</b><span>La part de A le long de x : ${s1(ax)} m</span>` };
          if (nearSeg(ax, 0, ax, ay)) return { html: `<b>Composante Ay</b><span>La part de A le long de y : ${s1(ay)} m</span>` };
          if (nearSeg(0, 0, ax, ay)) return { html: `<b>Vecteur A</b><span>Norme ${f1(Math.hypot(ax, ay))} m, direction ${FX.fmt(Math.atan2(ay, ax) / RAD, 1)}°</span>` };
          const d = Math.hypot(px - o[0], py - o[1]), r = Math.min(34, Math.hypot(ax, ay) * g.s * 0.45);
          if (Math.abs(d - r) < 7) return { html: `<b>Angle θ</b><span>Direction de A, mesurée depuis +x</span>` };
        } else if (st.mode === 'addition') {
          const [ax, ay] = st.A, tb = [st.k * ax, st.k * ay], rx = ax + st.B[0], ry = ay + st.B[1];
          if (st.k > 0.3 || st.para) if (nearSeg(0, 0, rx, ry)) return { html: `<b>Résultante R</b><span>R = A + B, norme ${f1(Math.hypot(rx, ry))} m</span>` };
          if (nearSeg(tb[0], tb[1], tb[0] + st.B[0], tb[1] + st.B[1])) return { html: `<b>Vecteur B</b><span>Même flèche où qu'on la pose : seule compte sa grandeur et sa direction</span>` };
          if (nearSeg(0, 0, ax, ay)) return { html: `<b>Vecteur A</b><span>Norme ${f1(Math.hypot(ax, ay))} m</span>` };
        } else {
          const u = railU(), F = st.F, par = F[0] * u[0] + F[1] * u[1];
          if (nearSeg(0, 0, par * u[0], par * u[1], 9)) return { html: `<b>F∥, projection sur le rail</b><span>La part de F qui fait avancer le wagon : ${s1(par)} N</span>` };
          if (nearSeg(0, 0, F[0] - par * u[0], F[1] - par * u[1])) return { html: `<b>F⊥, part perpendiculaire</b><span>Appuie sur le rail : n'avance pas le wagon</span>` };
          if (nearSeg(0, 0, F[0], F[1])) return { html: `<b>Force F</b><span>Norme ${f1(Math.hypot(...F))} N, appliquée au wagon</span>` };
          if (Math.abs(px - o[0]) < 20 && Math.abs(py - o[1]) < 20) return { html: `<b>Wagon</b><span>Il glisse le long du rail selon F∥ seulement</span>` };
          if (distSeg(px, py, X(-14 * u[0]), Y(-14 * u[1]), X(14 * u[0]), Y(14 * u[1])) < 8) return { html: `<b>Rail</b><span>Le wagon ne peut aller que dans cette direction</span>` };
        }
        return null;
      }
      function handleTip(id) {
        const L = (x, y) => f1(Math.hypot(x, y));
        switch (id) {
          case 'P': return `<b>Pointe de la flèche</b><span>L'arrivée choisie : ${L(...st.P)} m, direction ${FX.fmt(Math.atan2(st.P[1], st.P[0]) / RAD, 0)}°</span>`;
          case 'A': return `<b>Pointe de A</b><span>Vecteur ${vec(...st.A)} m, norme ${L(...st.A)} m</span>`;
          case 'B': return `<b>Pointe de B</b><span>Vecteur ${vec(...st.B)} m, norme ${L(...st.B)} m</span>`;
          case 'F': return `<b>Pointe de F</b><span>Force ${vec(...st.F)} N, norme ${L(...st.F)} N</span>`;
          default: return `<b>Extrémité du rail</b><span>Saisir pour tourner le rail (sens positif)</span>`;
        }
      }

      /* ---------- Pointeur ---------- */
      const local = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
      el.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        const [px, py] = local(e); el.focus({ preventScroll: true });
        const hv = hoverAt(px, py, e.pointerType === 'touch');
        if (hv && hv.handle !== undefined) {
          st.drag = hv.handle; st.active = hv.handle; el.setPointerCapture(e.pointerId);
          el.style.cursor = 'grabbing'; FX.tip(null); syncActive(); st.dirty = true;
          drag(px, py);
        }
      }, { signal });
      el.addEventListener('pointermove', e => {
        const [px, py] = local(e);
        if (st.drag !== null) { drag(px, py); return; }
        const hv = hoverAt(px, py, e.pointerType === 'touch');
        st.hover = hv && hv.handle !== undefined ? hv.handle : null;
        el.style.cursor = st.hover !== null ? 'grab' : 'default';
        if (hv && e.pointerType !== 'touch') FX.tip(hv.html, e.clientX, e.clientY); else FX.tip(null);
        st.dirty = true;
      }, { signal });
      const end = () => { if (st.drag !== null) { st.drag = null; el.style.cursor = 'default'; st.dirty = true; } };
      el.addEventListener('pointerup', end, { signal });
      el.addEventListener('pointercancel', end, { signal });
      el.addEventListener('pointerleave', () => { if (st.drag === null) { FX.tip(null); st.hover = null; st.dirty = true; } }, { signal });
      function drag(px, py) {
        const h = handles()[st.drag]; if (!h) return;
        h.set(wx(px), wy(py)); st.dirty = true;
      }

      /* ---------- Clavier ---------- */
      addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey || FX.typing(e)) return;
        const hs = handles(), onCv = e.target === el;
        if (e.key === 'Tab' && onCv && hs.length > 1) {
          const n = st.active + (e.shiftKey ? -1 : 1);
          if (n >= 0 && n < hs.length) { e.preventDefault(); st.active = n; syncActive(); st.dirty = true; }
          return;
        }
        if (e.key === 'g' || e.key === 'G') { toggleSnap(); e.preventDefault(); return; }
        const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
        if (d && e.target.tagName !== 'INPUT') {
          const h = hs[Math.min(st.active, hs.length - 1)], p = h.get();
          if (h.id === 'rail') setRail(p[0] + d[0] * 0.5, p[1] + d[1] * 0.5, true); else h.set(p[0] + d[0] * 0.5, p[1] + d[1] * 0.5);
          e.preventDefault(); st.dirty = true;
        }
      }, { signal });

      /* ---------- Contrôles ---------- */
      const mg = FX.modes(controls, MODES, st.mode, setMode, signal);
      const opts = document.createElement('div'); opts.className = 'grp'; opts.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center';
      controls.appendChild(opts);
      let elAngle = null, elAngleV = null;
      function toggleBtn(label, on) { return `<button class="btn" aria-pressed="${on}" type="button"><span class="dot"></span>${label}</button>`; }
      function renderOpts() {
        const m = st.mode;
        let h = `<div class="grp"><button class="btn" id="oSnap" aria-pressed="${st.snap}" type="button" title="Aimant de grille, pas de 0,5 (touche G)"><span class="dot"></span>Aimant de grille</button></div>`;
        if (m === 'scalaire') h += `<div class="grp"><span class="gl">Distance</span><input type="range" id="oDist" min="1" max="9" step="0.5" value="${st.d}" aria-label="Distance"><span class="rv acc" id="oDistV">${f1(st.d)} m</span>
          <button class="btn" id="oFix" aria-pressed="${st.fixed}" type="button" title="La flèche garde la distance du curseur : on ne change que la direction"><span class="dot"></span>Longueur fixée</button></div>`;
        if (m === 'addition' || m === 'projection') h += `<div class="grp"><span class="gl">Flèche active</span>` +
          (m === 'addition' ? ['A', 'B'] : ['F', 'Rail']).map((n, i) => `<button class="btn" data-act="${i}" aria-pressed="${st.active === i}" type="button">${n}</button>`).join('') + `</div>`;
        if (m === 'addition') h += `<div class="grp"><button class="btn" id="oJoin" type="button">${st.joined ? 'Remettre à l\'origine' : 'Mettre bout à bout'}</button>` +
          toggleBtn('Parallélogramme', st.para).replace('<button class="btn"', '<button class="btn" id="oPara"') + `</div>`;
        if (m === 'projection') h += `<div class="grp"><span class="gl">Angle du rail</span><input type="range" id="oAng" min="-180" max="180" step="5" value="${Math.round(st.phi / 5) * 5}" aria-label="Angle du rail"><span class="rv" id="oAngV"></span>
          <button class="btn" id="oPerp" type="button">α = 90°</button></div>`;
        opts.innerHTML = h;
        elAngle = opts.querySelector('#oAng'); elAngleV = opts.querySelector('#oAngV'); syncAngle();
      }
      function syncAngle() { if (elAngle) { elAngle.value = Math.round(st.phi / 5) * 5; elAngleV.textContent = FX.fmt(st.phi, 0) + '°'; } st.dirty = true; }
      function syncActive() { opts.querySelectorAll('[data-act]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.act === st.active))); }
      function toggleSnap() { st.snap = !st.snap; const b = opts.querySelector('#oSnap'); if (b) b.setAttribute('aria-pressed', String(st.snap)); }
      opts.addEventListener('click', e => {
        const b = e.target.closest('.btn'); if (!b) return;
        if (b.id === 'oSnap') toggleSnap();
        else if (b.id === 'oFix') { st.fixed = !st.fixed; b.setAttribute('aria-pressed', String(st.fixed)); if (st.fixed) rescaleP(); }
        else if (b.id === 'oPara') { st.para = !st.para; b.setAttribute('aria-pressed', String(st.para)); }
        else if (b.id === 'oJoin') { st.joined = !st.joined; b.textContent = st.joined ? 'Remettre à l\'origine' : 'Mettre bout à bout'; animK(st.joined ? 1 : 0); }
        else if (b.id === 'oPerp') perp();
        else if (b.dataset.act !== undefined) { st.active = +b.dataset.act; syncActive(); }
        st.dirty = true;
      }, { signal });
      opts.addEventListener('input', e => {
        if (e.target.id === 'oDist') { st.d = +e.target.value; opts.querySelector('#oDistV').textContent = f1(st.d) + ' m'; if (st.fixed) rescaleP(); }
        else if (e.target.id === 'oAng') { st.phi = +e.target.value; elAngleV.textContent = FX.fmt(st.phi, 0) + '°'; }
        st.dirty = true;
      }, { signal });
      function rescaleP() { const L = Math.hypot(...st.P) || 1; st.P = L < 1e-6 ? [st.d, 0] : [st.P[0] / L * st.d, st.P[1] / L * st.d]; }

      function setMode(id) {
        st.mode = id; st.active = 0; FX.tip(null); st.drag = null;
        if (id === 'scalaire' && st.fixed) rescaleP();
        const t = TXT[id], i = MODES.findIndex(m => m.id === id);
        elHead.innerHTML = `<p class="eyebrow"><b>Mode ${i + 1}</b> sur 4 · ${MODES[i].label}</p><h2>${t[0]}</h2><p class="txt">${t[1]}</p>`;
        elBarsWrap.style.display = id === 'addition' ? 'block' : 'none';
        lastMeas = lastEq = lastNote = '';
        renderOpts(); st.dirty = true;
      }

      /* ---------- Animations ---------- */
      function animK(to) {
        if (FX.reduced) { st.k = to; return; }
        st.kAnim = { from: st.k, to, t0: performance.now(), dur: 800 };
      }
      function perp() {
        const th = Math.atan2(st.F[1], st.F[0]) / RAD, d = wrap180(th - st.phi);
        const target = st.phi + (d >= 0 ? 90 : -90), L = Math.hypot(...st.F) || 5;
        const r = Math.min(L < 1 ? 5 : L, MAXV); // reste dans le cadre : sinon l'écrêtage fausse la perpendiculaire
        const fin = [lim(r * Math.cos(target * RAD)), lim(r * Math.sin(target * RAD))];
        const a0 = Math.atan2(st.F[1], st.F[0]), da = wrap180(target - a0 / RAD) * RAD;
        if (FX.reduced) { st.F = fin; return; }
        st.fAnim = { a0, da, r, fin, t0: performance.now(), dur: 600 };
      }

      /* ---------- Dessin ---------- */
      function lineW(x1, y1, x2, y2, col, w, dash) {
        c.save(); c.strokeStyle = col; c.lineWidth = w; if (dash) c.setLineDash(dash); c.lineCap = 'round';
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); c.restore();
      }
      function handleDot(x, y, color, active, hot) {
        c.save();
        c.beginPath(); c.arc(x, y, active || hot ? 15 : 13, 0, 7);
        c.fillStyle = FX.rgba(color, hot ? 0.24 : 0.14); c.fill();
        c.strokeStyle = FX.rgba(color, active ? 0.95 : 0.5); c.lineWidth = active ? 1.6 : 1; c.stroke();
        c.beginPath(); c.arc(x, y, 6, 0, 7); c.fillStyle = color; c.fill();
        c.strokeStyle = C.fond; c.lineWidth = 2; c.stroke();
        c.restore();
      }
      function vecArrow(x1, y1, x2, y2, color, w = 2.6) { FX.arrow(c, X(x1), Y(y1), X(x2), Y(y2), color, w, 10); }
      /** Patte pointillée avec petite pointe */
      function leg(x1, y1, x2, y2, col) {
        const p1 = [X(x1), Y(y1)], p2 = [X(x2), Y(y2)], L = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        if (L < 1) return;
        lineW(p1[0], p1[1], p2[0], p2[1], col, 2, [5, 4]);
        const u = [(p2[0] - p1[0]) / L, (p2[1] - p1[1]) / L], l = Math.min(12, L);
        FX.arrow(c, p2[0] - u[0] * l, p2[1] - u[1] * l, p2[0], p2[1], col, 2, 7);
      }

      function drawPlane() {
        const { ox, oy, s } = g, R = 10.5, x0 = X(-R), x1 = X(R), y0 = Y(R), y1 = Y(-R);
        c.fillStyle = C.fond2; c.fillRect(x0, y0, x1 - x0, y1 - y0);
        c.lineWidth = 1;
        for (let i = -10; i <= 10; i++) {
          c.strokeStyle = i % 5 === 0 ? FX.rgba(C.texte2, 0.22) : FX.rgba(C.trait, 0.9);
          c.beginPath(); c.moveTo(X(i) + 0.5, y0); c.lineTo(X(i) + 0.5, y1); c.moveTo(x0, Y(i) + 0.5); c.lineTo(x1, Y(i) + 0.5); c.stroke();
        }
        c.strokeStyle = FX.rgba(C.texte2, 0.35); c.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0 - 1, y1 - y0 - 1);
        // axes
        lineW(x0, oy, x1 - 6, oy, C.texte2, 1.4); lineW(ox, y1, ox, y0 + 6, C.texte2, 1.4);
        FX.arrow(c, x1 - 12, oy, x1 - 1, oy, C.texte2, 1.4, 7); FX.arrow(c, ox, y0 + 12, ox, y0 + 1, C.texte2, 1.4, 7);
        // graduations
        const step = s >= 26 ? 2 : 5, u = unit();
        c.save(); c.font = FX.mono(10); c.fillStyle = C.texte2;
        for (let v = step; v <= 10; v += step) for (const sg of [1, -1]) {
          const t = sg * v, lab = FX.fmt(t, 0);
          c.strokeStyle = C.texte2; c.beginPath(); c.moveTo(X(t), oy - 3); c.lineTo(X(t), oy + 3); c.moveTo(ox - 3, Y(t)); c.lineTo(ox + 3, Y(t)); c.stroke();
          c.textAlign = 'center'; c.textBaseline = 'top'; c.fillText(lab, X(t), oy + 6);
          c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(lab, ox - 7, Y(t));
        }
        c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillStyle = C.texte; c.font = FX.mono(11);
        c.fillText(`x (${u})`, x1 - 16, oy - 5);
        c.textAlign = 'left'; c.textBaseline = 'top'; c.fillText(`y (${u})`, ox + 8, y0 + 5);
        c.restore();
        c.beginPath(); c.arc(ox, oy, 3.2, 0, 7); c.fillStyle = C.texte; c.fill();
        c.font = FX.mono(10); c.fillStyle = C.texte2; c.textAlign = 'right'; c.textBaseline = 'top'; c.fillText('O', ox - 6, oy + 6);
      }

      function drawScalaire() {
        const { ox, oy, s } = g, r = st.d * s, P = st.P;
        c.save(); c.beginPath(); c.arc(ox, oy, r, 0, 7); c.fillStyle = FX.rgba(C.accent, 0.05); c.fill();
        c.setLineDash([4, 5]); c.strokeStyle = FX.rgba(C.accent, 0.7); c.lineWidth = 1.5; c.stroke(); c.restore();
        // quelques autres arrivées possibles (fantômes)
        for (let i = 0; i < 16; i++) {
          const a = i * Math.PI / 8 + 0.2, x = ox + r * Math.cos(a), y = oy - r * Math.sin(a);
          lineW(ox, oy, x, y, FX.rgba(C.texte2, 0.22), 1);
          c.beginPath(); c.arc(x, y, 2.4, 0, 7); c.fillStyle = FX.rgba(C.accent, 0.55); c.fill();
        }
        { // étiquette du cercle, rabattue vers la gauche si elle sortirait du cadre
          const lbl = `tous les points à ${f1(st.d)} m`; c.font = FX.mono(11);
          const lx = Math.min(ox + r * 0.7071 + 6, c.canvas.clientWidth - c.measureText(lbl).width - 8);
          FX.tag(c, lbl, lx, oy + r * 0.7071 + 6, C.accent, 'left', 'top', 11);
        }
        vecArrow(0, 0, P[0], P[1], C.accent, 3);
        const L = Math.hypot(P[0], P[1]);
        if (L > 0.3) {
          const nx = -(Y(P[1]) - Y(0)) / (L * s), ny = (X(P[0]) - X(0)) / (L * s);
          FX.tag(c, `${f1(L)} m`, (X(0) + X(P[0])) / 2 + nx * 14, (Y(0) + Y(P[1])) / 2 + ny * 14, C.accent, 'center', 'middle', 11);
        }
        FX.tag(c, 'départ', ox + 8, oy + 18, C.texte2, 'left', 'middle', 10);
      }

      function drawComposantes() {
        const [ax, ay] = st.A, L = Math.hypot(ax, ay), cx = FX.signColor(ax), cy = FX.signColor(ay);
        leg(0, 0, ax, 0, cx); leg(ax, 0, ax, ay, cy);
        vecArrow(0, 0, ax, ay, C.accent, 3);
        // étiquettes des composantes
        FX.tag(c, `Ax = ${s1(ax)} m`, X(ax / 2), Y(0) + (ay >= 0 ? 17 : -17), cx, 'center', 'middle', 11);
        FX.tag(c, `Ay = ${s1(ay)} m`, X(ax) + (ax >= 0 ? 10 : -10), Y(ay / 2), cy, ax >= 0 ? 'left' : 'right', 'middle', 11);
        if (L > 0.2) {
          const th = Math.atan2(ay, ax), r = Math.min(34, L * g.s * 0.45);
          c.save(); c.strokeStyle = C.texte; c.lineWidth = 1.5; c.beginPath(); c.arc(g.ox, g.oy, r, 0, -th, th > 0); c.stroke(); c.restore();
          FX.tag(c, `θ = ${FX.fmtS(th / RAD, 1)}°`, g.ox + (r + 10) * Math.cos(th / 2), g.oy - (r + 10) * Math.sin(th / 2), C.texte, Math.abs(th) > 2.2 ? 'right' : 'left', 'middle', 11);
          // étiquette de la norme, décalée sur le côté de la flèche (normale en pixels)
          FX.tag(c, `|A| = ${f1(L)} m`, X(ax / 2) - ay / L * 20, Y(ay / 2) - ax / L * 20, C.accent, 'center', 'middle', 11);
        }
        tipName('A', ax, ay, C.accent);
      }

      function tipName(n, x, y, col) {
        const L = Math.hypot(x, y) || 1, d = 24;
        FX.tag(c, n, X(x) + x / L * d, Y(y) - y / L * d, col, 'center', 'middle', 12);
      }

      function drawAddition() {
        const [ax, ay] = st.A, [bx, by] = st.B, k = st.k, tb = [k * ax, k * ay], rx = ax + bx, ry = ay + by;
        if (st.para) {
          const f = FX.rgba;
          leg2(bx, by, rx, ry, f(C.accent, 0.6)); if (k < 0.99) leg2(ax, ay, rx, ry, f(C.lilas, 0.6));
        }
        const ra = Math.max(k, st.para ? 0.5 : 0);
        if (ra > 0.02) { c.save(); c.globalAlpha = ra; vecArrow(0, 0, rx, ry, C.ener, 3.2); c.restore(); }
        // lignes de rappel de la translation de B
        if (k > 0.001 && k < 0.999) lineW(X(0), Y(0), X(tb[0]), Y(tb[1]), FX.rgba(C.lilas, 0.4), 1, [2, 4]);
        vecArrow(0, 0, ax, ay, C.accent, 3);
        vecArrow(tb[0], tb[1], tb[0] + bx, tb[1] + by, C.lilas, 3);
        tipName('A', ax, ay, C.accent);
        { const Lb = Math.hypot(bx, by) || 1; FX.tag(c, 'B', X(tb[0] + bx / 2) - by / Lb * 16, Y(tb[1] + by / 2) - bx / Lb * 16, C.lilas, 'center', 'middle', 12); }
        if (ra > 0.5) { c.save(); c.globalAlpha = Math.min(1, ra * 1.2); tipName('R', rx, ry, C.ener); c.restore(); }
      }
      function leg2(x1, y1, x2, y2, col) { lineW(X(x1), Y(y1), X(x2), Y(y2), col, 1.6, [4, 4]); }

      function drawProjection() {
        const u = railU(), F = st.F, par = F[0] * u[0] + F[1] * u[1], pc = FX.signColor(par, 1e-6);
        const perp = [F[0] - par * u[0], F[1] - par * u[1]];
        c.save(); c.beginPath(); const R = 10.5; c.rect(X(-R), Y(R), 2 * R * g.s, 2 * R * g.s); c.clip();
        // rail + traverses qui défilent
        const sp = 1.5, off = ((st.phase % sp) + sp) % sp, nx = -u[1], ny = u[0];
        for (let p = -16; p <= 16; p += sp) {
          const q = p - off, hx = X(q * u[0]), hy = Y(q * u[1]);
          lineW(hx - nx * 6, hy + ny * 6, hx + nx * 6, hy - ny * 6, FX.rgba(C.texte2, 0.5), 2);
        }
        lineW(X(-16 * u[0]), Y(-16 * u[1]), X(16 * u[0]), Y(16 * u[1]), C.texte2, 2.2);
        c.restore();
        // wagon
        c.save(); c.translate(g.ox, g.oy); c.rotate(-st.phi * RAD);
        c.fillStyle = C.fond; c.strokeStyle = C.texte; c.lineWidth = 1.5;
        c.beginPath(); c.rect(-17, -11, 34, 14); c.fill(); c.stroke();
        c.fillStyle = C.texte2; c.beginPath(); c.arc(-9, 4.5, 3, 0, 7); c.arc(9, 4.5, 3, 0, 7); c.fill();
        c.restore();
        // ombre de F sur le rail
        lineW(X(F[0]), Y(F[1]), X(par * u[0]), Y(par * u[1]), FX.rgba(C.texte, 0.7), 1.4, [4, 4]);
        // F⊥ (gris discret)
        FX.arrow(c, g.ox, g.oy, X(perp[0]), Y(perp[1]), FX.rgba(C.texte2, 0.75), 2, 8);
        // F∥ sur le rail
        if (Math.abs(par) > 0.05) FX.arrow(c, g.ox, g.oy, X(par * u[0]), Y(par * u[1]), pc, 4.5, 11);
        vecArrow(0, 0, F[0], F[1], C.accent, 3);
        // angle α
        const th = Math.atan2(F[1], F[0]) / RAD, d = wrap180(th - st.phi), Lf = Math.hypot(...F);
        if (Lf > 0.3) {
          const r = 30;
          c.save(); c.strokeStyle = C.texte; c.lineWidth = 1.4; c.beginPath(); c.arc(g.ox, g.oy, r, -st.phi * RAD, -(st.phi + d) * RAD, d > 0); c.stroke(); c.restore();
          const m = (st.phi + d / 2) * RAD;
          FX.tag(c, `α = ${FX.fmt(Math.abs(d), 0)}°`, g.ox + (r + 10) * Math.cos(m), g.oy - (r + 10) * Math.sin(m), C.texte, Math.cos(m) < 0 ? 'right' : 'left', 'middle', 11);
        }
        if (Math.abs(par) > 0.4) {
          // étiquette du côté opposé à F⊥
          const Lp = Math.hypot(...perp), pn = Lp > 1e-6 ? [perp[0] / Lp, -perp[1] / Lp] : [u[1], u[0]];
          FX.tag(c, `F∥ = ${s1(par)} N`, X(par * u[0] * 0.8) - pn[0] * 24, Y(par * u[1] * 0.8) - pn[1] * 24, pc, 'center', 'middle', 11);
        }
        // extrémité du rail : sens positif
        tipName('F', F[0], F[1], C.accent);
        const e = [8.5 * u[0], 8.5 * u[1]];
        FX.tag(c, 'rail (+)', X(e[0]) + u[1] * 24, Y(e[1]) + u[0] * 24, C.texte2, 'center', 'middle', 10);
        const Lp = Math.hypot(...perp);
        if (Lp > 0.4) FX.tag(c, `F⊥ = ${f1(Lp)} N`, X(perp[0]) + perp[0] / Lp * 30, Y(perp[1]) - perp[1] / Lp * 14, C.texte2, perp[0] >= 0 ? 'left' : 'right', 'middle', 10);
      }

      function drawBars() {
        const b = bars; if (st.mode !== 'addition' || b.w < 40) return;
        const q = b.ctx; q.clearRect(0, 0, b.w, b.h);
        const Lm = 18, Rm = 10, W = b.w - Lm - Rm, z = Lm + W / 2;
        // échelle commune aux deux lignes, ajustée à la plus grande extension
        const ext = Math.max(5, Math.abs(st.A[0]), Math.abs(st.A[0] + st.B[0]), Math.abs(st.A[1]), Math.abs(st.A[1] + st.B[1])), sc = W / (2 * ext * 1.12);
        const rows = [['x', st.A[0], st.B[0]], ['y', st.A[1], st.B[1]]], rh = b.h / 2;
        rows.forEach(([n, a, bb], i) => {
          // trois voies : A, puis B qui part du bout de A (jamais superposées, même de signes opposés), puis R sous un trait
          const y0 = i * rh + 2, ly = y0 + 2, lh = 13, by = y0 + 17, ry = y0 + 38;
          q.font = FX.mono(11); q.fillStyle = C.texte2; q.textAlign = 'left'; q.textBaseline = 'middle'; q.fillText(n, 0, y0 + 24);
          q.strokeStyle = FX.rgba(C.texte2, 0.5); q.lineWidth = 1; q.beginPath(); q.moveTo(Lm, y0 + 34.5); q.lineTo(b.w - Rm, y0 + 34.5); q.stroke();
          q.beginPath(); q.moveTo(z + 0.5, y0); q.lineTo(z + 0.5, y0 + 54); q.stroke();
          const seg = (from, val, yy, hh, col, name) => {
            const x1 = z + from * sc, x2 = z + (from + val) * sc, lo = Math.min(x1, x2), w = Math.abs(x2 - x1);
            if (w < 0.5) return;
            q.fillStyle = FX.rgba(FX.signColor(val), 0.5); q.fillRect(lo, yy, w, hh);
            q.strokeStyle = col; q.lineWidth = 1.5; q.strokeRect(lo + 0.5, yy + 0.5, w - 1, hh - 1);
            if (w > 14) { q.fillStyle = C.texte; q.font = FX.mono(10); q.textAlign = 'center'; q.fillText(name, lo + w / 2, yy + hh / 2 + 0.5); }
          };
          seg(0, a, ly, lh, C.accent, 'A' + n); seg(a, bb, by, lh, C.lilas, 'B' + n);
          // raccord pointillé : B commence là où A finit
          if (Math.abs(a) * sc > 0.5 && Math.abs(bb) * sc > 0.5) { const xj = z + a * sc + 0.5; q.save(); q.setLineDash([2, 2]); q.strokeStyle = FX.rgba(C.texte2, 0.8); q.beginPath(); q.moveTo(xj, ly + lh); q.lineTo(xj, by); q.stroke(); q.restore(); } seg(0, a + bb, ry, lh, C.ener, 'R' + n);
        });
      }

      function draw() {
        c.clearRect(0, 0, cv.w, cv.h);
        drawPlane();
        c.save(); c.beginPath(); c.rect(X(-10.5), Y(10.5), 21 * g.s, 21 * g.s); c.clip();
        if (st.mode === 'scalaire') drawScalaire(); else if (st.mode === 'composantes') drawComposantes();
        else if (st.mode === 'addition') drawAddition(); else drawProjection();
        c.restore();
        handles().forEach((h, i) => { const [hx, hy] = hpos(h); handleDot(hx, hy, h.color, i === st.active && handles().length > 1 || st.drag === i, st.hover === i); });
        drawBars();
      }

      /* ---------- Panneau : mesures en direct ---------- */
      const row = (lab, val, unitS, cls = '') => `<div class="row"><span class="lab">${lab}</span><span class="val ${cls}">${val}${unitS ? `<i>${unitS}</i>` : ''}</span></div>`;
      const tn = v => FX.fmt(v, 1).replace(',', '{,}'), tns = v => FX.fmtS(v, 1).replace(',', '{,}');
      const tnp = v => v < 0 ? `\\left(${tn(v)}\\right)` : tn(v), tnq = v => v < 0 ? `\\left(${tn(v)}\\right)` : tn(v);
      const col = (hex, t) => String.raw`\textcolor{${hex}}{${t}}`;
      const sCls = (v, e = 1e-9) => { const k = FX.signColor(v, e); return k === C.pos ? 'pos' : k === C.neg ? 'neg' : 'dim'; };
      function updatePanel() {
        let meas = '', eqKey = '', eqFn = null, note = '';
        const th = (x, y) => FX.fmtS(Math.atan2(y, x) / RAD, 1) + '°';
        if (st.mode === 'scalaire') {
          const P = st.P, L = Math.hypot(...P);
          meas = row('distance (un nombre)', f1(st.d), 'm', 'acc') + row('longueur de la flèche', f1(L), 'm') + row('arrivée (x ; y)', vec(...P), 'm') + row('direction θ', th(...P), '');
          eqKey = 'sv';
          eqFn = () => `<p class="eq"><span class="dim">scalaires :</span> température 20 °C, masse 70 kg, durée 3 s, énergie 50 J<br><span class="dim">vecteurs :</span> déplacement, vitesse, force, champ électrique<br><span class="acc">un vecteur = une grandeur + une direction</span></p>`;
          note = st.fixed ? 'Longueur fixée : on ne change que la direction. Le nombre seul ne dit pas où l\'on arrive.' : 'Longueur libre : la flèche peut sortir du cercle, donc changer de distance.';
        } else if (st.mode === 'composantes') {
          const [ax, ay] = st.A, L = Math.hypot(ax, ay);
          meas = row('Ax (le long de x)', s1(ax), 'm', sCls(ax)) + row('Ay (le long de y)', s1(ay), 'm', sCls(ay))
            + row('norme |A|', f1(L), 'm', 'acc') + row('direction θ (depuis +x)', th(ax, ay), '');
          eqKey = 'co' + ax + ',' + ay;
          eqFn = () => `<p class="eq">${FX.k(String.raw`\lvert\vec A\rvert = \sqrt{A_x^2 + A_y^2} = \sqrt{${tnp(ax)}^2 + ${tnp(ay)}^2}`,
            `|A| = √(Ax² + Ay²) = √(${f1(ax)}² + ${f1(ay)}²)`)}<br>${FX.k(String.raw`= ${col(C.accent, tn(L) + String.raw`\ \mathrm{m}`)}`, `= ${f1(L)} m`)}</p>
            <p class="eq" style="margin-top:8px">(Ax, Ay) = ${vec(ax, ay)} m<br>(|A|, θ) = (${f1(L)} m ; ${th(ax, ay)})<br><span class="dim">deux descriptions de la même flèche</span></p>`;
          note = 'θ se mesure depuis +x, entre −180° et +180° : positif vers le haut, négatif vers le bas.';
        } else if (st.mode === 'addition') {
          const [ax, ay] = st.A, [bx, by] = st.B, rx = ax + bx, ry = ay + by, nA = Math.hypot(ax, ay), nB = Math.hypot(bx, by), nR = Math.hypot(rx, ry);
          meas = row('Rx', s1(rx), 'm', sCls(rx)) + row('Ry', s1(ry), 'm', sCls(ry)) + row('|A| + |B|', f1(nA + nB), 'm') + row('|R|', f1(nR), 'm', 'ener');
          eqKey = 'ad' + [ax, ay, bx, by];
          eqFn = () => `<p class="eq">${FX.k(String.raw`R_x = A_x + B_x = ${tns(ax)} + ${tnq(bx)} = ${tns(rx)}\ \mathrm{m}`, `Rx = Ax + Bx = ${s1(ax)} + (${s1(bx)}) = ${s1(rx)} m`)}<br>
            ${FX.k(String.raw`R_y = A_y + B_y = ${tns(ay)} + ${tnq(by)} = ${tns(ry)}\ \mathrm{m}`, `Ry = Ay + By = ${s1(ay)} + (${s1(by)}) = ${s1(ry)} m`)}</p>`;
          const al = Math.abs(ax * by - ay * bx) < 1e-6 * (1 + nA * nB) && ax * bx + ay * by > 0;
          note = al ? 'Ici A et B sont alignées et de même sens : les normes s\'additionnent, |R| = |A| + |B|.' : 'Les normes ne s\'additionnent pas : |R| < |A| + |B|, sauf si les flèches sont alignées et de même sens.';
        } else {
          const u = railU(), F = st.F, Lf = Math.hypot(...F), par = F[0] * u[0] + F[1] * u[1], pe = Math.abs(F[0] * u[1] - F[1] * u[0]);
          const al = Lf < 1e-6 ? 0 : Math.acos(clamp(par / Lf, -1, 1)) / RAD, cls = sCls(par, 1e-6), hex = FX.signColor(par, 1e-6);
          meas = row('norme |F|', f1(Lf), 'N', 'acc') + row('angle α (F, rail)', FX.fmt(al, 0) + '°', '') + row('F∥', s1(par), 'N', cls) + row('F⊥', f1(pe), 'N', 'dim');
          eqKey = 'pr' + f1(Lf) + FX.fmt(al, 0) + s1(par);
          eqFn = () => `<p class="eq">${FX.k(String.raw`F_\parallel = \lvert\vec F\rvert\cos\alpha = ${tn(Lf)} \times \cos ${FX.fmt(al, 0)}^\circ = ${col(hex, tns(par) + String.raw`\ \mathrm{N}`)}`,
            `F∥ = |F| cos α = ${f1(Lf)} × cos ${FX.fmt(al, 0)}° = ${s1(par)} N`)}</p>`;
          note = Math.abs(par) < 0.05 ? 'F ⊥ rail : F∥ = 0, le wagon reste immobile malgré la force.' : par > 0 ? 'F∥ positive : elle pousse dans le sens du rail (orange).' : 'F∥ négative : elle pousse à contresens du rail (bleu).';
        }
        if (meas !== lastMeas) { elMeas.innerHTML = meas; lastMeas = meas; }
        if (eqKey !== lastEq) { elEq.innerHTML = eqFn(); lastEq = eqKey; }
        if (note !== lastNote) { elNote.textContent = note; lastNote = note; }
      }

      /* ---------- Boucle ---------- */
      FX.loop(dt => {
        const now = performance.now();
        if (st.kAnim) {
          const q = Math.min(1, (now - st.kAnim.t0) / st.kAnim.dur);
          st.k = st.kAnim.from + (st.kAnim.to - st.kAnim.from) * ease(q);
          if (q >= 1) st.kAnim = null; st.dirty = true;
        }
        if (st.fAnim) {
          const a = st.fAnim, q = Math.min(1, (now - a.t0) / a.dur), ang = a.a0 + a.da * ease(q);
          st.F = q >= 1 ? a.fin : [a.r * Math.cos(ang), a.r * Math.sin(ang)];
          if (q >= 1) st.fAnim = null; st.dirty = true;
        }
        if (st.mode === 'projection') {
          const u = railU(), par = st.F[0] * u[0] + st.F[1] * u[1];
          if (Math.abs(par) > 1e-6 && !FX.reduced) { st.phase -= 0.35 * par * dt; st.dirty = true; }
        }
        if (st.dirty) { st.dirty = false; draw(); updatePanel(); }
      }, signal);

      setMode('scalaire');
      layout(); draw(); updatePanel();
      cleanup = () => { FX.tip(null); };
    },
    unmount() { if (cleanup) { cleanup(); cleanup = null; } },
  });
})();
</script>
<script>
/* ============ Toy D · Mouvement — « Trois graphes, un seul mouvement » ============ */
(function () {
  'use strict';
  const C = FX.C;
  const T = 10, NSEG = 5, SEGLEN = 2, AMAX = 3;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const f1 = v => FX.fmt(v, 1), f2 = v => FX.fmt(v, 2), s1 = v => FX.fmtS(v, 1), s2 = v => FX.fmtS(v, 2);
  const cls = (v, e = 1e-6) => { const k = FX.signColor(v, e); return k === C.pos ? 'pos' : k === C.neg ? 'neg' : 'dim'; };
  let cleanup = null;

  const PRESETS = [
    { id: 'immobile', label: 'Immobile', x0: 0, v0: 0, a: [0, 0, 0, 0, 0] },
    { id: 'constante', label: 'Vitesse constante', x0: -10, v0: 2, a: [0, 0, 0, 0, 0] },
    { id: 'depart', label: 'Départ arrêté', x0: -10, v0: 0, a: [0.5, 0.5, 0.5, 0.5, 0.5] },
    { id: 'freinage', label: 'Freinage', x0: -8, v0: 4, a: [-0.5, -0.5, -0.5, -0.5, 0] },
    { id: 'retour', label: 'Aller-retour', x0: 0, v0: 4, a: [-1, -1, -1, -1, -1] },
    { id: 'repart', label: 'Ralentir, s\'arrêter, repartir', x0: -8, v0: 3, a: [-1.5, 0, 0, 1.5, 0] },
  ];

  /* Texte du panneau selon les deux regards (bascules indépendantes) */
  const HEAD = {
    '00': ['Aucun', 'Un mouvement, trois lectures', 'Glisse un palier de a(t) : v(t) et x(t) se recalculent aussitôt. Sur le mobile, la flèche de v (sarcelle) et celle de a (lilas) pointent dans le sens de leur signe : en 1D, le signe est la direction.'],
    '10': ['Pente', 'La pente raconte la vitesse', 'La vitesse est la pente de la position ; l\'accélération est la pente de la vitesse. Réduis Δt : la sécante se confond avec la tangente.'],
    '01': ['Aire', 'L\'aire raconte le déplacement', 'Le déplacement est l\'aire sous la vitesse ; la variation de vitesse est l\'aire sous l\'accélération. Orange au-dessus de zéro, bleu au-dessous.'],
    '11': ['Pente + aire', 'Dériver, puis intégrer', 'La pente passe de x à v à a ; l\'aire fait le chemin inverse, de a à v à x. Les deux lectures se défont l\'une l\'autre.'],
  };

  FX.register('mouvement', {
    num: 'D', titre: 'Mouvement', titreHtml: 'Trois graphes, <em>un seul mouvement</em>',
    hints: ['<kbd>Espace</kbd> lecture / pause', '<kbd>R</kbd> tête de lecture à 0', '<kbd>←</kbd><kbd>→</kbd> tête ±0,1 s'],
    mount(ctx) {
      const { scene, panel, controls, signal } = ctx;
      const S = { x0: 0, v0: 4, acc: [-1, -1, -1, -1, -1], t: 4, playing: false, pente: false, aire: false,
        sDt: Math.log(0.5) / Math.log(0.025), dragA: -1, scrub: false, hoverA: -1, hoverHead: false };
      const segs = []; let zeros = [];
      const tgt = { x: [0, 1], v: [0, 1], trk: [0, 1] }, view = { x: [0, 1], v: [0, 1], trk: [0, 1], a: [-3.6, 3.6] };

        // zéro bien marqué
        const y0 = Yg(gi, 0); line(L, y0 + 0.5, L + g.PW, y0 + 0.5, FX.rgba(C.texte, 0.6), 1.4);
        c.strokeStyle = FX.rgba(C.texte2, 0.35); c.lineWidth = 1; c.strokeRect(L + 0.5, G.y + 0.5, g.PW - 1, G.h - 1);
        const names = [['x', 'm', C.texte], ['v', 'm/s', C.accent], ['a', 'm/s²', C.lilas]][gi];
        FX.tag(c, `${names[0]}(t)  ${names[1]}`, L + 6, G.y + 9, names[2], 'left', 'middle', small ? 9 : 10.5);
      }
      const clipPlot = gi => { const G = g.gr[gi]; c.save(); c.beginPath(); c.rect(g.L, G.y, g.PW, G.h); c.clip(); };

      function curves() {
        // x(t) : arcs de parabole exacts (courbes de Bézier quadratiques)
        clipPlot(0); c.beginPath(); c.lineWidth = 2.4; c.strokeStyle = C.texte; c.lineJoin = 'round';
        segs.forEach((s, i) => {
          if (i === 0) c.moveTo(PX(0), Yg(0, s.x0));
          const xe = s.x0 + s.v0 * SEGLEN + 0.5 * s.a * SEGLEN * SEGLEN;
          c.quadraticCurveTo(PX(s.t0 + SEGLEN / 2), Yg(0, s.x0 + s.v0 * SEGLEN / 2), PX(s.t0 + SEGLEN), Yg(0, xe));
        });
        c.stroke(); c.restore();
        // v(t) : droites
        clipPlot(1); c.beginPath(); c.lineWidth = 2.4; c.strokeStyle = C.accent; c.lineJoin = 'round';
        segs.forEach((s, i) => { if (i === 0) c.moveTo(PX(0), Yg(1, s.v0)); c.lineTo(PX(s.t0 + SEGLEN), Yg(1, s.v0 + s.a * SEGLEN)); });
        c.stroke(); c.restore();
        // a(t) : escalier
        clipPlot(2); c.beginPath(); c.lineWidth = 2.4; c.strokeStyle = C.lilas; c.lineJoin = 'round';
        segs.forEach((s, i) => { if (i === 0) c.moveTo(PX(0), Yg(2, s.a)); else c.lineTo(PX(s.t0), Yg(2, s.a)); c.lineTo(PX(s.t0 + SEGLEN), Yg(2, s.a)); });
        c.stroke(); c.restore();
        // poignées des paliers
        segs.forEach((s, i) => {
          const hx = PX(s.t0 + 1), hy = Yg(2, s.a), hot = S.hoverA === i || S.dragA === i;
          c.beginPath(); c.arc(hx, hy, hot ? 9 : 7.5, 0, 7); c.fillStyle = hot ? FX.rgba(C.lilas, 0.28) : FX.rgba(C.lilas, 0.14); c.fill();
          c.strokeStyle = FX.rgba(C.lilas, hot ? 1 : 0.7); c.lineWidth = 1.5; c.stroke();
          dot(hx, hy, 3.2, C.lilas);
          if (S.dragA === i || S.hoverA === i) FX.tag(c, `a${FX.sup(i + 1)} = ${s1(s.a)}`, hx, hy + (s.a > 0 ? 17 : -17), C.lilas, 'center', 'middle', 10);
        });
      }

      /** Aire signée remplie sous une courbe affine ou en escalier de 0 à t, orange au-dessus de 0, bleu au-dessous */
      function fillArea(gi, pts) {
        const y0 = Yg(gi, 0), G = g.gr[gi];
        const poly = () => { c.beginPath(); c.moveTo(PX(0), y0); pts.forEach(p => c.lineTo(PX(p[0]), Yg(gi, p[1]))); c.lineTo(PX(pts[pts.length - 1][0]), y0); c.closePath(); };
        clipPlot(gi);
        c.save(); c.beginPath(); c.rect(g.L, G.y, g.PW, y0 - G.y); c.clip(); poly(); c.fillStyle = FX.rgba(C.pos, 0.3); c.fill(); c.restore();
        c.save(); c.beginPath(); c.rect(g.L, y0, g.PW, G.y + G.h - y0); c.clip(); poly(); c.fillStyle = FX.rgba(C.neg, 0.3); c.fill(); c.restore();
        c.restore();
      }
      function areaPtsV(t) {
        const p = [[0, S.v0]];
        for (let i = 0; i < NSEG; i++) { const t1 = Math.min(t, (i + 1) * SEGLEN); if (t1 <= i * SEGLEN) break; p.push([t1, vAt(t1)]); }
        return p;
      }
      function areaPtsA(t) {
        const p = [];
        for (let i = 0; i < NSEG; i++) { const t0 = i * SEGLEN, t1 = Math.min(t, t0 + SEGLEN); if (t1 <= t0) break; p.push([t0, S.acc[i]], [t1, S.acc[i]]); }
        return p;
      }
      /** Accolade verticale à la tête de lecture, du niveau initial à la valeur courante */
      function brace(gi, vStart, vNow, label) {
        const x = PX(S.t), ya = Yg(gi, vStart), yb = Yg(gi, vNow), col = FX.signColor(vNow - vStart, 1e-9), dy = Math.abs(yb - ya);
        if (dy < 1.5 || x - g.L < 4) return;
        clipPlot(gi);
        line(PX(0), ya + 0.5, x, ya + 0.5, FX.rgba(col, 0.55), 1.2, [3, 4]);
        c.restore();
        const bx = Math.max(g.L + 6, x - 9);
        c.save(); c.strokeStyle = col; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath();
        c.moveTo(bx + 5, ya); c.lineTo(bx, ya); c.lineTo(bx, yb); c.lineTo(bx + 5, yb); c.stroke(); c.restore();
        if (dy > 14 && x - g.L > 66) FX.tag(c, label, bx - 6, (ya + yb) / 2, col, 'right', 'middle', g.small ? 9 : 10.5);
      }
      /** Sécante sur [t, t+Δt], tangente et petit triangle Δ / Δt */
      function secantOverlay(gi, fn, slopeT, nameD, unit) {
        const q = secant(fn), col = FX.signColor(q.slope, 1e-6), t = S.t;
        const P = (tt, val) => [PX(tt), Yg(gi, val)], A = P(q.tA, q.yA), B = P(q.tB, q.yB);
        clipPlot(gi);
        // tangente (pente exacte)
        const y = fn(t), e = 1.4;
        const t1 = P(t - e, y - slopeT * e), t2 = P(t + e, y + slopeT * e);
        line(t1[0], t1[1], t2[0], t2[1], FX.rgba(C.texte, 0.65), 1.2, [5, 4]);
        // triangle
        line(A[0], A[1], B[0], A[1], FX.rgba(col, 0.9), 1.3, [3, 3]); line(B[0], A[1], B[0], B[1], FX.rgba(col, 0.9), 1.3, [3, 3]);
        // sécante : prolongement léger puis segment entre les deux points
        const ex = 0.7, a0 = P(q.tA - ex, q.yA - q.slope * ex), b0 = P(q.tB + ex, q.yB + q.slope * ex);
        line(a0[0], a0[1], b0[0], b0[1], FX.rgba(col, 0.35), 1.6);
        line(A[0], A[1], B[0], B[1], col, 3);
        dot(A[0], A[1], 3.2, C.fond, col); dot(B[0], B[1], 3.2, col);
        c.restore();
        if (B[0] - A[0] > 38) FX.tag(c, `Δt = ${f2(q.dt)} s`, (A[0] + B[0]) / 2, A[1] + (B[1] <= A[1] ? 11 : -11), col, 'center', 'middle', 9.5);
        if (Math.abs(B[1] - A[1]) > 24 && B[0] - A[0] > 14) FX.tag(c, `${nameD} sur Δt = ${s2(q.yB - q.yA)} ${unit}`, B[0] + 6, (A[1] + B[1]) / 2, col, 'left', 'middle', 9.5);
      }

      function drawZeros() {
        zeros.forEach(z => {
          const x = PX(z.t), yv = Yg(1, 0), yx = Yg(0, at(z.t).x);
          line(x + 0.5, yx, x + 0.5, yv, FX.rgba(C.ener, 0.35), 1, [2, 4]);
          [[x, yv], [x, yx]].forEach(p => { c.save(); c.translate(p[0], p[1]); c.rotate(Math.PI / 4); c.fillStyle = C.fond; c.strokeStyle = C.ener; c.lineWidth = 1.6; c.fillRect(-3.8, -3.8, 7.6, 7.6); c.strokeRect(-3.8, -3.8, 7.6, 7.6); c.restore(); });
          FX.tag(c, 'v = 0', x + 8, yv - 11, C.ener, 'left', 'middle', 9.5);
          FX.tag(c, `${z.max ? 'x max' : 'x min'} = ${f1(at(z.t).x)} m`, x + 8, yx + (z.max ? -10 : 10), C.ener, 'left', 'middle', 9.5);
        });
      }

      function drawAll() {
        c.clearRect(0, 0, g.w, g.h);
        drawTrack();
        for (let i = 0; i < 3; i++) frameGraph(i);
        const t = S.t, st = at(t);
        if (S.aire) {
          fillArea(1, areaPtsV(t)); if (t > 0) fillArea(2, areaPtsA(t));
        }
        curves();
        drawZeros();
        if (S.aire) { brace(0, S.x0, st.x, `Δx = ${s1(st.x - S.x0)} m`); brace(1, S.v0, st.v, `Δv = ${s1(st.v - S.v0)} m/s`); }
        if (S.pente) { secantOverlay(0, xAt, st.v, 'Δx', 'm'); secantOverlay(1, vAt, st.a, 'Δv', 'm/s'); }
        // tête de lecture et points sur les courbes
        const X = PX(t), y0 = g.gr[0].y - 3, y1 = g.gr[2].y + g.gr[2].h + 3;
        line(X, y0, X, y1, C.ener, 1.6);
        dot(X, y0, 3.5, C.ener); dot(X, y1, 3.5, C.ener);
        [[0, st.x, C.texte, 'm'], [1, st.v, C.accent, 'm/s'], [2, st.a, C.lilas, 'm/s²']].forEach(([gi, val, col, u]) => {
          const Y = Yg(gi, val); dot(X, Y, 4.5, col, C.ener);
          if (S.pente && gi < 2) return;   // la sécante porte déjà ses étiquettes
          const right = X < g.w - g.R - 92 - (g.small ? 0 : 20);
          FX.tag(c, `${s1(val)} ${g.small ? '' : u}`.trim(), X + (right ? 9 : -9), clamp(Y, g.gr[gi].y + 8, g.gr[gi].y + g.gr[gi].h - 8), col, right ? 'left' : 'right', 'middle', g.small ? 9 : 10);
        });
        // axe du temps
        c.save(); c.font = FX.mono(FS()); c.fillStyle = C.texte2; c.textAlign = 'center'; c.textBaseline = 'top';
        for (let k = 0; k <= T; k += 2) c.fillText(String(k), PX(k), y1 + 3);
        c.restore();
        if (X < g.w - g.R - (g.small ? 62 : 92)) FX.tag(c, 't (s)', g.w - 4, y1 + (g.small ? 9 : 11), C.texte2, 'right', 'top', g.small ? 9.5 : 10.5); // sinon « t = … s » porte déjà l'unité
        FX.tag(c, `t = ${f2(t)} s`, clamp(X, g.L + 2, g.w - 40), y1 + (g.small ? 9 : 11), C.ener, 'center', 'top', g.small ? 9.5 : 10.5);
      }

      /* ---------- Panneau : mesures et remarques ---------- */
      const row = (lab, val, unit, k = '', small = false) => `<div class="row${small ? ' small' : ''}"><span class="lab">${lab}</span><span class="val ${k}">${val}<i>${unit}</i></span></div>`;
      function updatePanel() {
        const t = S.t, st = at(t);
        let m = row('t', f2(t), 's', 'ener') + row('x', s2(st.x), 'm') + row('v', s2(st.v), 'm/s', 'acc') + row('a', s2(st.a), 'm/s²', 'lil');
        if (S.pente) {
          const qx = secant(xAt), qv = secant(vAt);
          m += row(`Δx/Δt, [${f2(qx.tA)} ; ${f2(qx.tB)}] s`, s2(qx.slope), 'm/s', cls(qx.slope), true) + row('v(t) lue sur le graphe', s2(st.v), 'm/s', 'acc', true)
            + row(`Δv/Δt, Δt = ${f2(qv.dt)} s`, s2(qv.slope), 'm/s²', cls(qv.slope), true) + row('a(t) lue sur le graphe', s2(st.a), 'm/s²', 'lil', true);
        }
        if (S.aire) {
          const dx = st.x - S.x0, av = areaV(t), dv = st.v - S.v0, aa = areaA(t);
          m += row('aire sous v  (m/s × s)', s2(av), 'm', cls(av), true) + row('Δx = x(t) − x₀', s2(dx), 'm', cls(dx), true)
            + row('aire sous a  (m/s² × s)', s2(aa), 'm/s', cls(aa), true) + row('Δv = v(t) − v₀', s2(dv), 'm/s', cls(dv), true);
        }
        if (m !== lastMeas) { elMeas.innerHTML = m; lastMeas = m; }
        const n = remark(st);
        if (n !== lastNote) { elNote.textContent = n; lastNote = n; }
      }
      /** Remarque qualitative sur l'état à l'instant t */
      function remark(st) {
        const eps = 0.0049, v = st.v, a = st.a;
        if (Math.abs(v) < eps) {
          const vb = at(S.t - 0.01).v, va = at(S.t + 0.01).v;
          if (vb * va < 0) return `v = 0 : le mobile s'arrête et fait demi-tour. x atteint un ${vb > 0 ? 'maximum' : 'minimum'}, la pente de x est nulle.`;
          if (Math.abs(a) < eps) return 'v = 0 et a = 0 : le mobile est à l\'arrêt, x ne change pas.';
          return 'v = 0 un instant, sans demi-tour : x a une pente nulle mais n\'atteint pas d\'extremum.';
        }
        if (Math.abs(a) < eps) return `a = 0 : la vitesse reste constante (${s1(v)} m/s), x est une droite.`;
        return a * v < 0 ? 'a et v de signes opposés : le mobile ralentit.' : 'a et v de même signe : le mobile accélère.';
      }

      /* ---------- Boucle ---------- */
      FX.loop(dt => {
        if (S.playing) { S.t += dt; if (S.t >= T) { S.t = T; S.playing = false; syncControls(); } }
        // transition douce des cadrages
        const k = FX.reduced ? 1 : 1 - Math.exp(-dt * 9);
        for (const key of ['x', 'v', 'trk']) for (let i = 0; i < 2; i++) { const d = tgt[key][i] - view[key][i]; view[key][i] += Math.abs(d) < 1e-4 ? d : d * k; }
        drawAll(); updatePanel();
      }, signal);

      rebuild(); syncControls(); renderHead(); layout();
      cleanup = () => { FX.tip(null); };
    },
    unmount() { if (cleanup) { cleanup(); cleanup = null; } },
  });
})();
</script>

<script>
/* ============ Coquille : onglets, montage et démontage des toys ============ */
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const tabsEl = $('#tabs'), stage = $('#stage'), panel = $('#toyPanel'), controls = $('#toyControls');
  const ordre = ['echelles', 'graphiques', 'vecteurs', 'mouvement'];
  const toys = ordre.map(id => FX.toys.find(t => t.id === id)).filter(Boolean);
  let cur = null, ctrl = null;

  tabsEl.innerHTML = toys.map((t, i) =>
    `<button class="tab" role="tab" data-i="${i}" aria-selected="false" title="${t.num} · ${t.titre} (${i + 1})"><b>${t.num}</b><span>${t.titre}</span></button>`).join('');

  function show(i, push = true) {
    const t = toys[i]; if (!t || t === cur) return;
    if (ctrl) ctrl.abort();
    if (cur && cur.unmount) { try { cur.unmount(); } catch (e) { console.error(e); } }
    FX.tip(null);
    stage.innerHTML = ''; panel.innerHTML = ''; controls.innerHTML = '';
    document.querySelectorAll('.extra-hint').forEach(n => n.remove());
    ctrl = new AbortController(); cur = t;
    tabsEl.querySelectorAll('.tab').forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
    $('#serie').textContent = `Fondations 01·03 — ${t.num} · ${t.titre}`;
    $('#titre').innerHTML = t.titreHtml || t.titre;
    $('#lienComprendre').href = `explication.html#${t.id}`;
    document.title = `${t.titre} — L’invisible en mouvement, Fondations 01·03`;
    if (t.hints) $('#hints').insertAdjacentHTML('beforeend', t.hints.map(h => `<li class="extra-hint">${h}</li>`).join(''));
    t.mount({ scene: stage, panel, controls, signal: ctrl.signal });
    FX.tex(panel); FX.tex(controls);
    panel.classList.remove('swap'); void panel.offsetWidth; panel.classList.add('swap');
    if (push) history.replaceState(null, '', '#' + t.id);
  }

  tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.i); });
  addEventListener('keydown', e => {
    if (FX.typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = +e.key; if (k >= 1 && k <= toys.length) { show(k - 1); e.preventDefault(); }
  });
  addEventListener('hashchange', () => { const i = toys.findIndex(t => '#' + t.id === location.hash); if (i >= 0) show(i, false); });
  const i0 = toys.findIndex(t => '#' + t.id === location.hash);
  show(i0 >= 0 ? i0 : 0, false);
})();
</script>
</body>
